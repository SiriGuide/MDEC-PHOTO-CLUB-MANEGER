    const PHOTO_SIZE = 460;

    function thaiAcademicYearNow() {
      return String(new Date().getFullYear() + 543);
    }

    function todayFileDate() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function downloadFile(filename, content, type = 'application/octet-stream;charset=utf-8') {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeCSV(value) {
      if (value === null || value === undefined) return '""';
      let str = String(value);
      if (/^[0-9]+$/.test(str) && str.length >= 6) return `=""${str}""`;
      str = str.replace(/"/g, '""');
      return `"${str}"`;
    }

    function studentsToCSV(students) {
      const headers = [
        'ปีการศึกษา', 'รหัสนักศึกษา', 'ระดับชั้น', 'กลุ่มเรียน', 'สาขา', 'ชื่อ-นามสกุล', 'ชื่อเล่น',
        'เพศ', 'วันเกิด', 'สถานะ', 'เหตุผลสถานะ', 'เบอร์โทร', 'เบอร์ฉุกเฉิน', 'Line ID',
        'โรคประจำตัว/แพ้อาหาร', 'ฝ่ายที่สนใจตอนสมัคร', 'ฝ่ายปฏิบัติงานจริง', 'อุปกรณ์', 'ประสบการณ์', 'เหตุผลที่สมัคร', 'หมายเหตุเจ้าหน้าที่',
        'ผู้บันทึก', 'วันที่บันทึก'
      ];
      const rows = students.map(s => [
        s.academicYear, s.studentId, s.level, s.group, s.major, s.fullName, s.nickname,
        s.gender, s.dob, statusLabel(s.status), s.statusReason, s.phone, s.emergencyPhone, s.lineId,
        s.medicalCondition, s.interest, s.actualInterest || s.interest || '', s.equipment, s.experience, s.reason, s.staffNotes || '',
        s.createdBy || s.entryMode || '-', s.createdAt || '-'
      ].map(escapeCSV).join(','));
      return '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.join('\n');
    }

    function statusLabel(status) {
      if (status === 'paused') return 'พักกิจกรรม';
      if (status === 'graduated') return 'จบแล้ว';
      if (status === 'dismissed') return 'พ้นสภาพ';
      return 'สมาชิกปัจจุบัน';
    }

    function statusBadge(status) {
      if (status === 'paused') return 'bg-amber-50 text-amber-700 border-amber-100';
      if (status === 'graduated') return 'bg-slate-100 text-slate-700 border-slate-200';
      if (status === 'dismissed') return 'bg-red-50 text-red-700 border-red-100';
      return 'bg-emerald-50 text-emerald-700 border-emerald-100';
    }

    function approxBytesFromDataUrl(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.includes(',')) return 0;
      return Math.round((dataUrl.split(',')[1].length * 3) / 4);
    }

    function prettyBytes(bytes) {
      if (!bytes) return '-';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function optimizeImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !String(file.type || '').startsWith('image/')) {
          reject(new Error('กรุณาเลือกไฟล์รูปภาพเท่านั้น'));
          return;
        }

        const reader = new FileReader();

          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = PHOTO_SIZE;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            const crop = Math.min(iw, ih);
            const sx = Math.max(0, (iw - crop) / 2);
            const sy = Math.max(0, (ih - crop) / 2);

            ctx.drawImage(img, sx, sy, crop, crop, 0, 0, size, size);
            const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);

            resolve({
              dataUrl,
              meta: {
                width: PHOTO_SIZE,
                height: PHOTO_SIZE,
                quality: PHOTO_QUALITY,
                approxBytes: approxBytesFromDataUrl(dataUrl),
                source: 'upload',
                originalName: file.name || '',
                originalBytes: file.size || 0,
                optimizedAt: new Date().toISOString()
              }
            });
          };
          img.onerror = () => reject(new Error('อ่านรูปภาพไม่สำเร็จ ลองเลือกไฟล์รูปอื่น'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
        reader.readAsDataURL(file);
      });
    }

    function isBlank(v) { return !String(v || '').trim(); }

    function isIncompleteStudent(s) {
      return isBlank(s.studentId) || isBlank(s.fullName) || isBlank(s.nickname) || isBlank(s.academicYear) || isBlank(s.level) || isBlank(s.group) || isBlank(s.major) || isBlank(s.phone) || isBlank(s.lineId) || isBlank(s.emergencyPhone) || isBlank(s.interest) || !s.photo;
    }

    function dataQualityMatch(s, key) {
      if (key === 'withPhoto') return !!s.photo;
      if (key === 'noPhoto') return !s.photo;
      if (key === 'incomplete') return isIncompleteStudent(s);
      if (key === 'noPhone') return isBlank(s.phone);
      if (key === 'noLine') return isBlank(s.lineId);
      if (key === 'noEmergency') return isBlank(s.emergencyPhone);
      if (key === 'noInterest') return isBlank(s.interest);
      if (key === 'noActualInterest') return isBlank(s.actualInterest);
      return true;
    }

    function missingSummary(s) {
      const items = [];
      if (!s.photo) items.push('ไม่มีรูป');
      if (isBlank(s.phone)) items.push('ไม่มีเบอร์โทร');
      if (isBlank(s.lineId)) items.push('ไม่มี Line');
      if (isBlank(s.emergencyPhone)) items.push('ไม่มีเบอร์ฉุกเฉิน');
      if (isBlank(s.interest)) items.push('ไม่ระบุฝ่ายสนใจ');
      if (isBlank(s.actualInterest)) items.push('ยังไม่กำหนดฝ่ายจริง');
      return items.length ? items.join(' · ') : 'ข้อมูลครบถ้วน';
    }

    function buildStats(students, targetYear) {
      const target = targetYear === 'all' ? students : students.filter(s => s.academicYear === targetYear);
      const res = { total: target.length, active:0, paused:0, graduated:0, dismissed:0, male:0, female:0, lgbt:0, withPhoto:0, noPhoto:0, incomplete:0, noPhone:0, noLine:0, noEmergency:0, noActualInterest:0, levels:{}, majors:{}, interests:{}, actualInterests:{} };
      target.forEach(s => {
        const status = s.status || 'active';
        if (status === 'graduated') res.graduated++;
        else if (status === 'dismissed') res.dismissed++;
        else if (status === 'paused') res.paused++;
        else res.active++;
        if (s.gender === 'ชาย') res.male++;
        else if (s.gender === 'หญิง') res.female++;
        else res.lgbt++;
        if (s.photo) res.withPhoto++; else res.noPhoto++;
        if (isIncompleteStudent(s)) res.incomplete++;
        if (isBlank(s.phone)) res.noPhone++;
        if (isBlank(s.lineId)) res.noLine++;
        if (isBlank(s.emergencyPhone)) res.noEmergency++;
        if (isBlank(s.actualInterest)) res.noActualInterest++;
        if (s.level) res.levels[s.level] = (res.levels[s.level] || 0) + 1;
        if (s.major) res.majors[s.major] = (res.majors[s.major] || 0) + 1;
        if (s.interest) res.interests[s.interest] = (res.interests[s.interest] || 0) + 1;
        if (s.actualInterest) res.actualInterests[s.actualInterest] = (res.actualInterests[s.actualInterest] || 0) + 1;
      });
      return res;
    }

    function Pagination({ currentPage, totalPages, setCurrentPage }) {
      const pages = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) pages.push(i);
      }
      const uniquePages = [...new Set(pages)].sort((a,b) => a-b);
      return (
        <div className="bg-white rounded-[2rem] soft-shadow border border-white p-4 flex flex-wrap items-center justify-center gap-2 no-print">
          <button disabled={currentPage <= 1} onClick={() => setCurrentPage(p => Math.max(1, p-1))} className="px-4 py-2 rounded-xl bg-slate-100 font-bold disabled:opacity-40"><i className="ri-arrow-left-s-line"></i> ก่อนหน้า</button>

            <React.Fragment key={p}>
              {idx > 0 && p - uniquePages[idx-1] > 1 && <span className="px-2 text-slate-400">...</span>}
              <button onClick={() => setCurrentPage(p)} className={`w-10 h-10 rounded-xl font-bold ${p === currentPage ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{p}</button>

    function StudentForm({ mode, student, majors, currentAcademicYear, allStudents = [], onDone }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const [cameraOn, setCameraOn] = useState(false);
      const [saving, setSaving] = useState(false);
      const [formData, setFormData] = useState(() => ({
        studentId: student?.studentId || '',
        fullName: student?.fullName || '',
        nickname: student?.nickname || '',
        dob: student?.dob || '',
        gender: student?.gender || 'ชาย',
        phone: student?.phone || '',
        lineId: student?.lineId || '',
        emergencyPhone: student?.emergencyPhone || '',
        medicalCondition: student?.medicalCondition || '-',
        academicYear: student?.academicYear || currentAcademicYear,
        level: student?.level || 'ปวช.1',
        group: student?.group || '',
        major: student?.major || majors[0] || '',
        interest: student?.interest || 'ฝ่ายภาพนิ่ง',
        equipment: student?.equipment || 'ใช้มือถือเป็นหลัก',
        experience: student?.experience || 'ระดับเริ่มต้น',
        reason: student?.reason || '',
        status: student?.status || 'active',
        statusReason: student?.statusReason || '',
        actualInterest: student?.actualInterest || '',
        staffNotes: student?.staffNotes || '',
        photo: student?.photo || null,
        photoMeta: student?.photoMeta || null
      }));

      useEffect(() => () => stopCamera(), []);

      const setField = (name, value) => setFormData(prev => ({ ...prev, [name]: value }));

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
          streamRef.current = stream;
          if (videoRef.current) videoRef.current.srcObject = stream;
          setCameraOn(true);
        } catch (err) {
          alert('ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์การใช้กล้อง หรือเปิดผ่าน HTTPS/localhost');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setCameraOn(false);
      };

      const capturePhoto = () => {
        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas || !video.videoWidth) return alert('กล้องยังไม่พร้อม ลองรอสักครู่แล้วกดถ่ายใหม่');
        const size = PHOTO_SIZE;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const crop = Math.min(vw, vh);
        const sx = (vw - crop) / 2;
        const sy = (vh - crop) / 2;
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, crop, crop, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
        setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: { width: PHOTO_SIZE, height: PHOTO_SIZE, quality: PHOTO_QUALITY, approxBytes: approxBytesFromDataUrl(dataUrl), source: 'camera', optimizedAt: new Date().toISOString() } }));
        stopCamera();
      };

      const handleUploadPhoto = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        try {
          const { dataUrl, meta } = await optimizeImageFile(file);
          setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: meta }));
          stopCamera();
        } catch (err) {
          alert(err.message || 'อัปโหลดรูปไม่สำเร็จ');
        } finally {
          event.target.value = '';
        }
      };

      const resetForm = () => {
        setFormData({
          studentId:'', fullName:'', nickname:'', dob:'', gender:'ชาย', phone:'', lineId:'', emergencyPhone:'', medicalCondition:'-',
          academicYear: currentAcademicYear, level:'ปวช.1', group:'', major: majors[0] || '', interest:'ฝ่ายภาพนิ่ง', equipment:'ใช้มือถือเป็นหลัก', experience:'ระดับเริ่มต้น', reason:'', status:'active', statusReason:'', actualInterest:'', staffNotes:'', photo:null, photoMeta:null
        });
      };

      const submit = async e => {
        e.preventDefault();

        if (!formData.photo) {
          const ok = confirm('ยังไม่มีรูปถ่าย ต้องการบันทึกโดยไม่มีรูปหรือไม่?');
          if (!ok) return;
        }
        const normalizedStudentId = String(formData.studentId || '').trim();
        const normalizedYear = String(formData.academicYear || currentAcademicYear).trim();
        const duplicateLocal = allStudents.find(s => String(s.studentId || '').trim() === normalizedStudentId && String(s.academicYear || '').trim() === normalizedYear && s.id !== student?.id);
        if (duplicateLocal) {
          alert(`พบข้อมูลซ้ำ: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${duplicateLocal.fullName || '-'}`);
          return;
        }
        setSaving(true);
        const payload = {
          ...formData,
          studentId: normalizedStudentId,
          academicYear: normalizedYear,
          updatedAt: new Date().toISOString(),
          entryMode: 'staff_manual',
          source: 'paper_form',
          createdBy: 'เจ้าหน้าที่'
        };
        try {
          const duplicateSnap = await getStudentsRef().where('studentId', '==', normalizedStudentId).where('academicYear', '==', normalizedYear).get();
          const duplicateDoc = duplicateSnap.docs.find(d => d.id !== student?.id);
          if (duplicateDoc) {
            const d = duplicateDoc.data() || {};
            alert(`พบข้อมูลซ้ำในฐานข้อมูล: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${d.fullName || '-'}`);

            resetForm();
            onDone && onDone();
          }
        } catch (err) {

        } finally {
          setSaving(false);
        }
      };

      return (

            <div className="grid md:grid-cols-2 gap-4">
              <Input label="รหัสนักศึกษา *" value={formData.studentId} onChange={v => setField('studentId', v)} placeholder="เช่น 673228359" />

              <Select label="ระดับชั้น *" value={formData.level} onChange={v => setField('level', v)} options={['ปวช.1','ปวช.2','ปวช.3','ปวส.1','ปวส.2']} />
              <Input label="กลุ่มเรียน/ห้อง *" value={formData.group} onChange={v => setField('group', v)} placeholder="เช่น 1/1" />

            </div>

            <SectionTitle icon="ri-user-heart-fill" title="ข้อมูลส่วนตัว" desc="ข้อมูลสำหรับติดต่อและจัดทำทะเบียน" />

              <label className="py-3 rounded-2xl bg-cyan-600 hover:bg-cyan-700 font-bold text-center cursor-pointer transition">

              <button type="button" onClick={() => setFormData(prev => ({ ...prev, photo: null, photoMeta: null }))} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">ลบรูป</button>
              <button type="button" onClick={stopCamera} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">ปิดกล้อง</button>
            </div>
            <p className="text-xs text-slate-500 text-center mb-5">รองรับรูปจากคอม มือถือ หรือกล้องถ่ายรูป ระบบจะครอปเป็นสี่เหลี่ยมจัตุรัสให้อัตโนมัติ</p>

            <button type="submit" disabled={saving} className="w-full py-4 rounded-2xl bg-white text-slate-950 font-extrabold text-lg hover:bg-blue-50 transition disabled:opacity-50 active:scale-[.98]">
              {saving ? 'กำลังบันทึก...' : mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกสมาชิกใหม่'}
            </button>
            <p className="text-xs text-slate-500 text-center mt-4">ระบบจะบันทึกเป็นข้อมูลที่เจ้าหน้าที่คีย์จากใบสมัคร</p>
          </div>
        </form>
      );
    }

      useEffect(() => { setConfirmText(''); setBackupConfirmed(false); }, [year]);
      useEffect(() => {
        const unsub = getSettingsRef().onSnapshot(doc => setBackupLogs((doc.data()?.backupLogs || []).slice(0, 8)));
        return () => unsub();
      }, []);
      const recordBackupLog = async (type) => {
        const entry = { type, academicYear: year, total: selected.length, at: new Date().toISOString() };
        const next = [entry, ...backupLogs].slice(0, 20);
        setBackupLogs(next);
        await getSettingsRef().set({ backupLogs: next }, { merge: true });
      };
      const selected = students.filter(s => s.academicYear === year);
      const stats = buildStats(students, year);
      const clearCode = `CLEAR ${year}`;

      const backupJSON = () => {
        if (!selected.length) return alert('ปีนี้ยังไม่มีข้อมูลให้สำรอง');
        const payload = {
          system: 'MDEC Photo Club Registry',
          backupType: 'academic_year_full_backup',
          academicYear: year,
          exportedAt: new Date().toISOString(),
          total: selected.length,
          students: selected
        };
        downloadFile(`MDEC_PhotoClub_Backup_${year}_${todayFileDate()}.json`, JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
        recordBackupLog('JSON');
      };

      const backupCSV = () => {
        if (!selected.length) return alert('ปีนี้ยังไม่มีข้อมูลให้ส่งออก');
        downloadFile(`MDEC_PhotoClub_Members_${year}_${todayFileDate()}.csv`, studentsToCSV(selected), 'text/csv;charset=utf-8');
        recordBackupLog('CSV');
      };

      const clearYear = async () => {
        if (!backupConfirmed) return alert('กรุณาติ๊กยืนยันว่าได้สำรองข้อมูล JSON และ CSV เรียบร้อยแล้ว');
        if (confirmText !== clearCode) return alert(`กรุณาพิมพ์ ${clearCode} ให้ถูกต้อง`);
        const ok = confirm(`ยืนยันล้างข้อมูลสมาชิกปีการศึกษา ${year} จำนวน ${selected.length} รายการ?\nควรสำรองข้อมูล JSON และ CSV ก่อนล้างทุกครั้ง`);
        if (!ok) return;
        setBusy(true);
        try {
          const snap = await getStudentsRef().where('academicYear','==',year).get();
          const docs = snap.docs;
          for (let i = 0; i < docs.length; i += 450) {
            const batch = db.batch();
            docs.slice(i, i + 450).forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          }
          alert(`ล้างข้อมูลปีการศึกษา ${year} เรียบร้อย`);
          setConfirmText('');
        } catch (err) {
          alert('ล้างข้อมูลไม่สำเร็จ: ' + err.message);
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-6 flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
            <div><h3 className="text-2xl font-extrabold">จัดการข้อมูลแบบปีต่อปี</h3><p className="text-slate-500">สำรองข้อมูลก่อนล้างข้อมูลเพื่อเริ่มรับสมัครปีใหม่</p></div>
            <select value={year} onChange={e => setYear(e.target.value)} className="px-4 py-3 rounded-2xl bg-blue-50 border-2 border-blue-100 text-blue-800 font-bold outline-none focus:border-blue-500">
              {yearsList.map(y => <option key={y} value={y}>ปีการศึกษา {y}</option>)}
            </select>
          </div>

          <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-5">
            <StatCard icon="ri-team-fill" label="สมาชิกปีนี้" value={stats.total} tone="blue" />
            <StatCard icon="ri-image-fill" label="มีรูปถ่าย" value={stats.withPhoto} tone="cyan" />
            <StatCard icon="ri-user-star-fill" label="สมาชิกปัจจุบัน" value={stats.active} tone="green" />
            <StatCard icon="ri-user-unfollow-fill" label="พ้นสภาพ" value={stats.dismissed} tone="orange" />
          </div>

          <div className="grid lg:grid-cols-2 gap-5">
            <div className="bg-white rounded-[2rem] soft-shadow border border-white p-6">
              <h3 className="font-extrabold text-xl mb-3"><i className="ri-download-cloud-2-fill text-blue-600 mr-2"></i>สำรองข้อมูลปีการศึกษา {year}</h3>
              <p className="text-slate-500 mb-6">แนะนำให้ดาวน์โหลดทั้ง JSON และ CSV แล้วเก็บไว้ใน Google Drive ของศูนย์</p>
              <div className="grid sm:grid-cols-2 gap-3">
                <button onClick={backupJSON} className="py-4 rounded-2xl bg-slate-950 text-white font-bold hover:bg-slate-800"><i className="ri-braces-fill mr-2"></i>Backup .JSON</button>
                <button onClick={backupCSV} className="py-4 rounded-2xl bg-emerald-600 text-white font-bold hover:bg-emerald-700"><i className="ri-file-excel-2-fill mr-2"></i>Export CSV</button>
              </div>
              <div className="mt-5 rounded-3xl bg-slate-50 border border-slate-100 p-4">
                <h4 className="font-extrabold mb-2"><i className="ri-history-fill text-blue-600 mr-2"></i>Backup Log ล่าสุด</h4>
                {backupLogs.length ? backupLogs.slice(0,5).map((log,idx) => <div key={idx} className="flex justify-between gap-3 text-sm py-2 border-t border-slate-100"><span>{log.type} · ปี {log.academicYear} · {log.total} รายการ</span><span className="text-slate-500">{new Date(log.at).toLocaleString('th-TH')}</span></div>) : <p className="text-sm text-slate-400">ยังไม่มีประวัติการสำรองข้อมูล</p>}
              </div>
            </div>

            <div className="bg-red-50 rounded-[2rem] border border-red-100 p-6">
              <h3 className="font-extrabold text-xl text-red-800 mb-3"><i className="ri-error-warning-fill mr-2"></i>โซนอันตราย: ล้างข้อมูลรายปี</h3>
              <p className="text-red-700/80 mb-5">การล้างข้อมูลจะลบเฉพาะสมาชิกปีการศึกษา {year} เท่านั้น ไม่ลบรายชื่อสาขาหรือการตั้งค่าระบบ</p>
              <label className="flex items-start gap-3 bg-white/80 border border-red-100 rounded-2xl p-4 mb-4 cursor-pointer">
                <input type="checkbox" checked={backupConfirmed} onChange={e => setBackupConfirmed(e.target.checked)} className="mt-1 w-5 h-5 accent-red-600" />
                <span className="text-sm font-bold text-red-800 leading-relaxed">ยืนยันว่าได้ดาวน์โหลด Backup .JSON และ Export CSV ของปีการศึกษา {year} เรียบร้อยแล้ว</span>
              </label>
              <label className="block mb-4">
                <span className="block text-sm font-bold text-red-800 mb-2">พิมพ์รหัสยืนยัน: {clearCode}</span>
                <input value={confirmText} onChange={e => setConfirmText(e.target.value)} className="w-full px-4 py-3 rounded-2xl border-2 border-red-100 outline-none focus:border-red-500 font-bold bg-white" placeholder={clearCode} />
              </label>
              <button disabled={busy || !backupConfirmed || confirmText !== clearCode || selected.length === 0} onClick={clearYear} className="w-full py-4 rounded-2xl bg-red-600 text-white font-extrabold disabled:opacity-40 hover:bg-red-700">
                {busy ? 'กำลังล้างข้อมูล...' : `ล้างข้อมูลปีการศึกษา ${year}`}
              </button>
            </div>
          </div>
        </div>
      );

    function ImportPage({ currentAcademicYear, majors, onDone }) {
      const [bulkData, setBulkData] = useState('');
      const [importing, setImporting] = useState(false);
      const fileInputRef = useRef(null);

      const importRows = async () => {
        const rows = bulkData.trim().split('\n').filter(Boolean);
        if (!rows.length) return alert('กรุณาวางข้อมูลจาก Excel ก่อน');
        setImporting(true);
        let count = 0;
        try {
          for (const row of rows) {
            const c = row.split('\t').map(x => x.trim());
            if (!c[0] || !c[1]) continue;
            await getStudentsRef().add({
              studentId: c[0] || '', fullName: c[1] || '', nickname: c[2] || '', phone: c[3] || '',
              level: c[4] || 'ปวช.1', group: c[5] || '', major: c[6] || majors[0] || '', academicYear: c[7] || currentAcademicYear,
              gender: c[8] || 'ชาย', lineId: c[9] || '', emergencyPhone: c[10] || '', medicalCondition: c[11] || '-',
              interest: c[12] || 'ฝ่ายภาพนิ่ง', actualInterest: c[13] || '', equipment: c[14] || 'ใช้มือถือเป็นหลัก', experience: c[15] || 'ระดับเริ่มต้น', reason: c[16] || '', staffNotes: c[17] || '',
              status: 'active', photo: null, entryMode: 'staff_import', source: 'excel_paste', createdBy: 'เจ้าหน้าที่', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
            });
            count++;
          }
          alert(`นำเข้าสำเร็จ ${count} รายการ`);
          setBulkData('');
          onDone && onDone();
        } catch (err) { alert('นำเข้าไม่สำเร็จ: ' + err.message); }
        finally { setImporting(false); }
      };

      const handleBackupFile = e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const data = JSON.parse(reader.result);
            const students = Array.isArray(data.students) ? data.students : [];
            if (!students.length) return alert('ไม่พบข้อมูล students ในไฟล์ Backup');
            const ok = confirm(`ต้องการนำเข้า Backup จำนวน ${students.length} รายการหรือไม่?`);
            if (!ok) return;
            setImporting(true);
            for (const item of students) {
              const copy = { ...item };
              delete copy.id;
              await getStudentsRef().add({ ...copy, importedAt: new Date().toISOString(), entryMode: 'json_restore' });
            }
            alert('นำเข้า Backup JSON เรียบร้อย');
            onDone && onDone();
          } catch (err) { alert('อ่านไฟล์ Backup ไม่สำเร็จ: ' + err.message); }
          finally { setImporting(false); if (fileInputRef.current) fileInputRef.current.value = ''; }
        };
        reader.readAsText(file);
      };

      return (
        <div className="grid xl:grid-cols-[1fr_.8fr] gap-5">
          <div className="bg-slate-950 text-white rounded-[2rem] soft-shadow p-6 md:p-8">
            <div className="flex items-center gap-3 mb-5"><div className="w-12 h-12 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center text-2xl"><i className="ri-file-excel-2-fill"></i></div><div><h3 className="text-2xl font-extrabold">นำเข้าจาก Excel</h3><p className="text-slate-400">คัดลอกข้อมูลจากตารางแล้ววางลงช่องนี้</p></div></div>
            <div className="rounded-3xl bg-white/5 border border-white/10 p-4 text-sm text-slate-300 mb-5 leading-relaxed">
              ลำดับคอลัมน์ที่รองรับ: <span className="text-emerald-300 font-bold">รหัส | ชื่อ-สกุล | ชื่อเล่น | โทร | ระดับ | กลุ่ม | สาขา | ปี | เพศ | Line | เบอร์ฉุกเฉิน | โรคประจำตัว | ฝ่ายสนใจ | ฝ่ายจริง | อุปกรณ์ | ประสบการณ์ | เหตุผล | หมายเหตุ</span>
            </div>
            <textarea value={bulkData} onChange={e => setBulkData(e.target.value)} className="w-full h-80 p-5 rounded-3xl bg-slate-900 border-2 border-slate-800 outline-none focus:border-emerald-500 font-mono text-sm text-white resize-none" placeholder="วางข้อมูลจาก Excel ที่นี่..."></textarea>
            <button disabled={importing || !bulkData.trim()} onClick={importRows} className="mt-5 w-full py-4 rounded-2xl bg-emerald-600 text-white font-extrabold hover:bg-emerald-700 disabled:opacity-40">
              {importing ? 'กำลังนำเข้า...' : 'นำเข้าข้อมูลเข้าสู่ระบบ'}
            </button>
          </div>

          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-6 md:p-8 h-fit">
            <h3 className="text-2xl font-extrabold mb-3"><i className="ri-upload-cloud-2-fill text-blue-600 mr-2"></i>กู้คืนจาก Backup JSON</h3>
            <p className="text-slate-500 mb-6">ใช้สำหรับนำไฟล์สำรองรายปีกลับเข้าระบบ หากต้องการเปิดดูข้อมูลเก่าอีกครั้ง</p>
            <input ref={fileInputRef} type="file" accept=".json,application/json" onChange={handleBackupFile} className="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-5 file:rounded-2xl file:border-0 file:bg-blue-600 file:text-white file:font-bold hover:file:bg-blue-700" />
            <div className="mt-6 rounded-3xl bg-blue-50 border border-blue-100 p-5 text-sm text-blue-800 leading-relaxed"><strong>หมายเหตุ:</strong> การกู้คืน JSON จะเพิ่มข้อมูลเป็นรายการใหม่ ไม่เขียนทับรายการเดิม เพื่อป้องกันข้อมูลหายโดยไม่ตั้งใจ</div>
          </div>
        </div>
      );
    }

    function SettingsPage({ majors, setMajors, currentAcademicYear, setCurrentAcademicYear }) {
      const [newMajor, setNewMajor] = useState('');
      const [year, setYear] = useState(currentAcademicYear);
      const saveSettings = async (nextMajors = majors, nextYear = year) => {
        await getSettingsRef().set({ majors: nextMajors, currentAcademicYear: String(nextYear), updatedAt: new Date().toISOString() }, { merge: true });
      };
      const addMajor = async () => {
        const name = newMajor.trim();
        if (!name) return;
        if (majors.includes(name)) return alert('มีสาขานี้อยู่แล้ว');
        const next = [...majors, name];
        await saveSettings(next, year);
        setMajors(next);
        setNewMajor('');
      };
      const removeMajor = async index => {
        const next = majors.filter((_, i) => i !== index);
        await saveSettings(next, year);
        setMajors(next);
      };
      const saveYear = async () => {
        await saveSettings(majors, year);
        setCurrentAcademicYear(String(year));
        alert('บันทึกปีการศึกษาปัจจุบันเรียบร้อย');
      };
      return (
        <div className="grid xl:grid-cols-2 gap-5">
          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-6 md:p-8">
            <h3 className="text-2xl font-extrabold mb-2"><i className="ri-calendar-2-fill text-blue-600 mr-2"></i>ปีการศึกษาปัจจุบัน</h3>
            <p className="text-slate-500 mb-6">หน้าเพิ่มสมาชิกใหม่จะใช้ค่านี้เป็นปีเริ่มต้น</p>
            <div className="flex gap-3">
              <input value={year} onChange={e => setYear(e.target.value)} className="flex-1 px-4 py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-extrabold text-xl" />
              <button onClick={saveYear} className="px-6 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700">บันทึก</button>

          <div className="bg-slate-950 text-white rounded-[2rem] soft-shadow p-6 md:p-8">
            <h3 className="text-2xl font-extrabold mb-2"><i className="ri-school-fill text-blue-300 mr-2"></i>รายชื่อสาขาวิชา</h3>
            <p className="text-slate-400 mb-6">เพิ่ม/ลบสาขาที่ใช้ในฟอร์มคีย์ข้อมูล</p>
            <div className="flex gap-3 mb-6">
              <input value={newMajor} onChange={e => setNewMajor(e.target.value)} className="flex-1 px-4 py-4 rounded-2xl bg-white/10 border border-white/10 outline-none focus:border-blue-400 font-bold" placeholder="ชื่อสาขาใหม่" />
              <button onClick={addMajor} className="px-6 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700">เพิ่ม</button>
            </div>
            <div className="flex flex-wrap gap-2">
              {majors.map((m,i) => <span key={m+i} className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/10 border border-white/10 font-bold text-sm">{m}<button onClick={() => removeMajor(i)} className="text-slate-400 hover:text-red-400"><i className="ri-close-fill text-xl"></i></button></span>)}
            </div>
          </div>
        </div>
      );
    }

          <div className="no-print flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-6 pb-5 border-b">
            <div>
              <h2 className="font-extrabold text-2xl">พิมพ์รายงานสมาชิก</h2>
              <p className="text-slate-500">เลือกได้ 3 แบบ: รายงานตาราง ทำเนียบรูปภาพ หรือใบเซ็นชื่อแบบประหยัดพื้นที่</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <div className="flex p-1 bg-slate-100 rounded-2xl border border-slate-200">
                <button onClick={() => setReportMode('table')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='table' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>รายงานตาราง</button>
                <button onClick={() => setReportMode('directory')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='directory' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>ทำเนียบรูปภาพ</button>
                <button onClick={() => setReportMode('sign')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='sign' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>ใบเซ็นชื่อ</button>
              </div>
              <button onClick={() => window.print()} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-bold"><i className="ri-printer-fill mr-2"></i>พิมพ์ / Save PDF</button>
              <button onClick={onClose} className="px-5 py-3 rounded-2xl bg-slate-100 font-bold">ปิด</button>
            </div>
          </div>

          {students.length > 300 && reportMode === 'directory' && <div className="no-print mb-5 p-4 rounded-3xl bg-orange-50 border border-orange-100 text-orange-800 text-sm"><i className="ri-alert-fill mr-2"></i><b>แนะนำ:</b> ทำเนียบรูปภาพมีมากกว่า 300 รายการ ควรกรองตามระดับชั้น/สาขา/ฝ่ายก่อนพิมพ์ เพื่อให้ไฟล์ PDF ไม่หนักเกินไป</div>}

          <section className={`report-page ${reportMode === 'sign' ? 'sign-report' : ''}`}>
            <div className="report-header">
              <div className="report-brand">
                <div className="report-logo"><img src={MDEC_LOGO} alt="MDEC" /></div>
                <div>
                  <div className="report-title">{reportMode === 'table' ? 'รายงานทะเบียนสมาชิกชมรม MDEC PHOTO CLUB' : reportMode === 'sign' ? 'ใบรายชื่อสมาชิกสำหรับเซ็นชื่อ' : 'ทำเนียบรูปภาพสมาชิกชมรม MDEC PHOTO CLUB'}</div>
                  <div className="report-subtitle">ภายใต้การดูแลของศูนย์มัลติมีเดียทางการศึกษา • วิทยาลัยเทคโนโลยีภาคตะวันออก (อี.เทค)</div>
                </div>
              </div>
              <div className="report-meta">
                <div><strong>ปีการศึกษา:</strong> {yearText}</div>
                <div><strong>วันที่ออกรายงาน:</strong> {reportDate}</div>
                <div><strong>เวลา:</strong> {reportTime} น.</div>
              </div>
            </div>

            {reportMode !== 'sign' && (
              <div className="report-summary">
                <div className="report-summary-card"><div className="report-summary-label">สมาชิกทั้งหมด</div><div className="report-summary-value">{students.length}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">กำลังศึกษา/ใช้งาน</div><div className="report-summary-value">{activeCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">จบแล้ว</div><div className="report-summary-value">{graduatedCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">พ้นสภาพ</div><div className="report-summary-value">{dismissedCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">มีรูปถ่าย</div><div className="report-summary-value">{photoCount}</div></div>
              </div>
            )}

            <div className="report-note">
              <span>หมายเหตุ: รายงานนี้แสดงตามตัวกรองที่เลือกในหน้า “ฐานข้อมูลสมาชิก” ก่อนกดพิมพ์</span>
              <span>{reportMode === 'sign' ? 'รูปแบบ: ใบรายชื่อเซ็นชื่อ' : `${reportMode === 'table' ? 'รูปแบบ: รายงานตาราง' : 'รูปแบบ: ทำเนียบรูปภาพ'} | รวม ${students.length} รายการ`}</span>
            </div>

            {reportMode === 'table' ? (
            <table className="print-table">
              <thead>
                <tr>
                  <th style={{width:'34px', textAlign:'center'}}>ลำดับ</th>
                  <th style={{width:'58px', textAlign:'center'}}>รูป</th>
                  <th style={{width:'82px'}}>รหัส นศ.</th>
                  <th style={{width:'190px'}}>ชื่อ - นามสกุล</th>
                  <th style={{width:'118px'}}>ระดับ/กลุ่ม</th>
                  <th>สาขาวิชา</th>
                  <th style={{width:'120px'}}>เบอร์โทร / Line</th>
                  <th style={{width:'125px'}}>ฝ่ายที่สนใจ</th>
                  <th style={{width:'78px', textAlign:'center'}}>สถานะ</th>
                </tr>
              </thead>
              <tbody>
                {students.map((s, index) => (
                  <tr key={s.id || index}>
                    <td style={{textAlign:'center'}}>{index + 1}</td>
                    <td style={{textAlign:'center'}}><img src={s.photo || 'https://via.placeholder.com/100?text=NO'} className="print-img mx-auto" /></td>
                    <td>{s.studentId || '-'}</td>
                    <td><div className="print-name">{s.fullName || '-'}</div><div className="print-muted">ชื่อเล่น: {s.nickname || '-'}</div></td>
                    <td><div>{s.level || '-'}</div><div className="print-muted">กลุ่ม {s.group || '-'}</div></td>
                    <td>{s.major || '-'}</td>
                    <td><div>{s.phone || '-'}</div><div className="print-muted">Line: {s.lineId || '-'}</div></td>
                    <td><span className="print-pill">{s.interest || '-'}</span></td>
                    <td style={{textAlign:'center'}}>{statusLabel(s.status)}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            ) : reportMode === 'sign' ? (
              <table className="print-table sign-table">
                <thead>
                  <tr>
                    <th style={{width:'34px', textAlign:'center'}}>ลำดับ</th>
                    <th style={{width:'82px'}}>รหัส นศ.</th>
                    <th>ข้อมูลสมาชิก</th>
                    <th style={{width:'135px'}}>ลายเซ็น</th>
                    <th style={{width:'105px'}}>หมายเหตุ</th>
                  </tr>
                </thead>
                <tbody>{students.map((s,index) => <tr key={s.id || index}><td style={{textAlign:'center'}}>{index+1}</td><td>{s.studentId || '-'}</td><td><div className="print-name">{s.fullName || '-'} {s.nickname ? <span className="print-muted">({s.nickname})</span> : null}</div><div className="print-muted">{s.level || '-'} / {s.group || '-'}{s.major ? ` | ${s.major}` : ''}</div></td><td></td><td></td></tr>)}</tbody>
              </table>
            ) : (
              <div className="directory-grid">
                {students.map((s, index) => (
                  <div key={s.id || index} className="directory-card">
                    <img src={s.photo || 'https://via.placeholder.com/120?text=NO'} className="directory-img" />
                    <div className="min-w-0">
                      <div className="directory-nickname">{s.nickname || '-'}</div>
                      <div className="directory-name">{s.fullName || '-'}</div>
                      <div className="directory-meta">รหัส: {s.studentId || '-'} | {s.level || '-'} / {s.group || '-'}</div>
                      <div className="directory-meta">{s.major || '-'}</div>
                      <span className="directory-pill">{s.interest || '-'}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="print-footer">
              <div>เอกสารนี้จัดทำจากระบบทะเบียนสมาชิก MDEC Photo Club</div>
              <div className="signature-zone">
                <div className="signature-line">ผู้จัดทำรายงาน</div>
                <div className="signature-line">ผู้ตรวจสอบ</div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
