              <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{monthlyRows.map((row,idx) => <div key={row.student.id} className="student-rank-card p-4"><div className="text-sm text-blue-600 font-black">อันดับ {idx+1}</div><div className="text-xl font-black text-slate-950">{studentDutyName(row.student)}</div><div className="text-sm text-slate-500">มีส่วนร่วม {row.monthlyCount} รายการ • คะแนนเดือน {row.monthlyScore}</div></div>)}</div>
              {!monthlyRows.length && <div className="student-rank-card p-8 text-center text-slate-500 font-bold">เดือนนี้ยังไม่มีข้อมูลกิจกรรม/เวร/ผลงาน</div>}
            </section>
          )}

          {tab === 'wizard' && (
            <section className="smart-panel p-5 md:p-6">
              <h3 className="text-2xl font-black text-slate-950 mb-4"><i className="ri-checkbox-multiple-fill text-blue-600 mr-2"></i>ปิดปีการศึกษาแบบ Wizard</h3>
              <div className="grid lg:grid-cols-2 gap-4">
                {[['checked','1. ตรวจข้อมูลค้าง','ตรวจสมาชิกไม่มีรูป ข้อมูลไม่ครบ กิจกรรมยังไม่ปิดสถานะ'],['backup','2. สำรองข้อมูล','ดาวน์โหลดไฟล์สำรองของปีนี้'],['report','3. สรุปรายงานประจำปี','ใช้ข้อมูลสรุปประจำปีและสมาชิกดีเด่น'],['confirm','4. ยืนยันก่อนล้างข้อมูล','ยืนยันว่าเก็บไฟล์สำรองแล้วก่อนจัดการปีใหม่']].map(([key,title,desc]) => <button key={key} onClick={() => setWizard(prev => ({ ...prev, [key]: !prev[key] }))} className={`wizard-step text-left ${wizard[key] ? 'done' : ''}`}><div className="font-black text-slate-950">{wizard[key] ? '✅ ' : ''}{title}</div><div className="text-sm text-slate-500">{desc}</div></button>)}
              </div>
              <div className="mt-5 flex flex-wrap gap-3">
                <button onClick={() => downloadFile(`MDEC_Backup_${year}_${todayFileDate()}.json`, backupPayload(), 'application/json;charset=utf-8')} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-extrabold"><i className="ri-download-cloud-2-fill mr-1"></i>ดาวน์โหลด Backup ปีนี้</button>
                <button onClick={() => onNavigate('annual')} className="px-5 py-3 rounded-2xl bg-slate-950 text-white font-extrabold"><i className="ri-file-chart-fill mr-1"></i>ไปหน้าสรุปประจำปี</button>
                <button onClick={() => onNavigate('year')} className="px-5 py-3 rounded-2xl bg-rose-900 text-rose-100 font-extrabold"><i className="ri-database-2-fill mr-1"></i>ไปจัดการปี/ล้างข้อมูล</button>
              </div>
            </section>
          )}
        </div>
      );
    }

    function DutySchedulePage({ students, currentAcademicYear, yearsList }) {
      const [duties, setDuties] = useState([]);
      const [templates, setTemplates] = useState({});
      const [loading, setLoading] = useState(true);
      const [year, setYear] = useState(currentAcademicYear);
      const [search, setSearch] = useState('');
      const [form, setForm] = useState(() => createDutyForm(currentAcademicYear));
      const [editingId, setEditingId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [isPrinting, setIsPrinting] = useState(false);
      const [studentPicker, setStudentPicker] = useState({ open:false, dayKey:'', roleKey:'', slot:0, query:'', years:[], levels:[], groups:[], interests:[], groupSearch:'' });
      const [recentPickerStudentIds, setRecentPickerStudentIds] = useState(() => {
        try {
          const raw = localStorage.getItem('mdec_recent_duty_picker_students');
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter(Boolean).slice(0, 8) : [];
        } catch (error) {
          return [];
        }
      });
      const [studentPickerFiltersOpen, setStudentPickerFiltersOpen] = useState(false);
      const [attendanceDutyId, setAttendanceDutyId] = useState(null);
      const [attendanceDayKey, setAttendanceDayKey] = useState(dutyDays[0].key);
      const [plannerDayKey, setPlannerDayKey] = useState(dutyDays[0].key);
      const [dutyManagePanel, setDutyManagePanel] = useState('planner');

      useEffect(() => {
        const unsub = getDutyRef().onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
          setDuties(data);
          setLoading(false);
        }, err => {
          console.error(err);
          setLoading(false);
          alert('โหลดตารางเวรไม่สำเร็จ');
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        const unsub = getDutyTemplatesRef().onSnapshot(snapshot => {
          const map = {};
          snapshot.docs.forEach(doc => { map[doc.id] = { id: doc.id, ...doc.data() }; });
          setTemplates(map);
        }, err => console.error('load duty templates failed', err));
        return () => unsub();
      }, []);

      const activeStudents = useMemo(() => students
        // v71.1: ตัวเลือกตารางเวรแสดงสมาชิก active ทุกปี รุ่นปีเข้าชมรมใช้เพื่ออ้างอิงเท่านั้น
        .filter(s => !['dismissed','graduated'].includes(s.status || 'active'))
        .sort((a,b) => String(a.level || '').localeCompare(String(b.level || ''), 'th') || String(a.group || '').localeCompare(String(b.group || ''), 'th') || String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'))
      , [students]);

      const studentMap = useMemo(() => new Map(students.map(s => [s.id, s])), [students]);
      const formRoles = useMemo(() => normalizeDutyRoles(form.roleDefs, form.roleSlots), [form.roleDefs, form.roleSlots]);
      const duplicateIds = useMemo(() => duplicateStudentIdsInWeekly(form.weeklyAssignments, formRoles), [form.weeklyAssignments, formRoles]);
      const duplicateNames = duplicateIds.map(id => studentMap.get(id)).filter(Boolean).map(s => `${s.nickname || s.fullName || '-'} (${s.level || '-'} / ${s.group || '-'})`);
      const plannerDay = dutyDays.find(d => d.key === plannerDayKey) || dutyDays[0];
      const countAssignmentsForDay = (dayKey) => formRoles.reduce((sum, role) => sum + (((form.weeklyAssignments?.[dayKey]?.[role.key] || []).filter(Boolean)).length), 0);
      const pickerSelectedId = studentPicker.open ? ((form.weeklyAssignments?.[studentPicker.dayKey]?.[studentPicker.roleKey] || [])[studentPicker.slot] || '') : '';
      const pickerSelectedStudent = pickerSelectedId ? studentMap.get(pickerSelectedId) : null;
      const pickerSelectedYears = Array.isArray(studentPicker.years) ? studentPicker.years : [];
      const pickerSelectedLevels = Array.isArray(studentPicker.levels) ? studentPicker.levels : [];
      const pickerSelectedGroups = Array.isArray(studentPicker.groups) ? studentPicker.groups : [];
      const pickerSelectedInterests = Array.isArray(studentPicker.interests) ? studentPicker.interests : [];
      const pickerGroupSearch = String(studentPicker.groupSearch || '').trim().toLowerCase();
      const pickerHasFilters = !!studentPicker.query || pickerSelectedYears.length || pickerSelectedLevels.length || pickerSelectedGroups.length || pickerSelectedInterests.length;
      const pickerYearOptions = useMemo(() => Array.from(new Set(activeStudents.map(s => String(s.academicYear || currentAcademicYear || '').trim()).filter(Boolean))).sort((a,b) => String(b).localeCompare(String(a), 'th')), [activeStudents, currentAcademicYear]);
      const pickerLevelOptions = useMemo(() => {
        const base = activeStudents.filter(s => !pickerSelectedYears.length || pickerSelectedYears.includes(String(s.academicYear || currentAcademicYear || '').trim()));
        return Array.from(new Set(base.map(s => String(s.level || '').trim()).filter(Boolean)));
      }, [activeStudents, currentAcademicYear, pickerSelectedYears.join('|')]);
      const pickerGroupOptions = useMemo(() => {
        const base = activeStudents.filter(s => {
          const joinYear = String(s.academicYear || currentAcademicYear || '').trim();
          return (!pickerSelectedYears.length || pickerSelectedYears.includes(joinYear)) && (!pickerSelectedLevels.length || pickerSelectedLevels.includes(String(s.level || '').trim()));
        });
        return Array.from(new Set(base.map(s => String(s.group || '').trim()).filter(Boolean)));
      }, [activeStudents, currentAcademicYear, pickerSelectedYears.join('|'), pickerSelectedLevels.join('|')]);
      const pickerGroupFilteredOptions = useMemo(() => {
        if (!pickerGroupSearch) return pickerGroupOptions;
        return pickerGroupOptions.filter(group => group.toLowerCase().includes(pickerGroupSearch));
      }, [pickerGroupOptions, pickerGroupSearch]);
      const pickerInterestOptions = useMemo(() => {
        const base = activeStudents.filter(s => {
          const joinYear = String(s.academicYear || currentAcademicYear || '').trim();
          const level = String(s.level || '').trim();
          const group = String(s.group || '').trim();
          return (!pickerSelectedYears.length || pickerSelectedYears.includes(joinYear)) && (!pickerSelectedLevels.length || pickerSelectedLevels.includes(level)) && (!pickerSelectedGroups.length || pickerSelectedGroups.includes(group));
        });
        return Array.from(new Set(base.map(s => String(s.actualInterest || s.interest || '').trim()).filter(Boolean)));
      }, [activeStudents, currentAcademicYear, pickerSelectedYears.join('|'), pickerSelectedLevels.join('|'), pickerSelectedGroups.join('|')]);
      const togglePickerArrayFilter = (key, value) => {
        setStudentPicker(prev => {
          const current = Array.isArray(prev[key]) ? prev[key] : [];
          const next = current.includes(value) ? current.filter(item => item !== value) : [...current, value];
          const patch = { [key]: next };
          if (key === 'years') {
            patch.levels = [];
            patch.groups = [];
            patch.interests = [];
            patch.groupSearch = '';
          }
          if (key === 'levels') {
            patch.groups = [];
            patch.interests = [];
            patch.groupSearch = '';
          }
          if (key === 'groups') {
            patch.interests = [];
          }
          return { ...prev, ...patch };
        });
      };
      const pickerResults = useMemo(() => {
        const q = String(studentPicker.query || '').trim().toLowerCase();
        return activeStudents.filter(s => {
          const joinYear = String(s.academicYear || currentAcademicYear || '').trim();
          const level = String(s.level || '').trim();
          const group = String(s.group || '').trim();
          const interest = String(s.actualInterest || s.interest || '').trim();
          const matchQuery = !q || [s.studentId, s.fullName, s.nickname, s.academicYear, s.level, s.group, s.major, s.actualInterest, s.interest].filter(Boolean).join(' ').toLowerCase().includes(q);
          const matchYear = !pickerSelectedYears.length || pickerSelectedYears.includes(joinYear);
          const matchLevel = !pickerSelectedLevels.length || pickerSelectedLevels.includes(level);
          const matchGroup = !pickerSelectedGroups.length || pickerSelectedGroups.includes(group);
          const matchInterest = !pickerSelectedInterests.length || pickerSelectedInterests.includes(interest);
          return matchQuery && matchYear && matchLevel && matchGroup && matchInterest;
        });
      }, [activeStudents, currentAcademicYear, studentPicker.query, pickerSelectedYears.join('|'), pickerSelectedLevels.join('|'), pickerSelectedGroups.join('|'), pickerSelectedInterests.join('|')]);
      const recentPickerStudents = useMemo(() => recentPickerStudentIds.map(id => studentMap.get(id)).filter(s => s && !['dismissed','graduated'].includes(s.status || 'active')).slice(0, 8), [recentPickerStudentIds, studentMap]);

      const attendanceDuty = useMemo(() => duties.find(d => d.id === attendanceDutyId) || null, [duties, attendanceDutyId]);

      const openDutyAttendance = (duty) => {
        setAttendanceDutyId(duty.id);
        setAttendanceDayKey(dutyDays[0].key);
      };

      const closeDutyAttendance = () => {
        setAttendanceDutyId(null);
      };

      const dutyAttendanceStatus = (duty, dayKey, roleKey, index) => {
        return (((duty?.dutyAttendance || {})[dayKey] || {})[roleKey] || [])[index] || '';
      };

      const setDutyAttendanceStatus = async (duty, dayKey, roleKey, index, status) => {
        if (!duty?.id) return;
        const current = duty.dutyAttendance || {};
        const nextDay = { ...(current[dayKey] || {}) };
        const nextRole = [ ...(nextDay[roleKey] || []) ];
        if (!status || status === 'present') {
          nextRole[index] = '';
        } else {
          nextRole[index] = status;
        }
        nextDay[roleKey] = nextRole;
        const next = { ...current, [dayKey]: nextDay };
        await getDutyRef().doc(duty.id).update({
          dutyAttendance: next,
          updatedAt: new Date().toISOString()
        });
      };

      const dutyAttendanceSummary = (duty) => {
        const weekly = getDutyWeeklyAssignments(duty);
        const roles = getDutyRoles(duty);
        const summary = { total:0, present:0, late:0, absent:0, leave:0, not_found:0, substitute:0, problems:0 };
        dutyDays.forEach(day => {
          roles.forEach(role => {
            const people = (weekly?.[day.key]?.[role.key] || []).filter(Boolean);
            people.forEach((_, index) => {
              summary.total += 1;
              const status = dutyAttendanceStatus(duty, day.key, role.key, index);
              if (!status || status === 'present') summary.present += 1;
              else if (summary[status] !== undefined) {
                summary[status] += 1;
                summary.problems += 1;
              } else summary.present += 1;
            });
          });
        });
        return summary;
      };

      const openStudentPicker = (dayKey, roleKey, slot) => {
        setStudentPicker({ open:true, dayKey, roleKey, slot, query:'', years:[], levels:[], groups:[], interests:[], groupSearch:'' });
        setStudentPickerFiltersOpen(false);
      };

      const closeStudentPicker = () => {
        setStudentPicker(prev => ({ ...prev, open:false, query:'', years:[], levels:[], groups:[], interests:[], groupSearch:'' }));
        setStudentPickerFiltersOpen(false);
      };

      const chooseStudentForPicker = (studentId) => {
        if (!studentPicker.open) return;
        setAssignment(studentPicker.dayKey, studentPicker.roleKey, studentPicker.slot, studentId);
        setRecentPickerStudentIds(prev => {
          const next = [studentId, ...prev.filter(id => id !== studentId)].slice(0, 8);
          try { localStorage.setItem('mdec_recent_duty_picker_students', JSON.stringify(next)); } catch (error) {}
          return next;
        });
        closeStudentPicker();
      };

      const resetStudentPickerFilters = () => {
        setStudentPicker(prev => ({ ...prev, query:'', years:[], levels:[], groups:[], interests:[], groupSearch:'' }));
      };

      useEffect(() => {
        if (!studentPicker.open) return;
        const onKeyDown = (e) => {
          if (e.key === 'Escape') closeStudentPicker();
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [studentPicker.open]);

      const visibleDuties = useMemo(() => {
        const q = search.trim().toLowerCase();
        return duties.filter(d => {
          const matchYear = year === 'all' || d.academicYear === year;
          const weekly = getDutyWeeklyAssignments(d);
          const text = [
            d.date, formatThaiWeekRange(d.date), d.academicYear, dutyTableLabel(d.scheduleType), d.note,
            ...dutyDays.flatMap(day => [day.label, dutyDayText({ ...d, weeklyAssignments: weekly }, day.key)])
          ].join(' ').toLowerCase();
          return matchYear && (!q || text.includes(q));
        });
      }, [duties, year, search]);

      const nextDuty = useMemo(() => {
        const today = getWeekStartDate(todayFileDate());
        return duties
          .filter(d => d.academicYear === currentAcademicYear && String(getWeekStartDate(d.date) || '') >= today)
          .sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')))[0] || null;
      }, [duties, currentAcademicYear]);

      const setRoleSlotCount = (roleKey, value) => {
        const nextCount = Math.max(0, Math.min(10, Number(value) || 0));
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, { ...(prev.roleSlots || {}), [roleKey]: nextCount });
          const roleSlots = normalizeRoleSlots({ ...(prev.roleSlots || {}), [roleKey]: nextCount }, roles);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roles);
          return { ...prev, roleDefs: roles, roleSlots, weeklyAssignments };
        });
      };

      const setRoleField = (roleKey, field, value) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots).map(role => role.key === roleKey ? { ...role, [field]: value } : role);
          const roleSlots = normalizeRoleSlots(prev.roleSlots, roles);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roles);
          return { ...prev, roleDefs: roles, roleSlots, weeklyAssignments };
        });
      };

      const addRole = () => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const nextIndex = roles.length + 1;
          const key = `custom_${Date.now()}`;
          const newRole = { key, title: `ตำแหน่งใหม่ ${nextIndex}`, shortTitle: `ตำแหน่ง ${nextIndex}`, icon: dutyRoleIcons[nextIndex % dutyRoleIcons.length], tone: dutyRoleTones[nextIndex % dutyRoleTones.length], slots: 1 };
          const roleDefs = [...roles, newRole];
          const roleSlots = normalizeRoleSlots({ ...(prev.roleSlots || {}), [key]: 1 }, roleDefs);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roleDefs);
          return { ...prev, roleDefs, roleSlots, weeklyAssignments };
        });
      };

      const removeRole = (roleKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          if (roles.length <= 1) { alert('ต้องมีอย่างน้อย 1 ตำแหน่งเวร'); return prev; }
          const target = roles.find(r => r.key === roleKey);
          if (!confirm(`ลบตำแหน่ง "${target?.title || roleKey}" ออกจากตารางนี้ใช่ไหม?`)) return prev;
          const roleDefs = roles.filter(role => role.key !== roleKey);
          const roleSlots = { ...(prev.roleSlots || {}) };
          delete roleSlots[roleKey];
          const weeklyAssignments = JSON.parse(JSON.stringify(prev.weeklyAssignments || {}));
          dutyDays.forEach(day => { if (weeklyAssignments?.[day.key]) delete weeklyAssignments[day.key][roleKey]; });
          return { ...prev, roleDefs, roleSlots: normalizeRoleSlots(roleSlots, roleDefs), weeklyAssignments: normalizeWeeklyAssignmentIds(weeklyAssignments, roleSlots, roleDefs) };
        });
      };

      const resetRolesToDefault = () => {
        setForm(prev => {
          const roleDefs = defaultDutyRoleDefs();
          const roleSlots = defaultDutyRoleSlots(roleDefs);
          return { ...prev, roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roleDefs) };
        });
      };

      const setAssignment = (dayKey, roleKey, slot, value) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          const current = [...(weekly[dayKey]?.[roleKey] || [])];
          while (current.length < slot + 1) current.push('');
          current[slot] = value;
          weekly[dayKey][roleKey] = current;
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const copyDay = (fromDayKey, toDayKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          weekly[toDayKey] = JSON.parse(JSON.stringify(weekly[fromDayKey] || emptyDutyAssignments(prev.roleSlots, roles)));
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const clearDay = (dayKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          weekly[dayKey] = emptyDutyAssignments(prev.roleSlots, roles);
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const applyTemplate = (type = form.scheduleType, academicYear = form.academicYear) => {
        const safeType = type === 'B' ? 'B' : 'A';
        const template = templates[dutyTemplateDocId(academicYear, safeType)];
        if (!template) return alert(`ยังไม่ได้บันทึก${dutyTableLabel(safeType)} ของปีการศึกษา ${academicYear}`);
        const roleDefs = getDutyRoles(template);
        const roleSlots = normalizeRoleSlots(template.roleSlots || {}, roleDefs);
        setForm(prev => ({ ...prev, academicYear, scheduleType: safeType, roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(template, roleSlots, roleDefs) }));
      };

      const saveTemplate = async (type = form.scheduleType) => {
        const safeType = type === 'B' ? 'B' : 'A';
        if (!form.academicYear) return alert('กรุณาเลือกปีการศึกษาก่อน');
        if (!confirm(`บันทึกตารางเวร จันทร์–เสาร์ ชุดปัจจุบันเป็น${dutyTableLabel(safeType)} ของปีการศึกษา ${form.academicYear} ใช่ไหม?`)) return;
        const payload = {
          academicYear: form.academicYear,
          scheduleType: safeType,
          roleDefs: normalizeDutyRoles(form.roleDefs, form.roleSlots),
          roleSlots: normalizeRoleSlots(form.roleSlots, form.roleDefs),
          weeklyAssignments: normalizeWeeklyAssignmentIds(form.weeklyAssignments, form.roleSlots, form.roleDefs),
          updatedAt: new Date().toISOString(),
          updatedBy: 'staff'
        };
        await getDutyTemplatesRef().doc(dutyTemplateDocId(form.academicYear, safeType)).set(payload, { merge: true });
        alert(`บันทึก${dutyTableLabel(safeType)} แบบรายวัน จันทร์–เสาร์ เรียบร้อย`);
      };

      const latestDutyForYear = useMemo(() => duties
        .filter(d => d.academicYear === form.academicYear)
        .sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')))[0] || null
      , [duties, form.academicYear]);

      const suggestedNextType = latestDutyForYear?.scheduleType === 'A' ? 'B' : 'A';

      const applySuggestedTemplate = () => {
        const type = suggestedNextType || 'A';
        applyTemplate(type, form.academicYear);
      };

      const autoFillCurrentDutyForm = () => {
        if (!activeStudents.length) return alert('ยังไม่มีรายชื่อนักศึกษาที่พร้อมใช้งาน');
        const previousCounts = new Map();
        duties.forEach(duty => allDutyEntries(duty).forEach(item => previousCounts.set(item.person.id, (previousCounts.get(item.person.id) || 0) + 1)));
        const nextWeekly = {};
        const usedWeek = new Set();
        dutyDays.forEach(day => {
          nextWeekly[day.key] = {};
          const usedDay = new Set();
          formRoles.forEach(role => {
            const slots = getRoleSlotCount(role, form.roleSlots);
            nextWeekly[day.key][role.key] = [];
            for (let i=0; i<slots; i++) {
              const selected = [...activeStudents].sort((a,b) => {
                const aScore = (previousCounts.get(a.id) || 0) * 5 + (usedWeek.has(a.id) ? 6 : 0) + (usedDay.has(a.id) ? 999 : 0) + Math.random();
                const bScore = (previousCounts.get(b.id) || 0) * 5 + (usedWeek.has(b.id) ? 6 : 0) + (usedDay.has(b.id) ? 999 : 0) + Math.random();
                return aScore - bScore;
              })[0];
              if (!selected) continue;
              usedDay.add(selected.id);
              usedWeek.add(selected.id);
              nextWeekly[day.key][role.key].push(selected.id);
            }
          });
        });
        setForm(prev => ({ ...prev, weeklyAssignments: nextWeekly }));
        alert('ระบบจัดเวรอัตโนมัติให้แล้ว ตรวจแก้ชื่อก่อนบันทึกได้เลย');
      };


      const resetForm = () => {
        setEditingId(null);
        setPlannerDayKey(dutyDays[0].key);
        setDutyManagePanel('planner');
        setForm(createDutyForm(currentAcademicYear));
      };

      const buildWeeklySnapshot = () => {
        const lookup = new Map(students.map(s => [s.id, s]));
        const weekly = {};
        dutyDays.forEach(day => {
          weekly[day.key] = {};
          formRoles.forEach(role => {
            const ids = [...new Set((form.weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean))];
            weekly[day.key][role.key] = ids.map(id => {
              const s = lookup.get(id);
              return s ? {
                id: s.id,
                studentId: s.studentId || '',
                fullName: s.fullName || '',
                nickname: s.nickname || '',
                level: s.level || '',
                group: s.group || '',
                major: s.major || '',
                phone: s.phone || '',
                lineId: s.lineId || '',
                actualInterest: s.actualInterest || s.interest || '',
                photo: s.photo || null
              } : null;
            }).filter(Boolean);
          });
        });
        return weekly;
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!form.date) return alert('กรุณาเลือกสัปดาห์');
        const invalidRoles = formRoles.filter(role => !String(role.title || '').trim());
        if (invalidRoles.length) return alert('กรุณาใส่ชื่อตำแหน่งให้ครบ หรือกดปุ่มลบตำแหน่งที่ไม่ต้องการออกก่อนบันทึก');
        const weeklyAssignments = buildWeeklySnapshot();
        const assignedCount = countAssignedInWeekly(weeklyAssignments, formRoles);
        if (!assignedCount) return alert('กรุณาเลือกนักศึกษาอย่างน้อย 1 หน้าที่');
        const repeated = duplicateStudentIdsInWeekly(form.weeklyAssignments, formRoles);
        if (repeated.length && !confirm(`มีนักศึกษาซ้ำในสัปดาห์นี้ ${repeated.length} คน ต้องการบันทึกต่อไหม?`)) return;
        const weekStart = getWeekStartDate(form.date);
        const targetYear = form.academicYear || currentAcademicYear;
        const duplicateWeek = duties.find(d => d.id !== editingId && d.academicYear === targetYear && getWeekStartDate(d.date) === weekStart);
        if (duplicateWeek && !confirm(`มีตารางเวรตอนเช้าของ${formatThaiWeekRange(weekStart)} อยู่แล้ว ต้องการบันทึกเพิ่ม/ซ้ำใช่ไหม?`)) return;
        setSaving(true);
        try {
          const payload = {
            date: weekStart,
            academicYear: targetYear,
            scheduleType: form.scheduleType === 'B' ? 'B' : 'A',
            note: form.note || '',
            roleDefs: normalizeDutyRoles(form.roleDefs, form.roleSlots),
            roleSlots: normalizeRoleSlots(form.roleSlots, form.roleDefs),
            weeklyAssignments,
            assignments: weeklyAssignments.mon || {},
            locked: editingId ? !!duties.find(d => d.id === editingId)?.locked : false,
            updatedAt: new Date().toISOString(),
            createdBy: 'staff'
          };
          if (editingId) await getDutyRef().doc(editingId).update(payload);
          else await getDutyRef().add({ ...payload, createdAt: new Date().toISOString() });
          resetForm();
        } catch (err) {
          alert('บันทึกตารางเวรไม่สำเร็จ: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      const editDuty = (duty) => {
        if (duty.locked && !confirm('ตารางนี้ถูกล็อกไว้ ต้องการแก้ไขตารางนี้ต่อไหม?')) return;
        setPlannerDayKey(dutyDays[0].key);
        setDutyManagePanel('planner');
        setEditingId(duty.id);
        const roleDefs = getDutyRoles(duty);
        const roleSlots = normalizeRoleSlots(duty.roleSlots || {}, roleDefs);
        setForm({ date: getWeekStartDate(duty.date || todayFileDate()), academicYear: duty.academicYear || currentAcademicYear, scheduleType: duty.scheduleType === 'B' ? 'B' : 'A', note: duty.note || '', roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(duty, roleSlots, roleDefs) });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const duplicateDuty = (duty) => {
        setPlannerDayKey(dutyDays[0].key);
        setDutyManagePanel('planner');
        setEditingId(null);
        const roleDefs = getDutyRoles(duty);
        const roleSlots = normalizeRoleSlots(duty.roleSlots || {}, roleDefs);
        setForm({ date: getWeekStartDate(todayFileDate()), academicYear: duty.academicYear || currentAcademicYear, scheduleType: duty.scheduleType === 'B' ? 'B' : 'A', note: duty.note || '', roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(duty, roleSlots, roleDefs) });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const deleteDuty = async (duty) => {
        if (!confirm(`ลบตารางเวรตอนเช้า ${formatThaiWeekRange(duty.date)} ใช่ไหม?`)) return;
        await getDutyRef().doc(duty.id).delete();
      };

      const toggleDutyLock = async (duty) => {
        if (!duty?.id) return;
        const next = !duty.locked;
        if (next && !confirm('ล็อกตารางนี้ใช่ไหม? หลังล็อกจะแก้ไขยากขึ้นเพื่อลดการเผลอแก้ตารางจริง')) return;
        await getDutyRef().doc(duty.id).update({ locked: next, lockedAt: next ? new Date().toISOString() : null });
      };

      const exportCSV = () => {
        if (!visibleDuties.length) return alert('ไม่มีตารางเวรให้ส่งออก');
        downloadFile(`MDEC_Morning_Weekly_Daily_Duty_${year === 'all' ? 'All' : year}_${todayFileDate()}.csv`, dutiesToCSV(visibleDuties), 'text/csv;charset=utf-8');
      };

      return (
        <div className="space-y-5 duty-contrast-page duty-redesign">
          <section className="bg-white rounded-[2rem] soft-shadow border border-white p-4 md:p-5">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-4">
              <div>
                <h3 className="text-xl md:text-2xl font-extrabold text-slate-950"><i className="ri-calendar-schedule-fill text-blue-600 mr-2"></i>จัดการตารางเวรตอนเช้า</h3>
                <p className="text-slate-500">แยกงานเป็นขั้นตอน เพื่อให้หน้าไม่รกและใช้งานบนมือถือได้ง่ายขึ้น</p>
              </div>
              <button type="button" onClick={autoFillCurrentDutyForm} className="px-5 py-3 rounded-2xl bg-emerald-600 text-white font-extrabold hover:bg-emerald-700"><i className="ri-magic-fill mr-1"></i>จัดเวรอัตโนมัติ</button>
            </div>
            <div className="duty-step-nav">
              {[
                ['planner','จัดเวรรายวัน','เลือกวันและจัดคน'],
                ['roles','ตำแหน่งเวร','ตั้งหน้าที่และจำนวนคน'],
                ['templates','ตาราง A/B','เรียกใช้และบันทึกแบบ'],
                ['list','รายการย้อนหลัง','เช็คเวรและจัดการตาราง']
              ].map(([key,title,desc]) => (
                <button key={key} type="button" onClick={() => setDutyManagePanel(key)} className={`duty-step-btn ${dutyManagePanel === key ? 'is-active' : ''}`}>
                  <span className="step-title">{title}</span>
                  <span className="step-desc">{desc}</span>
                </button>
              ))}
            </div>
          </section>
          <div className={`grid xl:grid-cols-[1.1fr_.9fr] gap-5 ${dutyManagePanel === 'list' ? 'hidden' : ''}`}> 
            <form onSubmit={handleSave} className="duty-form-shell bg-white rounded-[2rem] soft-shadow border border-white p-5 md:p-7 space-y-6">
              <div className="flex flex-col md:flex-row gap-4 md:items-start md:justify-between">
                <div>
                  <h3 className="text-2xl font-extrabold text-slate-950"><i className="ri-calendar-schedule-fill text-blue-600 mr-2"></i>{editingId ? 'แก้ไขตารางเวรตอนเช้า' : 'เพิ่มตารางเวรตอนเช้าประจำสัปดาห์'}</h3>
                  <p className="text-slate-500">จัดเวรแยกวัน จันทร์–เสาร์ นักศึกษาผลัดกันทำหน้าที่ในแต่ละวัน</p>
                </div>
                {editingId && <button type="button" onClick={resetForm} className="px-4 py-2 rounded-2xl bg-slate-100 text-slate-700 font-bold">ยกเลิกแก้ไข</button>}
              </div>

              <div className="grid md:grid-cols-4 gap-4">
                <Input label="สัปดาห์เริ่มต้น" type="date" value={form.date} onChange={v => setForm(prev => ({ ...prev, date: getWeekStartDate(v) }))} />
                <Select label="ปีการศึกษา" value={form.academicYear} onChange={v => setForm(prev => ({ ...prev, academicYear: v, weeklyAssignments: emptyWeeklyDutyAssignments(prev.roleSlots, prev.roleDefs) }))} options={[...new Set([currentAcademicYear, ...yearsList])]} />
                <Select label="ตารางที่ใช้" value={form.scheduleType} onChange={v => setForm(prev => ({ ...prev, scheduleType: v === 'B' ? 'B' : 'A' }))} options={['A','B']} optionLabels={{ A:'ตาราง A', B:'ตาราง B' }} />
                <Input label="หมายเหตุประจำสัปดาห์" value={form.note} onChange={v => setForm(prev => ({ ...prev, note: v }))} placeholder="เช่น สัปดาห์เปิดเทอม / สอบกลางภาค" />
              </div>



              {dutyManagePanel === 'roles' && (

              <div className="rounded-3xl bg-blue-50 border border-blue-100 p-4">
                <div className="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3 mb-4">
                  <div>
                    <h4 className="font-extrabold text-slate-950"><i className="ri-user-settings-fill text-blue-600 mr-2"></i>จัดการตำแหน่งเวรตอนเช้า</h4>
                    <p className="text-sm text-slate-500">กำหนดเองได้ว่ามีตำแหน่งอะไร ชื่อตำแหน่งอะไร ใช้นักศึกษากี่คน และจะปิดตำแหน่งไหนก็ได้</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button type="button" onClick={addRole} className="px-4 py-2 rounded-2xl bg-blue-600 text-white font-bold hover:bg-blue-700"><i className="ri-add-line mr-1"></i>เพิ่มตำแหน่ง</button>
                    <button type="button" onClick={resetRolesToDefault} className="px-4 py-2 rounded-2xl bg-white text-blue-700 border border-blue-100 font-bold hover:bg-blue-50"><i className="ri-refresh-line mr-1"></i>กลับค่าเริ่มต้น</button>
                  </div>
                </div>
                <div className="space-y-4">
                  <div className="rounded-2xl bg-white/70 border border-blue-100 px-4 py-3">
                    <div className="grid md:grid-cols-4 gap-3 text-xs md:text-sm font-bold">
                      <div className="rounded-2xl bg-slate-50 px-4 py-3 text-slate-700"><span className="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">วิธีใช้งาน</span>พิมพ์ <span className="text-slate-950">ชื่อตำแหน่งเต็ม</span> ให้ชัดเจน เช่น “คุมเครื่องเสียง”</div>
                      <div className="rounded-2xl bg-slate-50 px-4 py-3 text-slate-700"><span className="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">ชื่อย่อบนจอ</span>ใช้ชื่อสั้นสำหรับจอแสดงเวร เช่น “เครื่องเสียง”</div>
                      <div className="rounded-2xl bg-slate-50 px-4 py-3 text-slate-700"><span className="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">จำนวนคน</span>กำหนดจำนวนนักศึกษาที่ต้องใช้ในหน้าที่นั้น</div>
                      <div className="rounded-2xl bg-slate-50 px-4 py-3 text-slate-700"><span className="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">คำแนะนำ</span>ถ้าไม่ใช้หน้าที่นี้ในสัปดาห์นั้น ให้ตั้งจำนวนเป็น <span className="text-slate-950">0</span></div>
                    </div>
                  </div>
                  {formRoles.map((role, idx) => {
                    const slots = getRoleSlotCount(role, form.roleSlots);
                    const toneMap = {
                      blue: 'from-sky-500 to-blue-600',
                      cyan: 'from-cyan-500 to-sky-500',
                      emerald: 'from-emerald-500 to-teal-600',
                      purple: 'from-violet-500 to-purple-600',
                      orange: 'from-amber-500 to-orange-600'
                    };
                    const toneLabelMap = { blue: 'ฟ้า', cyan: 'น้ำเงินอมฟ้า', emerald: 'เขียว', purple: 'ม่วง', orange: 'ส้ม' };
                    return (
                      <div key={`role-editor-${role.key}`} className="role-editor-card rounded-[28px] bg-white border border-slate-200 shadow-sm overflow-hidden">
                        <div className="role-editor-head flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 px-5 py-4 border-b border-slate-200 bg-slate-900 text-white">
                          <div className="flex items-center gap-4 min-w-0">
                            <div className={`role-editor-icon w-14 h-14 rounded-2xl bg-gradient-to-br ${toneMap[role.tone] || toneMap.blue} text-white flex items-center justify-center shadow-sm flex-shrink-0`}>
                              <i className={`${role.icon} text-2xl`}></i>
                            </div>
                            <div className="min-w-0">
                              <div className="text-xs font-extrabold uppercase tracking-[0.18em] text-white/70 mb-1">ตำแหน่งที่ {idx + 1}</div>
                              <div className="text-xl font-black text-white leading-tight break-words">{role.title || 'ยังไม่ได้ตั้งชื่อตำแหน่ง'}</div>
                              <div className="flex flex-wrap gap-2 mt-2">
                                <span className="role-summary-chip inline-flex items-center px-3 py-1 rounded-full bg-white text-slate-900 border border-white/20 text-xs font-extrabold">ชื่อย่อ: {role.shortTitle || '-'}</span>
                                <span className="role-summary-chip inline-flex items-center px-3 py-1 rounded-full bg-white text-slate-900 border border-white/20 text-xs font-extrabold">{slots} คน</span>
                                <span className="role-summary-chip inline-flex items-center px-3 py-1 rounded-full bg-white text-slate-900 border border-white/20 text-xs font-extrabold">สี {toneLabelMap[role.tone] || 'ฟ้า'}</span>
                              </div>
                            </div>
                          </div>
                          <button type="button" onClick={() => removeRole(role.key)} className="self-start lg:self-center inline-flex items-center gap-2 px-4 py-3 rounded-2xl bg-white text-red-700 border border-red-200 hover:bg-red-50 font-extrabold"><i className="ri-delete-bin-fill"></i>ลบตำแหน่ง</button>
                        </div>
                        <div className="p-5">
                          <div className="grid xl:grid-cols-12 gap-4">
                            <label className="block xl:col-span-5">

                <div>
                  <div className="report-title">ตารางเวรตอนเช้าประจำสัปดาห์ จันทร์–เสาร์</div>
                  <div className="report-subtitle">ชมรม MDEC Photo Club • ภายใต้การดูแลของศูนย์มัลติมีเดียทางการศึกษา</div>
                </div>
              </div>
              <div className="report-meta"><div><strong>ปีการศึกษา:</strong> {yearText}</div><div><strong>จำนวนสัปดาห์:</strong> {sorted.length}</div><div><strong>วันที่ออกรายงาน:</strong> {reportDate}</div></div>
            </div>
            <div className="report-note"><span>ตำแหน่งเวรสามารถกำหนดเองได้ตามตารางแต่ละสัปดาห์</span><span>หมายเหตุ: ใช้ตาราง A/B สลับกันทุก 1 สัปดาห์ได้</span></div>
            <table className="print-table">
              <thead><tr><th style={{width:'120px'}}>สัปดาห์</th><th style={{width:'78px'}}>วัน</th><th style={{width:'65px'}}>ตาราง</th>{rolesForHeader.map(role => <th key={role.key}>{role.shortTitle || role.title}</th>)}<th style={{width:'95px'}}>หมายเหตุ</th></tr></thead>
              <tbody>{sorted.flatMap(d => {
                const weekly = getDutyWeeklyAssignments(d);
                return dutyDays.map(day => <tr key={`${d.id || d.date}-${day.key}`}><td><strong>{formatThaiWeekRange(d.date)}</strong></td><td>{day.shortLabel}<br/><span className="print-muted">{formatThaiDate(getDutyDayDate(d.date, day.key))}</span></td><td>{dutyTableLabel(d.scheduleType)}</td>{rolesForHeader.map(role => <td key={role.key}>{dailyDutyRoleText(weekly, day.key, role.key)}</td>)}<td>{d.note || '-'}</td></tr>);
              })}</tbody>
            </table>
            <div className="print-footer"><div>Generated by MDEC Photo Club Registry</div><div className="signature-zone"><div className="signature-line">ผู้จัดทำ</div><div className="signature-line">ผู้ตรวจสอบ</div></div></div>
          </section>
        </div>
      );
    }

    function DutyDisplayPage({ currentAcademicYear, yearsList, students = [], onBack, onNavigate }) {
      const [duties, setDuties] = useState([]);
      const [loading, setLoading] = useState(true);
      const [year, setYear] = useState(currentAcademicYear);
      const [selectedId, setSelectedId] = useState('auto');
      const [showControls, setShowControls] = useState(false);
      const [now, setNow] = useState(new Date());
      const [focusDayKey, setFocusDayKey] = useState('auto');
      const [autoRotate, setAutoRotate] = useState(false);
      const boardRef = useRef(null);

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setShowControls(false);
            if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const unsub = getDutyRef().onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
          setDuties(data);
          setLoading(false);
        }, err => {
          console.error(err);
          setLoading(false);
          alert('โหลดตารางเวรไม่สำเร็จ');
        });
        return () => unsub();
      }, []);

      const dutiesForYear = useMemo(() => duties.filter(d => d.academicYear === year).sort((a,b) => String(a.date || '').localeCompare(String(b.date || ''))), [duties, year]);
      const nextDuty = useMemo(() => {
        const today = getWeekStartDate(todayFileDate());
        return dutiesForYear.find(d => String(getWeekStartDate(d.date) || '') >= today) || dutiesForYear[dutiesForYear.length - 1] || null;
      }, [dutiesForYear]);
      const selectedDuty = useMemo(() => selectedId === 'auto' ? nextDuty : (dutiesForYear.find(d => d.id === selectedId) || nextDuty), [selectedId, nextDuty, dutiesForYear]);
      const yearOptions = [...new Set([currentAcademicYear, ...yearsList])];
      const studentLookup = useMemo(() => new Map((students || []).map(s => [s.id, s])), [students]);
      const clockText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      const dateText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const todayDate = todayFileDate();
      const todayKey = dutyDays.find(day => getDutyDayDate(todayDate, day.key) === todayDate)?.key;
      const isCurrentSelectedWeek = selectedDuty ? getWeekStartDate(selectedDuty.date) === getWeekStartDate(todayDate) : false;
      const resolvedFocusDayKey = focusDayKey === 'auto' ? ((isCurrentSelectedWeek && todayKey) ? todayKey : 'mon') : focusDayKey;
      const focusDay = dutyDays.find(day => day.key === resolvedFocusDayKey) || dutyDays[0];
      const weekly = selectedDuty ? getDutyWeeklyAssignments(selectedDuty) : null;
      const focusDate = selectedDuty ? getDutyDayDate(selectedDuty.date, focusDay.key) : todayDate;
      const selectedRoles = selectedDuty ? getDutyRoles(selectedDuty) : dutyRoles;
      const selectedRoleSlots = normalizeRoleSlots(selectedDuty?.roleSlots || {}, selectedRoles);
      const focusPeopleCount = focusDay ? selectedRoles.reduce((sum, role) => sum + ((weekly?.[focusDay.key]?.[role.key] || []).length), 0) : 0;

      useEffect(() => {
        setFocusDayKey('auto');
      }, [selectedId, year]);

      useEffect(() => {
        if (!autoRotate || !selectedDuty) return;
        const timer = setInterval(() => {
          setFocusDayKey(prev => {
            const current = prev === 'auto' ? resolvedFocusDayKey : prev;
            const idx = Math.max(0, dutyDays.findIndex(d => d.key === current));
            return dutyDays[(idx + 1) % dutyDays.length].key;
          });
        }, 9000);
        return () => clearInterval(timer);
      }, [autoRotate, selectedDuty, resolvedFocusDayKey]);

      const toggleFullscreen = () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      };

      const roleColor = (tone) => ({
        blue: { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-sky-500 text-white', accentSoft:'bg-slate-900/90 border-sky-400/50 text-white', soft:'bg-slate-900/65', text:'text-blue-100', line:'bg-sky-400' },
        cyan: { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-cyan-500 text-slate-950', accentSoft:'bg-slate-900/90 border-cyan-400/50 text-white', soft:'bg-slate-900/65', text:'text-cyan-100', line:'bg-cyan-300' },
        emerald: { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-emerald-500 text-slate-950', accentSoft:'bg-slate-900/90 border-emerald-400/50 text-white', soft:'bg-slate-900/65', text:'text-emerald-100', line:'bg-emerald-300' },
        purple: { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-violet-500 text-white', accentSoft:'bg-slate-900/90 border-violet-400/50 text-white', soft:'bg-slate-900/65', text:'text-violet-100', line:'bg-violet-400' },
        orange: { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-amber-400 text-slate-950', accentSoft:'bg-slate-900/90 border-amber-300/50 text-white', soft:'bg-slate-900/65', text:'text-amber-100', line:'bg-amber-300' }
      }[tone] || { panel:'bg-slate-950/45 border-slate-700/80', accent:'bg-sky-500 text-white', accentSoft:'bg-slate-900/90 border-sky-400/50 text-white', soft:'bg-slate-900/65', text:'text-blue-100', line:'bg-sky-400' });

      const dayColor = (key, active) => active ? 'bg-blue-500 text-white border-blue-300' : 'bg-slate-900/85 text-white border-slate-500/70 hover:bg-slate-800 hover:border-blue-400';

      const resolvePerson = (person) => {
        if (!person) return null;
        if (typeof person === 'string') {
          const s = studentLookup.get(person);
          return s ? {
            id: s.id,
            studentId: s.studentId || '',
            fullName: s.fullName || '',
            nickname: s.nickname || '',
            level: s.level || '',
            group: s.group || '',
            major: s.major || '',
            photo: s.photo || null
          } : { id: person, fullName: '-', nickname: '-', photo: null };
        }
        const s = studentLookup.get(person.id);
        return {
          ...person,
          fullName: person.fullName || s?.fullName || '',
          nickname: person.nickname || s?.nickname || '',
          studentId: person.studentId || s?.studentId || '',
          level: person.level || s?.level || '',
          group: person.group || s?.group || '',
          major: person.major || s?.major || '',
          photo: person.photo || s?.photo || null
        };
      };

      const initialsOf = (person) => {
        const text = person?.nickname || person?.fullName || '?';
        return String(text).trim().charAt(0) || '?';
      };

      const renderPersonCard = (person, idx, tone) => {
        const c = roleColor(tone);
        return (
          <div key={person?.id || idx} className={`tv-student-card rounded-[1.35rem] ${c.soft} border border-slate-700/80 p-3`}>
            <div className="flex items-center gap-3">
              <div className="w-16 h-16 md:w-20 md:h-20 rounded-[1.15rem] overflow-hidden bg-slate-800 border border-slate-600 flex-shrink-0 flex items-center justify-center">
                {person?.photo ? (
                  <img src={person.photo} alt={person.nickname || person.fullName || 'student'} className="w-full h-full object-cover" />
                ) : (
                  <div className={`w-full h-full flex items-center justify-center text-2xl md:text-3xl font-extrabold ${c.text}`}>{initialsOf(person)}</div>
                )}
              </div>
              <div className="min-w-0">
                <div className="text-xl md:text-2xl font-extrabold text-white leading-tight truncate">{person?.nickname || person?.fullName || '-'}</div>
                <div className="text-sm md:text-base text-slate-300 truncate">{person?.fullName && person?.nickname ? person.fullName : (person?.studentId || '-')}</div>
                <div className={`text-xs md:text-sm font-bold mt-1 ${c.text}`}>{[person?.level, person?.group].filter(Boolean).join(' / ') || (person?.major || '-')}</div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div ref={boardRef} className="relative min-h-[calc(100vh-32px)] overflow-hidden rounded-[2.4rem] bg-[#081323] border border-white/10 soft-shadow text-white duty-tv-unified">
          <div className="absolute inset-0 pointer-events-none">
            <div className="absolute inset-0 bg-gradient-to-br from-blue-950/70 via-slate-950 to-slate-950"></div>
            <div className="absolute -top-44 -right-44 w-[520px] h-[520px] rounded-full bg-blue-500/18 blur-3xl"></div>
            <div className="absolute -bottom-48 -left-44 w-[540px] h-[540px] rounded-full bg-cyan-400/10 blur-3xl"></div>
          </div>

          <div data-html2canvas-ignore="true" className="no-print fixed top-4 right-4 z-50 flex flex-wrap justify-end gap-2 opacity-70 hover:opacity-100 transition-opacity">
            <button onClick={() => { setShowControls(false); onNavigate && onNavigate('add'); }} className="px-4 py-3 rounded-2xl bg-emerald-600/95 hover:bg-emerald-600 text-white border border-emerald-400/20 backdrop-blur font-bold shadow-lg"><i className="ri-user-add-fill mr-1"></i> เพิ่มสมาชิก</button>
            <button onClick={() => { setShowControls(false); onNavigate && onNavigate('duty'); }} className="px-4 py-3 rounded-2xl bg-blue-600/95 hover:bg-blue-600 text-white border border-blue-400/20 backdrop-blur font-bold shadow-lg"><i className="ri-save-3-fill mr-1"></i> บันทึกข้อมูล</button>
            <button onClick={() => { setShowControls(false); onBack && onBack(); }} className="px-4 py-3 rounded-2xl bg-slate-950/85 hover:bg-slate-900 text-white border border-white/10 backdrop-blur font-bold shadow-lg"><i className="ri-arrow-left-line mr-1"></i> กลับ</button>
            <button onClick={() => setShowControls(true)} className="px-4 py-3 rounded-2xl bg-white/15 hover:bg-white/25 text-white border border-white/20 backdrop-blur font-bold shadow-lg"><i className="ri-settings-3-fill mr-1"></i> ตัวเลือก</button>
          </div>

          {showControls && (
            <div data-html2canvas-ignore="true" onClick={() => setShowControls(false)} className="no-print fixed inset-0 z-[60] bg-slate-950/45 backdrop-blur-[2px] flex items-center justify-center p-4">
              <button onClick={() => setShowControls(false)} className="absolute top-4 right-4 z-[70] px-4 py-3 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-extrabold shadow-xl"><i className="ri-close-circle-fill mr-1"></i> ปิดหน้าต่างนี้</button>
              <div onClick={e => e.stopPropagation()} className="relative z-[65] w-full max-w-5xl rounded-[2rem] bg-slate-900 border border-white/20 soft-shadow p-5 md:p-6">
                <div className="flex items-start justify-between gap-4 mb-5">
                  <div>
                    <h3 className="text-2xl font-extrabold text-white">ตัวเลือกจอแสดงเวร</h3>
                    <p className="text-blue-100 text-sm mt-1">คลิกพื้นที่ว่างด้านนอก หรือกด ESC เพื่อปิดหน้าต่างนี้</p>
                  </div>
                  <button onClick={() => setShowControls(false)} className="w-11 h-11 rounded-2xl bg-red-600 hover:bg-red-700 text-white shadow-lg"><i className="ri-close-line text-2xl"></i></button>
                </div>
                <div className="grid md:grid-cols-2 xl:grid-cols-6 gap-3">
                  <select value={year} onChange={e => { setYear(e.target.value); setSelectedId('auto'); }} className="px-4 py-3 rounded-2xl bg-slate-900 border-2 border-slate-700 outline-none focus:border-blue-500 font-bold text-white">
                    {yearOptions.map(y => <option key={y} value={y}>ปี {y}</option>)}
                  </select>
                  <select value={selectedId} onChange={e => setSelectedId(e.target.value)} className="xl:col-span-2 px-4 py-3 rounded-2xl bg-slate-900 border-2 border-slate-700 outline-none focus:border-blue-500 font-bold text-white">
                    <option value="auto">แสดงเวรสัปดาห์ถัดไปอัตโนมัติ</option>
                    {dutiesForYear.map(d => <option key={d.id} value={d.id}>{formatThaiWeekRange(d.date)} · {dutyTableLabel(d.scheduleType)}</option>)}
                  </select>
                  <button onClick={() => { setShowControls(false); onNavigate && onNavigate('add'); }} className="px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold"><i className="ri-user-add-fill mr-1"></i> เพิ่มสมาชิก</button>
                  <button onClick={() => { setShowControls(false); onNavigate && onNavigate('duty'); }} className="px-4 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold"><i className="ri-save-3-fill mr-1"></i> บันทึกข้อมูล</button>
                  <button onClick={toggleFullscreen} className="px-4 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold"><i className="ri-fullscreen-fill mr-1"></i> เต็มจอ</button>
                  <button onClick={() => setAutoRotate(v => !v)} className={`px-4 py-3 rounded-2xl font-bold ${autoRotate ? 'bg-amber-500 text-slate-950' : 'bg-white/10 text-white hover:bg-white/15'}`}><i className="ri-loop-right-fill mr-1"></i>{autoRotate ? 'กำลังสลับวัน' : 'สลับวันอัตโนมัติ'}</button>
                </div>
              </div>
            </div>
          )}

          <div className="relative z-10 min-h-[calc(100vh-32px)] p-5 md:p-8 xl:p-10 flex flex-col">
            {loading ? (
              <div className="flex-1 flex items-center justify-center text-blue-100 font-bold text-2xl">กำลังโหลดตารางเวร...</div>
            ) : selectedDuty ? (
              <>
                <header className="grid 2xl:grid-cols-[1fr_auto] gap-5 items-start mb-6">
                  <div className="flex items-center gap-4 min-w-0">
                    <div className="brand-logo-compact !w-[132px] !h-[52px] flex-shrink-0"><img src={MDEC_LOGO} alt="MDEC" /></div>
                    <div className="min-w-0">
                      <p className="text-xs md:text-sm font-bold tracking-[0.20em] text-blue-200 uppercase">MDEC MORNING DUTY BOARD</p>
                      <h1 className="text-4xl md:text-6xl 2xl:text-7xl font-extrabold text-white tracking-tight leading-none">เวรตอนเช้า</h1>
                      <p className="text-blue-100 text-sm md:text-lg mt-2 truncate">{formatThaiWeekRange(selectedDuty.date)} · {dutyTableLabel(selectedDuty.scheduleType)} · ปีการศึกษา {selectedDuty.academicYear || year}</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3 2xl:min-w-[420px]">
                    <div className="rounded-[1.7rem] bg-white/8 border border-white/10 px-5 py-4">
                      <p className="text-sm text-blue-100 font-bold">เวลา</p>
                      <p className="text-4xl 2xl:text-5xl font-extrabold text-white mt-2 leading-none">{clockText}</p>
                    </div>
                    <div className="rounded-[1.7rem] bg-white/8 border border-white/10 px-5 py-4">
                      <p className="text-sm text-blue-100 font-bold">วันปัจจุบัน</p>
                      <p className="text-xl 2xl:text-2xl font-extrabold text-white mt-2 leading-tight">{dateText}</p>
                    </div>
                  </div>
                </header>

                <div className="rounded-[2rem] bg-white/6 border border-white/10 p-4 md:p-5 mb-6">
                  <div className="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 mb-4">
                    <div>
                      <p className="text-blue-100 font-bold text-sm">กำลังแสดง</p>
                      <h2 className="text-4xl md:text-6xl font-extrabold text-white leading-none">{focusDay.label}</h2>
                      <p className="text-blue-100 text-base md:text-xl mt-2">{formatThaiDate(focusDate)}</p>
                    </div>
                    <div className="rounded-[1.5rem] bg-slate-950/35 border border-white/10 px-5 py-4">
                      <p className="text-xs md:text-sm text-blue-100 font-bold">ผู้ปฏิบัติหน้าที่รวม</p>
                      <p className="text-4xl md:text-5xl font-extrabold text-white leading-none mt-2">{focusPeopleCount}</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">
                    {dutyDays.map(day => {
                      const isActive = focusDay.key === day.key;
                      const isToday = isCurrentSelectedWeek && todayKey === day.key;
                      const totalPeople = selectedRoles.reduce((sum, role) => sum + ((weekly?.[day.key]?.[role.key] || []).length), 0);
                      return (
                        <button key={day.key} type="button" onClick={() => { setFocusDayKey(day.key); setAutoRotate(false); }} className={`rounded-[1.35rem] border px-4 py-3 text-left transition ${dayColor(day.key, isActive)}`}>
                          <div className="flex items-start justify-between gap-2">
                            <div>
                              <div className="text-xl font-extrabold leading-none">{day.shortLabel}</div>
                              <div className={`text-xs mt-2 ${isActive ? 'text-slate-900/80' : 'text-current opacity-75'}`}>{formatThaiDate(getDutyDayDate(selectedDuty.date, day.key))}</div>
                            </div>
                            <div className="flex flex-col items-end gap-2">
                              {isToday && <span className="px-2 py-1 rounded-lg bg-yellow-300 text-slate-950 text-[10px] font-extrabold">วันนี้</span>}
                              <span className={`px-2 py-1 rounded-lg text-[10px] font-extrabold ${isActive ? 'bg-slate-950/10 text-current' : 'bg-white/10 text-white'}`}>{totalPeople} คน</span>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <section className="flex-1 min-h-0 rounded-[2.1rem] bg-white/7 border border-white/10 p-4 md:p-5 xl:p-6">
                  <div className="flex items-center justify-between gap-3 mb-4">
                    <div>
                      <h3 className="text-2xl md:text-3xl font-extrabold text-white flex items-center gap-3 drop-shadow-sm"><span className={`inline-flex items-center justify-center px-3 py-1 rounded-2xl border ${dayColor(focusDay.key, false)}`}>{focusDay.shortLabel}</span><span>ตารางเวรของ{focusDay.label}</span></h3>
                      <p className="text-blue-100 text-sm md:text-base mt-1">แตะเลือกวันด้านบนเพื่อดูเวรวันอื่น ๆ ได้ทันที</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-5 gap-4 h-full">
                    {selectedRoles.filter(role => getRoleSlotCount(role, selectedRoleSlots) > 0 || ((weekly?.[focusDay.key]?.[role.key] || []).length)).map(role => {
                      const c = roleColor(role.tone);
                      const rawPeople = weekly?.[focusDay.key]?.[role.key] || [];
                      const people = rawPeople.map(resolvePerson).filter(Boolean);
                      const slots = getRoleSlotCount(role, selectedRoleSlots);
                      const cells = Array.from({ length: Math.max(slots, people.length || 0, 1) }, (_, idx) => people[idx] || null);
                      return (
                        <div key={`${focusDay.key}-${role.key}`} className={`tv-role-card rounded-[1.8rem] border ${c.panel} overflow-hidden flex flex-col min-h-[360px] xl:min-h-[430px]`}>
                          <div className="relative px-4 py-4 bg-slate-950/55 border-b border-slate-700/80">
                            <div className={`absolute left-0 top-0 w-full h-1.5 ${c.line}`}></div>
                            <div className="flex items-center justify-between gap-3 mt-1">
                              <div className="flex items-center gap-3 min-w-0">
                                <span className={`w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0 ${c.accent}`}><i className={`${role.icon} text-xl`}></i></span>
                                <div className="min-w-0">
                                  <div className="text-xs uppercase tracking-[0.16em] text-blue-100/75 font-extrabold mb-1">หน้าที่</div>
                                  <div className="text-lg md:text-[1.35rem] font-extrabold text-white leading-tight truncate drop-shadow-sm">{role.title}</div>
                                </div>
                              </div>
                              <div className={`px-3 py-2 rounded-2xl border text-center min-w-[86px] ${c.accentSoft}`}>
                                <div className="text-xs font-bold opacity-80">จำนวน</div>
                                <div className="text-lg font-extrabold leading-none mt-1">{people.length || 0}</div>
                              </div>
                            </div>
                          </div>
                          <div className="flex-1 p-3 space-y-3">
                            {cells.map((person, idx) => person ? (
                              renderPersonCard(person, idx, role.tone)
                            ) : (
                              <div key={`empty-${role.key}-${idx}`} className="rounded-[1.35rem] border border-dashed border-slate-600/80 bg-slate-900/55 p-4 min-h-[92px] flex items-center justify-center text-center">
                                <div>

    function Pagination({ currentPage, totalPages, setCurrentPage }) {
      const pages = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) pages.push(i);
      }
      const uniquePages = [...new Set(pages)].sort((a,b) => a-b);
      return (
        <div className="bg-white rounded-[2rem] soft-shadow border border-white p-4 flex flex-wrap items-center justify-center gap-2 no-print">
          <button disabled={currentPage <= 1} onClick={() => setCurrentPage(p => Math.max(1, p-1))} className="px-4 py-2 rounded-xl bg-slate-100 font-bold disabled:opacity-40"><i className="ri-arrow-left-s-line"></i> ก่อนหน้า</button>
          {uniquePages.map((p, idx) => (
            <React.Fragment key={p}>
              {idx > 0 && p - uniquePages[idx-1] > 1 && <span className="px-2 text-slate-400">...</span>}
              <button onClick={() => setCurrentPage(p)} className={`w-10 h-10 rounded-xl font-bold ${p === currentPage ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{p}</button>

          <button disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p+1))} className="px-4 py-2 rounded-xl bg-slate-100 font-bold disabled:opacity-40">ถัดไป <i className="ri-arrow-right-s-line"></i></button>
