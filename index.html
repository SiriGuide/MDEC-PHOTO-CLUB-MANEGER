    function downloadFile(filename, content, type = 'application/octet-stream;charset=utf-8') {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeCSV(value) {
      if (value === null || value === undefined) return '""';
      let str = String(value);
      if (/^[0-9]+$/.test(str) && str.length >= 6) return `=""${str}""`;
      str = str.replace(/"/g, '""');
      return `"${str}"`;
    }

        'ผู้บันทึก', 'วันที่บันทึก'
      ];
      const rows = students.map(s => [
        s.academicYear, s.studentId, s.level, s.group, s.major, s.fullName, s.nickname,
        s.gender, s.dob, statusLabel(s.status), s.statusReason, s.phone, s.emergencyPhone, s.lineId,

        s.createdBy || s.entryMode || '-', s.createdAt || '-'
      ].map(escapeCSV).join(','));
      return '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.join('\n');
    }

    const dutyRoleTones = ['blue', 'cyan', 'emerald', 'purple', 'orange'];
    const dutyRoleIcons = ['ri-flag-2-fill','ri-volume-up-fill','ri-camera-3-fill','ri-mic-fill','ri-brush-3-fill','ri-megaphone-fill','ri-team-fill','ri-tools-fill','ri-shield-check-fill','ri-star-fill'];

    function safeRoleKey(value, fallback = '') {
      const raw = String(value || '').trim().toLowerCase();
      const ascii = raw.replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      return ascii || fallback || `role_${Date.now()}`;
    }

    function defaultDutyRoleDefs() {
      return dutyRoles.map(role => ({ ...role }));
    }

    function normalizeDutyRoles(roleDefs, roleSlots) {
      const hasCustomRoles = Array.isArray(roleDefs);
      const source = hasCustomRoles ? roleDefs : dutyRoles;
      const seen = new Set();
      const roles = source.map((role, idx) => {
        const fallbackKey = dutyRoles[idx]?.key || `role_${idx + 1}`;
        let key = safeRoleKey(role?.key, fallbackKey);
        if (seen.has(key)) key = `${key}_${idx + 1}`;
        seen.add(key);

        // สำคัญ: ถ้าผู้ใช้ลบชื่อตำแหน่งให้เป็นค่าว่าง ต้องคงค่าว่างไว้
        // ไม่ fallback กลับไปเป็นค่าเริ่มต้น ไม่งั้นพิมพ์ลบแล้วมันจะเด้งกลับมาเอง
        const hasTitleValue = Object.prototype.hasOwnProperty.call(role || {}, 'title');
        const hasShortTitleValue = Object.prototype.hasOwnProperty.call(role || {}, 'shortTitle');
        const fallbackTitle = dutyRoles[idx]?.title || `ตำแหน่งที่ ${idx + 1}`;
        const title = hasTitleValue ? String(role?.title ?? '').trim() : String(role?.shortTitle || fallbackTitle).trim();
        const shortTitle = hasShortTitleValue ? String(role?.shortTitle ?? '').trim() : String(title || fallbackTitle).trim();
        const icon = role?.icon || dutyRoleIcons[idx % dutyRoleIcons.length];
        const tone = dutyRoleTones.includes(role?.tone) ? role.tone : dutyRoleTones[idx % dutyRoleTones.length];
        const rawSlots = Number(roleSlots?.[key] ?? role?.slots ?? dutyRoles[idx]?.slots ?? 1);
        const slots = Math.max(0, Math.min(10, Number.isFinite(rawSlots) ? Math.round(rawSlots) : 1));
        return { key, title, shortTitle, icon, tone, slots };
      });

      // ถ้าเป็นข้อมูล custom จากฟอร์ม ให้คืนตามจริง แม้ชื่อจะว่าง เพื่อให้แก้ไขได้ไม่เด้งกลับ
      // ถ้าไม่ได้ส่ง roleDefs มาเลย ค่อยใช้ค่าเริ่มต้น
      return hasCustomRoles ? roles : (roles.length ? roles : defaultDutyRoleDefs());
    }

    function getDutyRoles(source) {
      return normalizeDutyRoles(source?.roleDefs || source?.roles || source?.dutyRoles, source?.roleSlots);
    }

    function defaultDutyRoleSlots(roleDefs = dutyRoles) {
      return normalizeDutyRoles(roleDefs).reduce((acc, role) => {
        acc[role.key] = role.slots;
        return acc;
      }, {});
    }

    function getRoleSlotCount(role, roleSlots) {
      const raw = Number(roleSlots?.[role.key]);
      if (!Number.isFinite(raw)) return Math.max(0, Math.min(10, Number(role?.slots ?? 1)));
      return Math.max(0, Math.min(10, Math.round(raw)));
    }

    function normalizeRoleSlots(roleSlots, roleDefs = dutyRoles) {
      return normalizeDutyRoles(roleDefs, roleSlots).reduce((acc, role) => {
        acc[role.key] = getRoleSlotCount(role, roleSlots || {});
        return acc;
      }, {});
    }

    function emptyDutyAssignments(roleSlots = defaultDutyRoleSlots(), roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs, roleSlots);
      const safeSlots = normalizeRoleSlots(roleSlots, roles);
      return roles.reduce((acc, role) => {
        acc[role.key] = Array(getRoleSlotCount(role, safeSlots)).fill('');
        return acc;
      }, {});
    }

    function emptyWeeklyDutyAssignments(roleSlots = defaultDutyRoleSlots(), roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs, roleSlots);
      const safeSlots = normalizeRoleSlots(roleSlots, roles);
      return dutyDays.reduce((acc, day) => {
        acc[day.key] = emptyDutyAssignments(safeSlots, roles);
        return acc;
      }, {});
    }

    function createDutyForm(year) {
      const roleDefs = defaultDutyRoleDefs();
      const roleSlots = defaultDutyRoleSlots(roleDefs);
      return { date: getWeekStartDate(todayFileDate()), academicYear: year, scheduleType: 'A', note: '', roleDefs, roleSlots, weeklyAssignments: emptyWeeklyDutyAssignments(roleSlots, roleDefs) };
    }

    function studentDutyName(s) {
      if (!s) return '-';
      const nick = s.nickname ? ` (${s.nickname})` : '';
      const level = s.level || s.group ? ` · ${s.level || '-'} / ${s.group || '-'}` : '';
      return `${s.fullName || '-'}${nick}${level}`;
    }

    function dutyPersonText(p) {
      if (!p) return '-';
      const nick = p.nickname ? ` (${p.nickname})` : '';
      const group = p.level || p.group ? ` · ${p.level || '-'} / ${p.group || '-'}` : '';
      return `${p.fullName || '-'}${nick}${group}`;
    }

    function dutyRoleText(assignments, key) {
      const people = (assignments && assignments[key]) || [];
      return people.length ? people.map(dutyPersonText).join(' / ') : '-';
    }

    function dailyDutyRoleText(weeklyAssignments, dayKey, roleKey) {
      const dayAssignments = (weeklyAssignments && weeklyAssignments[dayKey]) || {};
      return dutyRoleText(dayAssignments, roleKey);
    }

    function getDutyWeeklyAssignments(duty) {
      const roles = getDutyRoles(duty || {});
      const roleSlots = normalizeRoleSlots(duty?.roleSlots || {}, roles);
      if (duty?.weeklyAssignments) return duty.weeklyAssignments;
      const weekly = emptyWeeklyDutyAssignments(roleSlots, roles);
      if (duty?.assignments) weekly.mon = duty.assignments;
      return weekly;
    }

    function dutyDayText(duty, dayKey) {
      const roles = getDutyRoles(duty || {});
      const weekly = getDutyWeeklyAssignments(duty);
      return roles.map(role => dailyDutyRoleText(weekly, dayKey, role.key)).join(' | ');
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(`${dateStr}T00:00:00`);
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function dateInputString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function localDateFromInput(dateStr) {
      if (!dateStr) return new Date();
      const [y, m, d] = String(dateStr).split('-').map(Number);
      const date = new Date(y || new Date().getFullYear(), (m || 1) - 1, d || 1);
      return Number.isNaN(date.getTime()) ? new Date() : date;
    }

    function getWeekStartDate(dateStr) {
      const d = localDateFromInput(dateStr);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day; // Monday start
      d.setDate(d.getDate() + diff);
      return dateInputString(d);
    }

    function getWeekEndDate(dateStr) {
      const d = localDateFromInput(getWeekStartDate(dateStr));
      d.setDate(d.getDate() + 5); // Monday-Saturday morning duty week
      return dateInputString(d);
    }

    function getDutyDayDate(weekStartDate, dayKey) {
      const day = dutyDays.find(d => d.key === dayKey) || dutyDays[0];
      const d = localDateFromInput(getWeekStartDate(weekStartDate));
      d.setDate(d.getDate() + day.offset);
      return dateInputString(d);
    }

    function formatThaiWeekRange(dateStr) {
      if (!dateStr) return '-';
      const start = localDateFromInput(getWeekStartDate(dateStr));
      const end = localDateFromInput(getWeekEndDate(dateStr));
      if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return dateStr;
      const s = start.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
      const e = end.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      return `สัปดาห์ ${s} - ${e}`;
    }

    function normalizeWeeklyAssignmentIds(source, roleSlotsOverride, roleDefsOverride) {
      const roles = normalizeDutyRoles(roleDefsOverride || source?.roleDefs || getDutyRoles(source || {}), roleSlotsOverride || source?.roleSlots || {});
      const roleSlots = normalizeRoleSlots(roleSlotsOverride || source?.roleSlots || {}, roles);
      const weekly = emptyWeeklyDutyAssignments(roleSlots, roles);
      const sourceWeekly = source?.weeklyAssignments || source;
      dutyDays.forEach(day => {
        const daySource = sourceWeekly?.[day.key] || (day.key === 'mon' ? source?.assignments : null) || {};
        roles.forEach(role => {
          const slots = getRoleSlotCount(role, roleSlots);
          const ids = (daySource?.[role.key] || []).map(p => typeof p === 'string' ? p : (p?.id || '')).filter(Boolean);
          weekly[day.key][role.key] = [...ids, ...Array(slots).fill('')].slice(0, slots);
        });
      });
      return weekly;
    }

    function countAssignedInWeekly(weeklyAssignments, roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs);
      return dutyDays.reduce((sum, day) => sum + roles.reduce((daySum, role) => {
        const ids = (weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean);
        return daySum + ids.length;
      }, 0), 0);
    }

    function duplicateStudentIdsInWeekly(weeklyAssignments, roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs);
      const counts = {};
      dutyDays.forEach(day => roles.forEach(role => {
        (weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean).forEach(id => {
          counts[id] = (counts[id] || 0) + 1;
        });
      }));
      return Object.entries(counts).filter(([, count]) => count > 1).map(([id]) => id);
    }

    function dutiesToCSV(duties) {
      const allRoles = [];
      const seen = new Set();
      duties.forEach(d => getDutyRoles(d).forEach(role => { if (!seen.has(role.key)) { seen.add(role.key); allRoles.push(role); } }));
      const rolesForHeader = allRoles.length ? allRoles : dutyRoles;
      const headers = ['สัปดาห์', 'วันที่', 'ปีการศึกษา', 'ตาราง', 'วัน', ...rolesForHeader.map(r => r.title), 'หมายเหตุ', 'วันที่บันทึก'];
      const rows = [];
      duties.forEach(d => {
        const weekly = getDutyWeeklyAssignments(d);
        dutyDays.forEach(day => rows.push([
          formatThaiWeekRange(d.date), formatThaiDate(getDutyDayDate(d.date, day.key)), d.academicYear, dutyTableLabel(d.scheduleType), day.label,
          ...rolesForHeader.map(r => dailyDutyRoleText(weekly, day.key, r.key)),
          d.note || '', d.createdAt || ''
        ].map(escapeCSV).join(',')));
      });
      return '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.join('\n');
    }

    function statusLabel(status) {
      if (status === 'paused') return 'พักกิจกรรม';
      if (status === 'graduated') return 'จบแล้ว';
      if (status === 'dismissed') return 'พ้นสภาพ';
      return 'สมาชิกปัจจุบัน';

    function statusBadge(status) {
      if (status === 'paused') return 'bg-amber-50 text-amber-700 border-amber-100';
      if (status === 'graduated') return 'bg-slate-100 text-slate-700 border-slate-200';
      if (status === 'dismissed') return 'bg-red-50 text-red-700 border-red-100';
      return 'bg-emerald-50 text-emerald-700 border-emerald-100';
    }

    function approxBytesFromDataUrl(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.includes(',')) return 0;
      return Math.round((dataUrl.split(',')[1].length * 3) / 4);
    }

    function prettyBytes(bytes) {
      if (!bytes) return '-';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function optimizeImageFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !String(file.type || '').startsWith('image/')) {
          reject(new Error('กรุณาเลือกไฟล์รูปภาพเท่านั้น'));
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = PHOTO_SIZE;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            const crop = Math.min(iw, ih);
            const sx = Math.max(0, (iw - crop) / 2);
            const sy = Math.max(0, (ih - crop) / 2);

            ctx.drawImage(img, sx, sy, crop, crop, 0, 0, size, size);
            const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);

            resolve({
              dataUrl,
              meta: {
                width: PHOTO_SIZE,
                height: PHOTO_SIZE,
                quality: PHOTO_QUALITY,
                approxBytes: approxBytesFromDataUrl(dataUrl),
                source: 'upload',
                originalName: file.name || '',
                originalBytes: file.size || 0,
                optimizedAt: new Date().toISOString()
              }
            });
          };
          img.onerror = () => reject(new Error('อ่านรูปภาพไม่สำเร็จ ลองเลือกไฟล์รูปอื่น'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
        reader.readAsDataURL(file);
      });
    }

    function isBlank(v) { return !String(v || '').trim(); }

    function isIncompleteStudent(s) {
      return isBlank(s.studentId) || isBlank(s.fullName) || isBlank(s.nickname) || isBlank(s.academicYear) || isBlank(s.level) || isBlank(s.group) || isBlank(s.major) || isBlank(s.phone) || isBlank(s.lineId) || isBlank(s.emergencyPhone) || isBlank(s.interest) || !s.photo;
    }

    function dataQualityMatch(s, key) {
      if (key === 'withPhoto') return !!s.photo;
      if (key === 'noPhoto') return !s.photo;
      if (key === 'incomplete') return isIncompleteStudent(s);
      if (key === 'noPhone') return isBlank(s.phone);
      if (key === 'noLine') return isBlank(s.lineId);
      if (key === 'noEmergency') return isBlank(s.emergencyPhone);
      if (key === 'noInterest') return isBlank(s.interest);
      if (key === 'noActualInterest') return isBlank(s.actualInterest);
      return true;
    }

    function missingSummary(s) {
      const items = [];
      if (!s.photo) items.push('ไม่มีรูป');
      if (isBlank(s.phone)) items.push('ไม่มีเบอร์โทร');
      if (isBlank(s.lineId)) items.push('ไม่มี Line');
      if (isBlank(s.emergencyPhone)) items.push('ไม่มีเบอร์ฉุกเฉิน');
      if (isBlank(s.interest)) items.push('ไม่ระบุฝ่ายสนใจ');
      if (isBlank(s.actualInterest)) items.push('ยังไม่กำหนดฝ่ายจริง');
      return items.length ? items.join(' · ') : 'ข้อมูลครบถ้วน';
    }

                  <nav className="flex lg:flex-col gap-2 overflow-x-auto no-scrollbar w-full">
                    {navItems.map(item => (

    function TopBar({ activeTab, currentAcademicYear, theme, toggleTheme, onLogout }) {
      const titleMap = {

          <div className="flex items-center gap-4">
            <div className="brand-logo-compact hidden sm:flex"><img src={MDEC_LOGO} alt="MDEC" /></div>
            <div>
              <p className="text-xs font-bold text-blue-600 tracking-widest uppercase">MDEC PHOTO CLUB COMMAND CENTER</p>
              <p className="text-[11px] text-slate-500 mt-1">ภายใต้การดูแลของศูนย์มัลติมีเดียทางการศึกษา</p>
              <h2 className="text-2xl md:text-3xl font-extrabold text-slate-950 tracking-tight">{titleMap[activeTab] || 'Command Center'}</h2>

          </div>
        </header>
      );
    }

    function buildStats(students, targetYear) {
      const target = targetYear === 'all' ? students : students.filter(s => s.academicYear === targetYear);
      const res = { total: target.length, active:0, paused:0, graduated:0, dismissed:0, male:0, female:0, lgbt:0, withPhoto:0, noPhoto:0, incomplete:0, noPhone:0, noLine:0, noEmergency:0, noActualInterest:0, levels:{}, majors:{}, interests:{}, actualInterests:{} };
      target.forEach(s => {
        const status = s.status || 'active';
        if (status === 'graduated') res.graduated++;
        else if (status === 'dismissed') res.dismissed++;
        else if (status === 'paused') res.paused++;
        else res.active++;
        if (s.gender === 'ชาย') res.male++;
        else if (s.gender === 'หญิง') res.female++;
        else res.lgbt++;
        if (s.photo) res.withPhoto++; else res.noPhoto++;
        if (isIncompleteStudent(s)) res.incomplete++;
        if (isBlank(s.phone)) res.noPhone++;
        if (isBlank(s.lineId)) res.noLine++;
        if (isBlank(s.emergencyPhone)) res.noEmergency++;
        if (isBlank(s.actualInterest)) res.noActualInterest++;
        if (s.level) res.levels[s.level] = (res.levels[s.level] || 0) + 1;
        if (s.major) res.majors[s.major] = (res.majors[s.major] || 0) + 1;
        if (s.interest) res.interests[s.interest] = (res.interests[s.interest] || 0) + 1;
        if (s.actualInterest) res.actualInterests[s.actualInterest] = (res.actualInterests[s.actualInterest] || 0) + 1;
      });
      return res;
    }


    function DutySchedulePage({ students, currentAcademicYear, yearsList }) {
      const [duties, setDuties] = useState([]);
      const [templates, setTemplates] = useState({});
      const [loading, setLoading] = useState(true);
      const [year, setYear] = useState(currentAcademicYear);
      const [search, setSearch] = useState('');
      const [form, setForm] = useState(() => createDutyForm(currentAcademicYear));
      const [editingId, setEditingId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [isPrinting, setIsPrinting] = useState(false);

      useEffect(() => {
        const unsub = getDutyRef().onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
          setDuties(data);
          setLoading(false);
        }, err => {
          console.error(err);
          setLoading(false);
          alert('โหลดตารางเวรไม่สำเร็จ');
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        const unsub = getDutyTemplatesRef().onSnapshot(snapshot => {
          const map = {};
          snapshot.docs.forEach(doc => { map[doc.id] = { id: doc.id, ...doc.data() }; });
          setTemplates(map);
        }, err => console.error('load duty templates failed', err));
        return () => unsub();
      }, []);

      const activeStudents = useMemo(() => students
        .filter(s => (s.academicYear || currentAcademicYear) === form.academicYear && (s.status || 'active') !== 'dismissed' && (s.status || 'active') !== 'graduated')
        .sort((a,b) => String(a.level || '').localeCompare(String(b.level || ''), 'th') || String(a.group || '').localeCompare(String(b.group || ''), 'th') || String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'))
      , [students, form.academicYear, currentAcademicYear]);

      const studentMap = useMemo(() => new Map(students.map(s => [s.id, s])), [students]);
      const formRoles = useMemo(() => normalizeDutyRoles(form.roleDefs, form.roleSlots), [form.roleDefs, form.roleSlots]);
      const duplicateIds = useMemo(() => duplicateStudentIdsInWeekly(form.weeklyAssignments, formRoles), [form.weeklyAssignments, formRoles]);
      const duplicateNames = duplicateIds.map(id => studentMap.get(id)).filter(Boolean).map(s => `${s.nickname || s.fullName || '-'} (${s.level || '-'} / ${s.group || '-'})`);

      const visibleDuties = useMemo(() => {
        const q = search.trim().toLowerCase();
        return duties.filter(d => {
          const matchYear = year === 'all' || d.academicYear === year;
          const weekly = getDutyWeeklyAssignments(d);
          const text = [
            d.date, formatThaiWeekRange(d.date), d.academicYear, dutyTableLabel(d.scheduleType), d.note,
            ...dutyDays.flatMap(day => [day.label, dutyDayText({ ...d, weeklyAssignments: weekly }, day.key)])
          ].join(' ').toLowerCase();
          return matchYear && (!q || text.includes(q));
        });
      }, [duties, year, search]);

      const nextDuty = useMemo(() => {
        const today = getWeekStartDate(todayFileDate());
        return duties
          .filter(d => d.academicYear === currentAcademicYear && String(getWeekStartDate(d.date) || '') >= today)
          .sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')))[0] || null;
      }, [duties, currentAcademicYear]);

      const setRoleSlotCount = (roleKey, value) => {
        const nextCount = Math.max(0, Math.min(10, Number(value) || 0));
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, { ...(prev.roleSlots || {}), [roleKey]: nextCount });
          const roleSlots = normalizeRoleSlots({ ...(prev.roleSlots || {}), [roleKey]: nextCount }, roles);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roles);
          return { ...prev, roleDefs: roles, roleSlots, weeklyAssignments };
        });
      };

      const setRoleField = (roleKey, field, value) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots).map(role => role.key === roleKey ? { ...role, [field]: value } : role);
          const roleSlots = normalizeRoleSlots(prev.roleSlots, roles);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roles);
          return { ...prev, roleDefs: roles, roleSlots, weeklyAssignments };
        });
      };

      const addRole = () => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const nextIndex = roles.length + 1;
          const key = `custom_${Date.now()}`;
          const newRole = { key, title: `ตำแหน่งใหม่ ${nextIndex}`, shortTitle: `ตำแหน่ง ${nextIndex}`, icon: dutyRoleIcons[nextIndex % dutyRoleIcons.length], tone: dutyRoleTones[nextIndex % dutyRoleTones.length], slots: 1 };
          const roleDefs = [...roles, newRole];
          const roleSlots = normalizeRoleSlots({ ...(prev.roleSlots || {}), [key]: 1 }, roleDefs);
          const weeklyAssignments = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roleDefs);
          return { ...prev, roleDefs, roleSlots, weeklyAssignments };
        });
      };

      const removeRole = (roleKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          if (roles.length <= 1) { alert('ต้องมีอย่างน้อย 1 ตำแหน่งเวร'); return prev; }
          const target = roles.find(r => r.key === roleKey);
          if (!confirm(`ลบตำแหน่ง "${target?.title || roleKey}" ออกจากตารางนี้ใช่ไหม?`)) return prev;
          const roleDefs = roles.filter(role => role.key !== roleKey);
          const roleSlots = { ...(prev.roleSlots || {}) };
          delete roleSlots[roleKey];
          const weeklyAssignments = JSON.parse(JSON.stringify(prev.weeklyAssignments || {}));
          dutyDays.forEach(day => { if (weeklyAssignments?.[day.key]) delete weeklyAssignments[day.key][roleKey]; });
          return { ...prev, roleDefs, roleSlots: normalizeRoleSlots(roleSlots, roleDefs), weeklyAssignments: normalizeWeeklyAssignmentIds(weeklyAssignments, roleSlots, roleDefs) };
        });
      };

      const resetRolesToDefault = () => {
        setForm(prev => {
          const roleDefs = defaultDutyRoleDefs();
          const roleSlots = defaultDutyRoleSlots(roleDefs);
          return { ...prev, roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(prev.weeklyAssignments || {}, roleSlots, roleDefs) };
        });
      };

      const setAssignment = (dayKey, roleKey, slot, value) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          const current = [...(weekly[dayKey]?.[roleKey] || [])];
          while (current.length < slot + 1) current.push('');
          current[slot] = value;
          weekly[dayKey][roleKey] = current;
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const copyDay = (fromDayKey, toDayKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          weekly[toDayKey] = JSON.parse(JSON.stringify(weekly[fromDayKey] || emptyDutyAssignments(prev.roleSlots, roles)));
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const clearDay = (dayKey) => {
        setForm(prev => {
          const roles = normalizeDutyRoles(prev.roleDefs, prev.roleSlots);
          const weekly = normalizeWeeklyAssignmentIds(prev.weeklyAssignments || prev, prev.roleSlots, roles);
          weekly[dayKey] = emptyDutyAssignments(prev.roleSlots, roles);
          return { ...prev, weeklyAssignments: weekly };
        });
      };

      const applyTemplate = (type = form.scheduleType, academicYear = form.academicYear) => {
        const safeType = type === 'B' ? 'B' : 'A';
        const template = templates[dutyTemplateDocId(academicYear, safeType)];
        if (!template) return alert(`ยังไม่ได้บันทึก${dutyTableLabel(safeType)} ของปีการศึกษา ${academicYear}`);
        const roleDefs = getDutyRoles(template);
        const roleSlots = normalizeRoleSlots(template.roleSlots || {}, roleDefs);
        setForm(prev => ({ ...prev, academicYear, scheduleType: safeType, roleDefs, roleSlots, weeklyAssignments: normalizeWeeklyAssignmentIds(template, roleSlots, roleDefs) }));
      };

      const saveTemplate = async (type = form.scheduleType) => {
        const safeType = type === 'B' ? 'B' : 'A';
        if (!form.academicYear) return alert('กรุณาเลือกปีการศึกษาก่อน');
        if (!confirm(`บันทึกตารางเวร จันทร์–เสาร์ ชุดปัจจุบันเป็น${dutyTableLabel(safeType)} ของปีการศึกษา ${form.academicYear} ใช่ไหม?`)) return;
        const payload = {
          academicYear: form.academicYear,
          scheduleType: safeType,
          roleDefs: normalizeDutyRoles(form.roleDefs, form.roleSlots),
          roleSlots: normalizeRoleSlots(form.roleSlots, form.roleDefs),
          weeklyAssignments: normalizeWeeklyAssignmentIds(form.weeklyAssignments, form.roleSlots, form.roleDefs),
          updatedAt: new Date().toISOString(),
          updatedBy: 'staff'
        };
        await getDutyTemplatesRef().doc(dutyTemplateDocId(form.academicYear, safeType)).set(payload, { merge: true });
        alert(`บันทึก${dutyTableLabel(safeType)} แบบรายวัน จันทร์–เสาร์ เรียบร้อย`);
      };

      const latestDutyForYear = useMemo(() => duties
        .filter(d => d.academicYear === form.academicYear)
        .sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')))[0] || null
      , [duties, form.academicYear]);

      const suggestedNextType = latestDutyForYear?.scheduleType === 'A' ? 'B' : 'A';

      const applySuggestedTemplate = () => {
        const type = suggestedNextType || 'A';
        applyTemplate(type, form.academicYear);
      };

      const resetForm = () => {
        setEditingId(null);
        setForm(createDutyForm(currentAcademicYear));
      };

      const buildWeeklySnapshot = () => {
        const lookup = new Map(students.map(s => [s.id, s]));
        const weekly = {};
        dutyDays.forEach(day => {
          weekly[day.key] = {};
          formRoles.forEach(role => {
            const ids = [...new Set((form.weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean))];
            weekly[day.key][role.key] = ids.map(id => {
              const s = lookup.get(id);
              return s ? {
                id: s.id,
                studentId: s.studentId || '',
                fullName: s.fullName || '',
                nickname: s.nickname || '',
                level: s.level || '',
                group: s.group || '',
                major: s.major || '',
                phone: s.phone || '',
                lineId: s.lineId || '',
                actualInterest: s.actualInterest || s.interest || '',
                photo: s.photo || null
              } : null;
            }).filter(Boolean);
          });
        });
        return weekly;
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!form.date) return alert('กรุณาเลือกสัปดาห์');
        const invalidRoles = formRoles.filter(role => !String(role.title || '').trim());
        if (invalidRoles.length) return alert('กรุณาใส่ชื่อตำแหน่งให้ครบ หรือกดปุ่มลบตำแหน่งที่ไม่ต้องการออกก่อนบันทึก');
        const weeklyAssignments = buildWeeklySnapshot();
        const assignedCount = countAssignedInWeekly(weeklyAssignments, formRoles);
        if (!assignedCount) return alert('กรุณาเลือกนักศึกษาอย่างน้อย 1 หน้าที่');
        const repeated = duplicateStudentIdsInWeekly(form.weeklyAssignments, formRoles);
        if (repeated.length && !confirm(`มีนักศึกษาซ้ำในสัปดาห์นี้ ${repeated.length} คน ต้องการบันทึกต่อไหม?`)) return;
        const weekStart = getWeekStartDate(form.date);
        const targetYear = form.academicYear || currentAcademicYear;
        const duplicateWeek = duties.find(d => d.id !== editingId && d.academicYear === targetYear && getWeekStartDate(d.date) === weekStart);
        if (duplicateWeek && !confirm(`มีตารางเวรตอนเช้าของ${formatThaiWeekRange(weekStart)} อยู่แล้ว ต้องการบันทึกเพิ่ม/ซ้ำใช่ไหม?`)) return;
        setSaving(true);
        try {
          const payload = {
            date: weekStart,
            academicYear: targetYear,
            scheduleType: form.scheduleType === 'B' ? 'B' : 'A',
            note: form.note || '',
            roleDefs: normalizeDutyRoles(form.roleDefs, form.roleSlots),

                <p className="text-slate-300 text-sm leading-relaxed">ให้ตั้งตาราง A และ B เป็น “ตารางทั้งสัปดาห์” โดยแยกคนแต่ละวัน จันทร์–เสาร์ จากนั้นสลับใช้ทุก 1 สัปดาห์ ระบบจะเตือนถ้ามีชื่อซ้ำในสัปดาห์เดียวกัน</p>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-5 md:p-6">
            <div className="flex flex-col xl:flex-row gap-4 xl:items-center xl:justify-between mb-5">
              <div>
                <h3 className="text-xl font-extrabold text-slate-950"><i className="ri-list-check-3 text-blue-600 mr-2"></i>รายการตารางเวรตอนเช้า</h3>
                <p className="text-slate-500">ค้นหา ดูย้อนหลังรายสัปดาห์ พิมพ์ หรือส่งออก CSV ได้</p>
              </div>
              <div className="flex flex-col sm:flex-row gap-2">
                <select value={year} onChange={e => setYear(e.target.value)} className="px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-bold">
                  <option value="all">ทุกปีการศึกษา</option>
                  {[...new Set([currentAcademicYear, ...yearsList])].map(y => <option key={y} value={y}>ปี {y}</option>)}
                </select>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาสัปดาห์ / วัน / ชื่อ / หมายเหตุ" className="px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-bold" />
                <button onClick={exportCSV} className="px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold"><i className="ri-file-excel-2-fill mr-1"></i> CSV</button>
                <button onClick={() => setIsPrinting(true)} className="px-4 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold"><i className="ri-printer-fill mr-1"></i> พิมพ์</button>
              </div>
            </div>

            {loading ? <div className="p-10 text-center text-slate-500 font-bold">กำลังโหลดตารางเวร...</div> : visibleDuties.length ? (
              <div className="space-y-3">
                {visibleDuties.map(duty => {
                  const weekly = getDutyWeeklyAssignments(duty);
                  return (
                    <div key={duty.id} className="rounded-[1.6rem] bg-slate-50 border border-slate-100 p-4">
                      <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
                        <div className="min-w-[190px]"><p className="text-xs text-blue-600 font-bold">{duty.academicYear}</p><h4 className="font-extrabold text-slate-950 text-lg">{formatThaiWeekRange(duty.date)}</h4><span className="inline-flex mt-1 px-3 py-1 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold">{dutyTableLabel(duty.scheduleType)}</span>{duty.note && <p className="text-sm text-slate-500 mt-1">{duty.note}</p>}</div>
                        <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-2 flex-1">
                          {dutyDays.map(day => <div key={day.key} className="rounded-2xl bg-white/70 border border-slate-100 p-3"><p className="text-xs text-slate-500 font-bold"><i className="ri-calendar-event-fill text-blue-600 mr-1"></i>{day.shortLabel} · {formatThaiDate(getDutyDayDate(duty.date, day.key))}</p><p className="text-sm font-bold text-slate-900 leading-relaxed mt-1">{getDutyRoles(duty).map(role => `${role.shortTitle}: ${dailyDutyRoleText(weekly, day.key, role.key)}`).join(' / ')}</p></div>)}
                        </div>
                        <div className="flex lg:flex-col gap-2">
                          <button onClick={() => editDuty(duty)} className="w-10 h-10 rounded-xl bg-white text-blue-600 hover:bg-blue-50"><i className="ri-edit-2-fill text-xl"></i></button>
                          <button onClick={() => duplicateDuty(duty)} className="w-10 h-10 rounded-xl bg-white text-emerald-600 hover:bg-emerald-50"><i className="ri-file-copy-2-fill text-xl"></i></button>
                          <button onClick={() => deleteDuty(duty)} className="w-10 h-10 rounded-xl bg-white text-red-600 hover:bg-red-50"><i className="ri-delete-bin-fill text-xl"></i></button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : <div className="p-12 text-center rounded-3xl bg-slate-50 border border-slate-100 text-slate-500 font-bold">ยังไม่มีตารางเวรตามเงื่อนไขที่เลือก</div>}
          </div>

          {isPrinting && ReactDOM.createPortal(<PrintDutySchedule duties={visibleDuties} yearText={year === 'all' ? 'ทุกปีการศึกษา' : year} onClose={() => setIsPrinting(false)} />, document.body)}
        </div>
      );
    }

    function PrintDutySchedule({ duties, yearText, onClose }) {
      const reportDate = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
      const sorted = [...duties].sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
      const allRoles = [];
      const seen = new Set();
      sorted.forEach(d => getDutyRoles(d).forEach(role => { if (!seen.has(role.key)) { seen.add(role.key); allRoles.push(role); } }));
      const rolesForHeader = allRoles.length ? allRoles : dutyRoles;
      return (
        <div className="print-overlay fixed inset-0 z-[100] bg-white overflow-y-auto p-4 md:p-8 animate-fade-in">
          <div className="no-print flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-6 pb-5 border-b">
            <div><h2 className="font-extrabold text-2xl">พิมพ์ตารางเวรตอนเช้า</h2><p className="text-slate-500">รายงานนี้แสดงตามตัวกรองในหน้าตารางเวร</p></div>
            <div className="flex gap-2"><button onClick={() => window.print()} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-bold"><i className="ri-printer-fill mr-2"></i>พิมพ์ / Save PDF</button><button onClick={onClose} className="px-5 py-3 rounded-2xl bg-slate-100 text-slate-700 font-bold">ปิด</button></div>
          </div>
          <section className="report-page">
            <div className="report-header">
              <div className="report-brand">
                <div className="report-logo"><img src={MDEC_LOGO} alt="MDEC" /></div>
                <div>
                  <div className="report-title">ตารางเวรตอนเช้าประจำสัปดาห์ จันทร์–เสาร์</div>
                  <div className="report-subtitle">ชมรม MDEC Photo Club • ภายใต้การดูแลของศูนย์มัลติมีเดียทางการศึกษา</div>
                </div>
              </div>
              <div className="report-meta"><div><strong>ปีการศึกษา:</strong> {yearText}</div><div><strong>จำนวนสัปดาห์:</strong> {sorted.length}</div><div><strong>วันที่ออกรายงาน:</strong> {reportDate}</div></div>
            </div>
            <div className="report-note"><span>ตำแหน่งเวรสามารถกำหนดเองได้ตามตารางแต่ละสัปดาห์</span><span>หมายเหตุ: ใช้ตาราง A/B สลับกันทุก 1 สัปดาห์ได้</span></div>
            <table className="print-table">
              <thead><tr><th style={{width:'120px'}}>สัปดาห์</th><th style={{width:'78px'}}>วัน</th><th style={{width:'65px'}}>ตาราง</th>{rolesForHeader.map(role => <th key={role.key}>{role.shortTitle || role.title}</th>)}<th style={{width:'95px'}}>หมายเหตุ</th></tr></thead>
              <tbody>{sorted.flatMap(d => {
                const weekly = getDutyWeeklyAssignments(d);
                return dutyDays.map(day => <tr key={`${d.id || d.date}-${day.key}`}><td><strong>{formatThaiWeekRange(d.date)}</strong></td><td>{day.shortLabel}<br/><span className="print-muted">{formatThaiDate(getDutyDayDate(d.date, day.key))}</span></td><td>{dutyTableLabel(d.scheduleType)}</td>{rolesForHeader.map(role => <td key={role.key}>{dailyDutyRoleText(weekly, day.key, role.key)}</td>)}<td>{d.note || '-'}</td></tr>);
              })}</tbody>
            </table>
            <div className="print-footer"><div>Generated by MDEC Photo Club Registry</div><div className="signature-zone"><div className="signature-line">ผู้จัดทำ</div><div className="signature-line">ผู้ตรวจสอบ</div></div></div>
          </section>
        </div>
      );
    }

    function DutyDisplayPage({ currentAcademicYear, yearsList, students = [], onBack, onNavigate }) {
      const [duties, setDuties] = useState([]);
      const [loading, setLoading] = useState(true);
      const [year, setYear] = useState(currentAcademicYear);
      const [selectedId, setSelectedId] = useState('auto');
      const [showControls, setShowControls] = useState(false);
      const [now, setNow] = useState(new Date());
      const [focusDayKey, setFocusDayKey] = useState('auto');
      const [autoRotate, setAutoRotate] = useState(false);

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setShowControls(false);
            if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const unsub = getDutyRef().onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
          setDuties(data);
          setLoading(false);
        }, err => {
          console.error(err);
          setLoading(false);
          alert('โหลดตารางเวรไม่สำเร็จ');
        });
        return () => unsub();
      }, []);

      const dutiesForYear = useMemo(() => duties.filter(d => d.academicYear === year).sort((a,b) => String(a.date || '').localeCompare(String(b.date || ''))), [duties, year]);
      const nextDuty = useMemo(() => {
        const today = getWeekStartDate(todayFileDate());
        return dutiesForYear.find(d => String(getWeekStartDate(d.date) || '') >= today) || dutiesForYear[dutiesForYear.length - 1] || null;
      }, [dutiesForYear]);
      const selectedDuty = useMemo(() => selectedId === 'auto' ? nextDuty : (dutiesForYear.find(d => d.id === selectedId) || nextDuty), [selectedId, nextDuty, dutiesForYear]);
      const yearOptions = [...new Set([currentAcademicYear, ...yearsList])];
      const studentLookup = useMemo(() => new Map((students || []).map(s => [s.id, s])), [students]);
      const clockText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      const dateText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const todayDate = todayFileDate();
      const todayKey = dutyDays.find(day => getDutyDayDate(todayDate, day.key) === todayDate)?.key;
      const isCurrentSelectedWeek = selectedDuty ? getWeekStartDate(selectedDuty.date) === getWeekStartDate(todayDate) : false;
      const resolvedFocusDayKey = focusDayKey === 'auto' ? ((isCurrentSelectedWeek && todayKey) ? todayKey : 'mon') : focusDayKey;
      const focusDay = dutyDays.find(day => day.key === resolvedFocusDayKey) || dutyDays[0];
      const weekly = selectedDuty ? getDutyWeeklyAssignments(selectedDuty) : null;
      const focusDate = selectedDuty ? getDutyDayDate(selectedDuty.date, focusDay.key) : todayDate;
      const selectedRoles = selectedDuty ? getDutyRoles(selectedDuty) : dutyRoles;
      const selectedRoleSlots = normalizeRoleSlots(selectedDuty?.roleSlots || {}, selectedRoles);
      const focusPeopleCount = focusDay ? selectedRoles.reduce((sum, role) => sum + ((weekly?.[focusDay.key]?.[role.key] || []).length), 0) : 0;

      useEffect(() => {
        setFocusDayKey('auto');
      }, [selectedId, year]);

      useEffect(() => {
        if (!autoRotate || !selectedDuty) return;
        const timer = setInterval(() => {
          setFocusDayKey(prev => {
            const current = prev === 'auto' ? resolvedFocusDayKey : prev;
            const idx = Math.max(0, dutyDays.findIndex(d => d.key === current));
            return dutyDays[(idx + 1) % dutyDays.length].key;
          });
        }, 9000);
        return () => clearInterval(timer);
      }, [autoRotate, selectedDuty, resolvedFocusDayKey]);

      const toggleFullscreen = () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      };

      const roleColor = (tone) => ({
        blue: { panel:'bg-sky-500/10 border-sky-300/20', accent:'bg-sky-400 text-slate-950', accentSoft:'bg-sky-500/14 border-sky-300/20', soft:'bg-sky-500/12', text:'text-sky-100', line:'bg-sky-400' },
        cyan: { panel:'bg-cyan-500/10 border-cyan-300/20', accent:'bg-cyan-300 text-slate-950', accentSoft:'bg-cyan-500/14 border-cyan-300/20', soft:'bg-cyan-500/12', text:'text-cyan-100', line:'bg-cyan-300' },
        emerald: { panel:'bg-emerald-500/10 border-emerald-300/20', accent:'bg-emerald-300 text-slate-950', accentSoft:'bg-emerald-500/14 border-emerald-300/20', soft:'bg-emerald-500/12', text:'text-emerald-100', line:'bg-emerald-300' },
        purple: { panel:'bg-violet-500/10 border-violet-300/20', accent:'bg-violet-400 text-white', accentSoft:'bg-violet-500/14 border-violet-300/20', soft:'bg-violet-500/12', text:'text-violet-100', line:'bg-violet-400' },
        orange: { panel:'bg-amber-500/10 border-amber-300/20', accent:'bg-amber-300 text-slate-950', accentSoft:'bg-amber-500/14 border-amber-300/20', soft:'bg-amber-500/12', text:'text-amber-100', line:'bg-amber-300' }
      }[tone] || { panel:'bg-blue-500/10 border-blue-300/20', accent:'bg-blue-400 text-slate-950', accentSoft:'bg-blue-500/14 border-blue-300/20', soft:'bg-blue-500/12', text:'text-blue-100', line:'bg-blue-400' });

      const dayColor = (key, active) => ({
        mon: active ? 'bg-sky-400 text-slate-950 border-sky-200' : 'bg-sky-400/12 text-sky-100 border-sky-300/20',
        tue: active ? 'bg-emerald-300 text-slate-950 border-emerald-200' : 'bg-emerald-400/12 text-emerald-100 border-emerald-300/20',
        wed: active ? 'bg-violet-400 text-white border-violet-200' : 'bg-violet-400/12 text-violet-100 border-violet-300/20',
        thu: active ? 'bg-amber-300 text-slate-950 border-amber-200' : 'bg-amber-400/12 text-amber-100 border-amber-300/20',
        fri: active ? 'bg-rose-400 text-white border-rose-200' : 'bg-rose-400/12 text-rose-100 border-rose-300/20',
        sat: active ? 'bg-cyan-300 text-slate-950 border-cyan-200' : 'bg-cyan-400/12 text-cyan-100 border-cyan-300/20'
      }[key] || (active ? 'bg-blue-400 text-slate-950 border-blue-200' : 'bg-white/10 text-white border-white/10'));

      const resolvePerson = (person) => {
        if (!person) return null;
        if (typeof person === 'string') {
          const s = studentLookup.get(person);
          return s ? {
            id: s.id,
            studentId: s.studentId || '',
            fullName: s.fullName || '',
            nickname: s.nickname || '',
            level: s.level || '',
            group: s.group || '',
            major: s.major || '',
            photo: s.photo || null
          } : { id: person, fullName: '-', nickname: '-', photo: null };
        }
        const s = studentLookup.get(person.id);
        return {
          ...person,
          fullName: person.fullName || s?.fullName || '',
          nickname: person.nickname || s?.nickname || '',
          studentId: person.studentId || s?.studentId || '',
          level: person.level || s?.level || '',
          group: person.group || s?.group || '',
          major: person.major || s?.major || '',
          photo: person.photo || s?.photo || null
        };
      };

      const initialsOf = (person) => {
        const text = person?.nickname || person?.fullName || '?';
        return String(text).trim().charAt(0) || '?';
      };

      const renderPersonCard = (person, idx, tone) => {
        const c = roleColor(tone);
        return (
          <div key={person?.id || idx} className={`rounded-[1.35rem] ${c.soft} border border-white/10 p-3`}>
            <div className="flex items-center gap-3">
              <div className="w-16 h-16 md:w-20 md:h-20 rounded-[1.15rem] overflow-hidden bg-slate-900/60 border border-white/10 flex-shrink-0 flex items-center justify-center">
                {person?.photo ? (
                  <img src={person.photo} alt={person.nickname || person.fullName || 'student'} className="w-full h-full object-cover" />
                ) : (
                  <div className={`w-full h-full flex items-center justify-center text-2xl md:text-3xl font-extrabold ${c.text}`}>{initialsOf(person)}</div>
                )}
              </div>
              <div className="min-w-0">
                <div className="text-xl md:text-2xl font-extrabold text-white leading-tight truncate">{person?.nickname || person?.fullName || '-'}</div>
                <div className="text-sm md:text-base text-blue-100 truncate">{person?.fullName && person?.nickname ? person.fullName : (person?.studentId || '-')}</div>
                <div className={`text-xs md:text-sm font-bold mt-1 ${c.text}`}>{[person?.level, person?.group].filter(Boolean).join(' / ') || (person?.major || '-')}</div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="relative min-h-[calc(100vh-32px)] overflow-hidden rounded-[2.4rem] bg-[#081323] border border-white/10 soft-shadow text-white">
          <div className="absolute inset-0 pointer-events-none">
            <div className="absolute inset-0 bg-gradient-to-br from-blue-950/70 via-slate-950 to-slate-950"></div>
            <div className="absolute -top-44 -right-44 w-[520px] h-[520px] rounded-full bg-blue-500/18 blur-3xl"></div>
            <div className="absolute -bottom-48 -left-44 w-[540px] h-[540px] rounded-full bg-cyan-400/10 blur-3xl"></div>
          </div>

          <div className="no-print fixed top-4 right-4 z-50 flex flex-wrap justify-end gap-2 opacity-70 hover:opacity-100 transition-opacity">
            <button onClick={() => { setShowControls(false); onNavigate && onNavigate('add'); }} className="px-4 py-3 rounded-2xl bg-emerald-600/95 hover:bg-emerald-600 text-white border border-emerald-400/20 backdrop-blur font-bold shadow-lg"><i className="ri-user-add-fill mr-1"></i> เพิ่มสมาชิก</button>
            <button onClick={() => { setShowControls(false); onNavigate && onNavigate('duty'); }} className="px-4 py-3 rounded-2xl bg-blue-600/95 hover:bg-blue-600 text-white border border-blue-400/20 backdrop-blur font-bold shadow-lg"><i className="ri-save-3-fill mr-1"></i> บันทึกข้อมูล</button>
            <button onClick={() => { setShowControls(false); onBack && onBack(); }} className="px-4 py-3 rounded-2xl bg-slate-950/85 hover:bg-slate-900 text-white border border-white/10 backdrop-blur font-bold shadow-lg"><i className="ri-arrow-left-line mr-1"></i> กลับ</button>
            <button onClick={() => setShowControls(true)} className="px-4 py-3 rounded-2xl bg-white/15 hover:bg-white/25 text-white border border-white/20 backdrop-blur font-bold shadow-lg"><i className="ri-settings-3-fill mr-1"></i> ตัวเลือก</button>
          </div>

          {showControls && (
            <div onClick={() => setShowControls(false)} className="no-print fixed inset-0 z-[60] bg-slate-950/45 backdrop-blur-[2px] flex items-center justify-center p-4">
              <button onClick={() => setShowControls(false)} className="absolute top-4 right-4 z-[70] px-4 py-3 rounded-2xl bg-red-600 hover:bg-red-700 text-white font-extrabold shadow-xl"><i className="ri-close-circle-fill mr-1"></i> ปิดหน้าต่างนี้</button>
              <div onClick={e => e.stopPropagation()} className="relative z-[65] w-full max-w-5xl rounded-[2rem] bg-slate-900 border border-white/20 soft-shadow p-5 md:p-6">
                <div className="flex items-start justify-between gap-4 mb-5">
                  <div>
                    <h3 className="text-2xl font-extrabold text-white">ตัวเลือกจอแสดงเวร</h3>
                    <p className="text-blue-100 text-sm mt-1">คลิกพื้นที่ว่างด้านนอก หรือกด ESC เพื่อปิดหน้าต่างนี้</p>
                  </div>
                  <button onClick={() => setShowControls(false)} className="w-11 h-11 rounded-2xl bg-red-600 hover:bg-red-700 text-white shadow-lg"><i className="ri-close-line text-2xl"></i></button>
                </div>
                <div className="grid md:grid-cols-2 xl:grid-cols-6 gap-3">
                  <select value={year} onChange={e => { setYear(e.target.value); setSelectedId('auto'); }} className="px-4 py-3 rounded-2xl bg-slate-900 border-2 border-slate-700 outline-none focus:border-blue-500 font-bold text-white">
                    {yearOptions.map(y => <option key={y} value={y}>ปี {y}</option>)}
                  </select>
                  <select value={selectedId} onChange={e => setSelectedId(e.target.value)} className="xl:col-span-2 px-4 py-3 rounded-2xl bg-slate-900 border-2 border-slate-700 outline-none focus:border-blue-500 font-bold text-white">
                    <option value="auto">แสดงเวรสัปดาห์ถัดไปอัตโนมัติ</option>
                    {dutiesForYear.map(d => <option key={d.id} value={d.id}>{formatThaiWeekRange(d.date)} · {dutyTableLabel(d.scheduleType)}</option>)}
                  </select>
                  <button onClick={() => { setShowControls(false); onNavigate && onNavigate('add'); }} className="px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold"><i className="ri-user-add-fill mr-1"></i> เพิ่มสมาชิก</button>

    function Pagination({ currentPage, totalPages, setCurrentPage }) {
      const pages = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) pages.push(i);
      }
      const uniquePages = [...new Set(pages)].sort((a,b) => a-b);
      return (
        <div className="bg-white rounded-[2rem] soft-shadow border border-white p-4 flex flex-wrap items-center justify-center gap-2 no-print">
          <button disabled={currentPage <= 1} onClick={() => setCurrentPage(p => Math.max(1, p-1))} className="px-4 py-2 rounded-xl bg-slate-100 font-bold disabled:opacity-40"><i className="ri-arrow-left-s-line"></i> ก่อนหน้า</button>
          {uniquePages.map((p, idx) => (
            <React.Fragment key={p}>
              {idx > 0 && p - uniquePages[idx-1] > 1 && <span className="px-2 text-slate-400">...</span>}
              <button onClick={() => setCurrentPage(p)} className={`w-10 h-10 rounded-xl font-bold ${p === currentPage ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}>{p}</button>
            </React.Fragment>
          ))}
          <button disabled={currentPage >= totalPages} onClick={() => setCurrentPage(p => Math.min(totalPages, p+1))} className="px-4 py-2 rounded-xl bg-slate-100 font-bold disabled:opacity-40">ถัดไป <i className="ri-arrow-right-s-line"></i></button>
        </div>
      );
    }

        academicYear: student?.academicYear || currentAcademicYear,
        level: student?.level || 'ปวช.1',
        group: student?.group || '',
        major: student?.major || majors[0] || '',
        interest: student?.interest || 'ฝ่ายภาพนิ่ง',
        equipment: student?.equipment || 'ใช้มือถือเป็นหลัก',
        experience: student?.experience || 'ระดับเริ่มต้น',
        reason: student?.reason || '',
        status: student?.status || 'active',
        statusReason: student?.statusReason || '',
        actualInterest: student?.actualInterest || '',
        staffNotes: student?.staffNotes || '',
        photo: student?.photo || null,
        photoMeta: student?.photoMeta || null
      }));

      useEffect(() => () => stopCamera(), []);

      useEffect(() => {
        if (!cameraOn || !streamRef.current || !videoRef.current) return;
        const video = videoRef.current;
        video.srcObject = streamRef.current;
        video.muted = true;
        video.playsInline = true;
        video.onloadedmetadata = () => {
          video.play().catch(() => {});
        };
        video.play().catch(() => {});
      }, [cameraOn]);

      const setField = (name, value) => setFormData(prev => ({ ...prev, [name]: value }));

      const startCamera = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return alert('เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาเปิดผ่าน Chrome/Edge/Safari เวอร์ชันใหม่ และต้องเป็น HTTPS');
          }
          stopCamera();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          streamRef.current = stream;
          setCameraOn(true);
          setTimeout(() => {
            if (videoRef.current && streamRef.current) {
              videoRef.current.srcObject = streamRef.current;
              videoRef.current.play().catch(() => {});
            }
          }, 80);
        } catch (err) {
          console.error('Camera error:', err);
          let msg = 'ไม่สามารถเปิดกล้องได้';
          if (err?.name === 'NotAllowedError' || err?.name === 'PermissionDeniedError') msg = 'ระบบยังไม่ได้รับสิทธิ์ใช้กล้อง กรุณาอนุญาตกล้องในเบราว์เซอร์แล้วลองใหม่';
          else if (err?.name === 'NotFoundError' || err?.name === 'DevicesNotFoundError') msg = 'ไม่พบกล้องในอุปกรณ์นี้';
          else if (err?.name === 'NotReadableError' || err?.name === 'TrackStartError') msg = 'กล้องอาจถูกโปรแกรมอื่นใช้งานอยู่ กรุณาปิดโปรแกรมที่ใช้กล้องแล้วลองใหม่';
          else if (location.protocol !== 'https:' && location.hostname !== 'localhost') msg = 'ต้องเปิดเว็บผ่าน HTTPS หรือ localhost กล้องจึงจะทำงานได้';
          alert(`${msg}\n\nรายละเอียด: ${err?.name || err?.message || '-'}`);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setCameraOn(false);
      };

      const capturePhoto = () => {
        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas || !video.videoWidth) return alert('กล้องยังไม่พร้อม ลองรอสักครู่แล้วกดถ่ายใหม่');
        const size = PHOTO_SIZE;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const crop = Math.min(vw, vh);
        const sx = (vw - crop) / 2;
        const sy = (vh - crop) / 2;
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, crop, crop, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
        setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: { width: PHOTO_SIZE, height: PHOTO_SIZE, quality: PHOTO_QUALITY, approxBytes: approxBytesFromDataUrl(dataUrl), source: 'camera', optimizedAt: new Date().toISOString() } }));
        stopCamera();
      };

      const handleUploadPhoto = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        try {
          const { dataUrl, meta } = await optimizeImageFile(file);
          setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: meta }));
          stopCamera();
        } catch (err) {
          alert(err.message || 'อัปโหลดรูปไม่สำเร็จ');
        } finally {
          event.target.value = '';
        }
      };

      const resetForm = () => {
        setFormData({
          studentId:'', fullName:'', nickname:'', dob:'', gender:'ชาย', phone:'', lineId:'', emergencyPhone:'', medicalCondition:'-',
          academicYear: currentAcademicYear, level:'ปวช.1', group:'', major: majors[0] || '', interest:'ฝ่ายภาพนิ่ง', equipment:'ใช้มือถือเป็นหลัก', experience:'ระดับเริ่มต้น', reason:'', status:'active', statusReason:'', actualInterest:'', staffNotes:'', photo:null, photoMeta:null
        });
      };

      const submit = async e => {
        e.preventDefault();
        if (!formData.studentId || !formData.fullName || !formData.nickname) return alert('กรุณากรอก รหัสนักศึกษา / ชื่อ-นามสกุล / ชื่อเล่น');
        if (!formData.photo) {
          const ok = confirm('ยังไม่มีรูปถ่าย ต้องการบันทึกโดยไม่มีรูปหรือไม่?');
          if (!ok) return;
        }
        const normalizedStudentId = String(formData.studentId || '').trim();
        const normalizedYear = String(formData.academicYear || currentAcademicYear).trim();
        const duplicateLocal = allStudents.find(s => String(s.studentId || '').trim() === normalizedStudentId && String(s.academicYear || '').trim() === normalizedYear && s.id !== student?.id);
        if (duplicateLocal) {
          alert(`พบข้อมูลซ้ำ: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${duplicateLocal.fullName || '-'}`);
          return;
        }
        setSaving(true);
        const payload = {
          ...formData,
          studentId: normalizedStudentId,
          academicYear: normalizedYear,
          updatedAt: new Date().toISOString(),
          entryMode: 'staff_manual',
          source: 'paper_form',
          createdBy: 'เจ้าหน้าที่'
        };
        try {
          const duplicateSnap = await getStudentsRef().where('studentId', '==', normalizedStudentId).where('academicYear', '==', normalizedYear).get();
          const duplicateDoc = duplicateSnap.docs.find(d => d.id !== student?.id);
          if (duplicateDoc) {
            const d = duplicateDoc.data() || {};
            alert(`พบข้อมูลซ้ำในฐานข้อมูล: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${d.fullName || '-'}`);
            return;
          }
          if (mode === 'edit' && student?.id) {
            await getStudentsRef().doc(student.id).update(payload);
            alert('บันทึกการแก้ไขเรียบร้อย');
            onDone && onDone();
          } else {
            await getStudentsRef().add({ ...payload, createdAt: new Date().toISOString() });
            alert('เพิ่มสมาชิกใหม่เรียบร้อย');
            resetForm();
            onDone && onDone();
          }
        } catch (err) {
          alert('บันทึกไม่สำเร็จ: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={submit} className="grid xl:grid-cols-[1fr_360px] gap-5">
          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-5 md:p-7 space-y-7">
            <SectionTitle icon="ri-bank-card-fill" title="ข้อมูลการศึกษา" desc="คีย์จากใบสมัครกระดาษของนักศึกษา" />
            <div className="grid md:grid-cols-2 gap-4">
              <Input label="รหัสนักศึกษา *" value={formData.studentId} onChange={v => setField('studentId', v)} placeholder="เช่น 673228359" />
              <Input label="ปีการศึกษา *" value={formData.academicYear} onChange={v => setField('academicYear', v)} />
              <Select label="ระดับชั้น *" value={formData.level} onChange={v => setField('level', v)} options={['ปวช.1','ปวช.2','ปวช.3','ปวส.1','ปวส.2']} />
              <Input label="กลุ่มเรียน/ห้อง *" value={formData.group} onChange={v => setField('group', v)} placeholder="เช่น 1/1" />
              <Select label="สาขาวิชา *" value={formData.major} onChange={v => setField('major', v)} options={majors} className="md:col-span-2" />
            </div>

            <SectionTitle icon="ri-user-heart-fill" title="ข้อมูลส่วนตัว" desc="ข้อมูลสำหรับติดต่อและจัดทำทะเบียน" />
            <div className="grid md:grid-cols-2 gap-4">
              <Input label="ชื่อ - นามสกุล *" value={formData.fullName} onChange={v => setField('fullName', v)} placeholder="ไม่ต้องใส่คำนำหน้า" className="md:col-span-2" />
              <Input label="ชื่อเล่น *" value={formData.nickname} onChange={v => setField('nickname', v)} />
              <Select label="เพศ" value={formData.gender} onChange={v => setField('gender', v)} options={['ชาย','หญิง','LGBTQ+','อื่น ๆ']} />
              <Input label="วันเกิด" type="date" value={formData.dob} onChange={v => setField('dob', v)} />
              <Input label="เบอร์โทรศัพท์" value={formData.phone} onChange={v => setField('phone', v)} />
              <Input label="Line ID" value={formData.lineId} onChange={v => setField('lineId', v)} />
              <Input label="เบอร์โทรฉุกเฉิน" value={formData.emergencyPhone} onChange={v => setField('emergencyPhone', v)} />
              <Input label="โรคประจำตัว/แพ้อาหาร" value={formData.medicalCondition} onChange={v => setField('medicalCondition', v)} />
            </div>

            <SectionTitle icon="ri-camera-fill" title="ข้อมูลชมรม" desc="ฝ่ายที่สนใจ อุปกรณ์ และประสบการณ์" />
            <div className="grid md:grid-cols-2 gap-4">
              <Select label="ฝ่ายที่สนใจตอนสมัคร" value={formData.interest} onChange={v => setField('interest', v)} options={interestOptions} />
              <Select label="ฝ่ายที่ปฏิบัติงานจริง" value={formData.actualInterest} onChange={v => setField('actualInterest', v)} options={['', ...interestOptions]} optionLabels={{'':'ยังไม่กำหนด'}} />
              <Select label="อุปกรณ์ส่วนตัว" value={formData.equipment} onChange={v => setField('equipment', v)} options={['ใช้มือถือเป็นหลัก','มีกล้อง DSLR/Mirrorless','มีโน้ตบุ๊กสำหรับตัดต่อ','ไม่มีอุปกรณ์']} />
              <Select label="ประสบการณ์" value={formData.experience} onChange={v => setField('experience', v)} options={['ระดับเริ่มต้น','พอทำเป็นบ้าง','ระดับกลาง','ระดับเซียน']} />
              <Select label="สถานะ" value={formData.status} onChange={v => setField('status', v)} options={statusOptions.map(s => s.value)} optionLabels={Object.fromEntries(statusOptions.map(s => [s.value, s.label]))} />
              <TextArea label="เหตุผลที่อยากเข้าชมรม" value={formData.reason} onChange={v => setField('reason', v)} className="md:col-span-2" />
              <TextArea label="หมายเหตุเจ้าหน้าที่" value={formData.staffNotes} onChange={v => setField('staffNotes', v)} className="md:col-span-2" />
              {formData.status !== 'active' && <Input label="เหตุผลสถานะ" value={formData.statusReason} onChange={v => setField('statusReason', v)} className="md:col-span-2" />}
            </div>
          </div>

          <div className="xl:sticky xl:top-6 h-fit bg-slate-950 rounded-[2rem] soft-shadow p-5 text-white no-print">
            <div className="flex items-center justify-between mb-5">
              <div>
                <h3 className="font-extrabold text-xl">รูปถ่ายสมาชิก</h3>
                <p className="text-slate-400 text-sm">ถ่ายจากกล้องหรืออัปโหลดรูปจากไฟล์ · บีบอัดอัตโนมัติ {PHOTO_SIZE}×{PHOTO_SIZE}px</p>
              </div>
              <i className="ri-camera-lens-fill text-blue-300 text-3xl"></i>
            </div>

            <div className="aspect-square rounded-[1.7rem] overflow-hidden bg-slate-800 border-4 border-slate-800 mb-5 relative">
              {cameraOn ? <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover scale-x-[-1]" /> : formData.photo ? <img src={formData.photo} className="w-full h-full object-cover" /> : <div className="w-full h-full flex flex-col items-center justify-center text-slate-500"><i className="ri-image-add-fill text-6xl mb-3"></i><p className="font-bold">ยังไม่มีรูปถ่าย</p></div>}
              <canvas ref={canvasRef} className="hidden"></canvas>
            </div>

            {formData.photo && <div className="mb-4 rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-xs text-slate-400 flex items-center justify-between gap-3"><span><i className="ri-file-reduce-line mr-1"></i>{formData.photoMeta?.source === 'upload' ? 'อัปโหลดและบีบอัดแล้ว' : 'ถ่ายภาพและบีบอัดแล้ว'}</span><span className="whitespace-nowrap">{prettyBytes(formData.photoMeta?.approxBytes || approxBytesFromDataUrl(formData.photo))}</span></div>}

            <div className="grid grid-cols-2 gap-3 mb-5">
              {!cameraOn ? <button type="button" onClick={startCamera} className="py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 font-bold"><i className="ri-vidicon-fill mr-2"></i>เปิดกล้อง</button> : <button type="button" onClick={capturePhoto} className="py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 font-bold"><i className="ri-camera-fill mr-2"></i>กดถ่ายภาพ</button>}
              <label className="py-3 rounded-2xl bg-cyan-600 hover:bg-cyan-700 font-bold text-center cursor-pointer transition">
                <i className="ri-upload-cloud-2-fill mr-2"></i>เลือกรูป
                <input type="file" accept="image/*" onChange={handleUploadPhoto} className="hidden" />
              </label>
              <button type="button" onClick={() => setFormData(prev => ({ ...prev, photo: null, photoMeta: null }))} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">ลบรูป</button>
              <button type="button" onClick={stopCamera} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">ปิดกล้อง</button>
            </div>
            <p className="text-xs text-slate-500 text-center mb-5">รองรับรูปจากคอม มือถือ หรือกล้องถ่ายรูป ระบบจะครอปเป็นสี่เหลี่ยมจัตุรัสให้อัตโนมัติ</p>

            <button type="submit" disabled={saving} className="w-full py-4 rounded-2xl bg-white text-slate-950 font-extrabold text-lg hover:bg-blue-50 transition disabled:opacity-50 active:scale-[.98]">
              {saving ? 'กำลังบันทึก...' : mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกสมาชิกใหม่'}
            </button>
            <p className="text-xs text-slate-500 text-center mt-4">ระบบจะบันทึกเป็นข้อมูลที่เจ้าหน้าที่คีย์จากใบสมัคร</p>
          </div>
        </form>
      );
    }

    function SectionTitle({ icon, title, desc }) {
      return (
        <div className="flex items-start gap-3 pt-1">
          <div className="w-11 h-11 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl"><i className={icon}></i></div>
          <div><h3 className="font-extrabold text-xl text-slate-950">{title}</h3><p className="text-slate-500 text-sm">{desc}</p></div>
        </div>
      );
    }

    function Input({ label, value, onChange, placeholder, type='text', className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><input type={type} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder || ''} className="w-full px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-bold" /></label>;
    }

    function Select({ label, value, onChange, options, optionLabels={}, className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><select value={value || ''} onChange={e => onChange(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-bold">{options.map(o => <option key={o} value={o}>{optionLabels[o] || o}</option>)}</select></label>;
    }

    function TextArea({ label, value, onChange, className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><textarea value={value || ''} onChange={e => onChange(e.target.value)} rows="3" className="w-full px-4 py-3 rounded-2xl bg-slate-50 border-2 border-slate-100 outline-none focus:border-blue-500 font-bold resize-none"></textarea></label>;
    }

    function DetailModal({ student, onClose, onEdit, onStatusChange }) {
      const rows = [
        ['รหัสนักศึกษา', student.studentId], ['ชื่อ - นามสกุล', student.fullName], ['ชื่อเล่น', student.nickname], ['ปีการศึกษา', student.academicYear],
        ['ระดับ/กลุ่ม', `${student.level || '-'} / ${student.group || '-'}`], ['สาขาวิชา', student.major], ['เพศ', student.gender], ['วันเกิด', student.dob],
        ['เบอร์โทรศัพท์', student.phone], ['Line ID', student.lineId], ['เบอร์ฉุกเฉิน', student.emergencyPhone], ['โรคประจำตัว/แพ้อาหาร', student.medicalCondition],
        ['ฝ่ายที่สนใจตอนสมัคร', student.interest], ['ฝ่ายที่ปฏิบัติงานจริง', student.actualInterest || '-'], ['อุปกรณ์', student.equipment], ['ประสบการณ์', student.experience],
        ['เหตุผลที่สมัคร', student.reason], ['หมายเหตุเจ้าหน้าที่', student.staffNotes || '-'], ['ข้อมูลไม่ครบ', missingSummary(student)]
      ];
      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-3 md:p-5 no-print animate-fade-in overflow-y-auto">
          <div className="bg-white rounded-[1.6rem] md:rounded-[2rem] w-full max-w-6xl mx-auto my-2 md:my-0 soft-shadow overflow-hidden grid lg:grid-cols-[320px_minmax(0,1fr)] lg:max-h-[calc(100dvh-40px)]">
            <div className="bg-slate-950 text-white p-5 lg:p-6 flex flex-col items-center lg:justify-start">
              <img src={student.photo || 'https://via.placeholder.com/500?text=NO+IMAGE'} className="w-36 h-36 md:w-44 md:h-44 lg:w-52 lg:h-52 rounded-[1.6rem] lg:rounded-[2rem] object-cover border-4 border-white/10 shadow-xl mb-4" />
              <h3 className="text-xl lg:text-2xl font-extrabold text-center leading-snug">{student.fullName || '-'}</h3>
              <p className="text-slate-400 text-sm text-center">{student.studentId || '-'} · {student.nickname || '-'}</p>
              <select value={student.status || 'active'} onChange={e => onStatusChange(student, e.target.value)} className="mt-4 w-full px-4 py-3 rounded-2xl bg-white/10 border border-white/10 font-bold outline-none">
                {statusOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
              </select>
              <div className="mt-4 rounded-2xl bg-white/5 border border-white/10 p-4 text-sm text-slate-300 w-full max-h-32 lg:max-h-none overflow-y-auto">{student.staffNotes || 'ยังไม่มีหมายเหตุเจ้าหน้าที่'}</div>
            </div>

            <div className="flex flex-col min-h-0 lg:max-h-[calc(100dvh-40px)]">
              <div className="p-4 md:p-5 border-b flex items-center justify-between bg-slate-50 shrink-0">
                <div>
                  <h3 className="text-xl md:text-2xl font-extrabold">รายละเอียดสมาชิก</h3>
                  <p className="text-slate-500 text-xs md:text-sm">ข้อมูลครบจากใบสมัครและข้อมูลที่เจ้าหน้าที่บันทึก</p>
                </div>
                <button onClick={onClose} className="w-11 h-11 shrink-0 rounded-2xl hover:bg-slate-200 font-bold">✕</button>
              </div>

              <div className="p-4 md:p-6 overflow-visible lg:overflow-y-auto grid sm:grid-cols-2 gap-3 min-h-0 lg:flex-1">
                {rows.map(([label,value]) => (
                  <div key={label} className={`rounded-2xl bg-slate-50 border border-slate-100 p-4 ${['เหตุผลที่สมัคร','หมายเหตุเจ้าหน้าที่','ข้อมูลไม่ครบ'].includes(label) ? 'sm:col-span-2' : ''}`}>
                    <p className="text-xs text-slate-500 font-bold mb-1">{label}</p>
                    <p className="font-bold text-slate-900 break-words whitespace-pre-wrap">{value || '-'}</p>
                  </div>
                ))}
              </div>

              <div className="p-4 md:p-5 border-t flex flex-wrap gap-3 justify-end bg-white shrink-0">

    function YearManager({ students, yearsList, currentAcademicYear, setCurrentAcademicYear }) {
      const yearOptions = useMemo(() => [...new Set([currentAcademicYear, ...(yearsList || [])].filter(Boolean))], [currentAcademicYear, yearsList]);
      const [year, setYear] = useState(currentAcademicYear);
      const [confirmText, setConfirmText] = useState('');
      const [busy, setBusy] = useState(false);
      const [backupConfirmed, setBackupConfirmed] = useState(false);
      const [backupLogs, setBackupLogs] = useState([]);

      useEffect(() => {
        if (!yearOptions.includes(year) && yearOptions.length) setYear(yearOptions[0]);
      }, [yearOptions]);

      useEffect(() => { setConfirmText(''); setBackupConfirmed(false); }, [year]);

      useEffect(() => {
        const unsub = getSettingsRef().onSnapshot(doc => {
          const data = doc.exists ? (doc.data() || {}) : {};
          setBackupLogs(Array.isArray(data.backupLogs) ? data.backupLogs.slice(0, 8) : []);
        }, err => console.error('backup log load failed', err));
        return () => unsub();
      }, []);

      const selected = useMemo(() => students.filter(s => String(s.academicYear || '') === String(year || '')), [students, year]);
      const stats = useMemo(() => buildStats(students, year), [students, year]);
      const clearCode = `CLEAR ${year}`;

      const recordBackupLog = async (type) => {
        const entry = { type, academicYear: year, total: selected.length, at: new Date().toISOString() };
        const next = [entry, ...backupLogs].slice(0, 20);
        setBackupLogs(next);
        await getSettingsRef().set({ backupLogs: next }, { merge: true });
      };

      const backupJSON = () => {
        if (!selected.length) return alert('ปีนี้ยังไม่มีข้อมูลให้สำรอง');
        const payload = {
          system: 'MDEC Photo Club Registry',
          backupType: 'academic_year_full_backup',
          academicYear: year,
          exportedAt: new Date().toISOString(),
          total: selected.length,
          students: selected
        };
        downloadFile(`MDEC_PhotoClub_Backup_${year}_${todayFileDate()}.json`, JSON.stringify(payload, null, 2), 'application/json;charset=utf-8');
        recordBackupLog('JSON');
      };

      const backupCSV = () => {
        if (!selected.length) return alert('ปีนี้ยังไม่มีข้อมูลให้ส่งออก');
        downloadFile(`MDEC_PhotoClub_Members_${year}_${todayFileDate()}.csv`, studentsToCSV(selected), 'text/csv;charset=utf-8');
        recordBackupLog('CSV');
      };

      const clearYear = async () => {
        if (!selected.length) return alert('ปีนี้ไม่มีข้อมูลให้ล้าง');
        if (!backupConfirmed) return alert('กรุณาติ๊กยืนยันว่าได้สำรองข้อมูล JSON และ CSV เรียบร้อยแล้ว');
        if (confirmText !== clearCode) return alert(`กรุณาพิมพ์ ${clearCode} ให้ถูกต้อง`);
        const ok = confirm(`ยืนยันล้างข้อมูลสมาชิกปีการศึกษา ${year} จำนวน ${selected.length} รายการ?\nควรสำรองข้อมูล JSON และ CSV ก่อนล้างทุกครั้ง`);
        if (!ok) return;
        setBusy(true);
        try {
          const snap = await getStudentsRef().where('academicYear','==',year).get();
          const docs = snap.docs;
          for (let i = 0; i < docs.length; i += 450) {
            const batch = db.batch();
            docs.slice(i, i + 450).forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          }
          alert(`ล้างข้อมูลปีการศึกษา ${year} เรียบร้อย`);
          setConfirmText('');
          setBackupConfirmed(false);
        } catch (err) {
          alert('ล้างข้อมูลไม่สำเร็จ: ' + err.message);
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="space-y-5">
          <div className="year-card rounded-[2rem] soft-shadow border border-white/10 p-5 md:p-6 bg-slate-950 text-white overflow-hidden relative">
            <div className="absolute -right-20 -top-20 w-72 h-72 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div className="relative z-10 flex flex-col xl:flex-row gap-4 xl:items-center xl:justify-between">
              <div>
