    function downloadFile(filename, content, type = 'application/octet-stream;charset=utf-8') {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeCSV(value) {
      if (value === null || value === undefined) return '""';
      let str = String(value);
      if (/^[0-9]+$/.test(str) && str.length >= 6) return `=""${str}""`;
      str = str.replace(/"/g, '""');
      return `"${str}"`;
    }

        'ผู้บันทึก', 'วันที่บันทึก'
      ];
      const rows = students.map(s => [
        s.academicYear, s.studentId, s.level, s.group, s.major, s.fullName, s.nickname,
        s.gender, s.dob, statusLabel(s.status), s.statusReason, s.phone, s.emergencyPhone, s.lineId,

        s.createdBy || s.entryMode || '-', s.createdAt || '-'
      ].map(escapeCSV).join(','));
      return '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.join('\n');
    }

    const dutyRoleTones = ['blue', 'cyan', 'emerald', 'purple', 'orange'];
    const dutyRoleIcons = ['ri-flag-2-fill','ri-volume-up-fill','ri-camera-3-fill','ri-mic-fill','ri-brush-3-fill','ri-megaphone-fill','ri-team-fill','ri-tools-fill','ri-shield-check-fill','ri-star-fill'];

    function safeRoleKey(value, fallback = '') {
      const raw = String(value || '').trim().toLowerCase();
      const ascii = raw.replace(/[^a-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
      return ascii || fallback || `role_${Date.now()}`;
    }

    function defaultDutyRoleDefs() {
      return dutyRoles.map(role => ({ ...role }));
    }

    function normalizeDutyRoles(roleDefs, roleSlots) {
      const hasCustomRoles = Array.isArray(roleDefs);
      const source = hasCustomRoles ? roleDefs : dutyRoles;
      const seen = new Set();
      const roles = source.map((role, idx) => {
        const fallbackKey = dutyRoles[idx]?.key || `role_${idx + 1}`;
        let key = safeRoleKey(role?.key, fallbackKey);
        if (seen.has(key)) key = `${key}_${idx + 1}`;
        seen.add(key);

        // สำคัญ: ถ้าผู้ใช้ลบชื่อตำแหน่งให้เป็นค่าว่าง ต้องคงค่าว่างไว้
        // ไม่ fallback กลับไปเป็นค่าเริ่มต้น ไม่งั้นพิมพ์ลบแล้วมันจะเด้งกลับมาเอง
        const hasTitleValue = Object.prototype.hasOwnProperty.call(role || {}, 'title');
        const hasShortTitleValue = Object.prototype.hasOwnProperty.call(role || {}, 'shortTitle');
        const fallbackTitle = dutyRoles[idx]?.title || `ตำแหน่งที่ ${idx + 1}`;
        const title = hasTitleValue ? String(role?.title ?? '').trim() : String(role?.shortTitle || fallbackTitle).trim();
        const shortTitle = hasShortTitleValue ? String(role?.shortTitle ?? '').trim() : String(title || fallbackTitle).trim();
        const icon = role?.icon || dutyRoleIcons[idx % dutyRoleIcons.length];
        const tone = dutyRoleTones.includes(role?.tone) ? role.tone : dutyRoleTones[idx % dutyRoleTones.length];
        const rawSlots = Number(roleSlots?.[key] ?? role?.slots ?? dutyRoles[idx]?.slots ?? 1);
        const slots = Math.max(0, Math.min(10, Number.isFinite(rawSlots) ? Math.round(rawSlots) : 1));
        return { key, title, shortTitle, icon, tone, slots };
      });

      // ถ้าเป็นข้อมูล custom จากฟอร์ม ให้คืนตามจริง แม้ชื่อจะว่าง เพื่อให้แก้ไขได้ไม่เด้งกลับ
      // ถ้าไม่ได้ส่ง roleDefs มาเลย ค่อยใช้ค่าเริ่มต้น
      return hasCustomRoles ? roles : (roles.length ? roles : defaultDutyRoleDefs());
    }

    function getDutyRoles(source) {
      return normalizeDutyRoles(source?.roleDefs || source?.roles || source?.dutyRoles, source?.roleSlots);
    }

    function defaultDutyRoleSlots(roleDefs = dutyRoles) {
      return normalizeDutyRoles(roleDefs).reduce((acc, role) => {
        acc[role.key] = role.slots;
        return acc;
      }, {});
    }

    function getRoleSlotCount(role, roleSlots) {
      const raw = Number(roleSlots?.[role.key]);
      if (!Number.isFinite(raw)) return Math.max(0, Math.min(10, Number(role?.slots ?? 1)));
      return Math.max(0, Math.min(10, Math.round(raw)));
    }

    function normalizeRoleSlots(roleSlots, roleDefs = dutyRoles) {
      return normalizeDutyRoles(roleDefs, roleSlots).reduce((acc, role) => {

    function emptyDutyAssignments(roleSlots = defaultDutyRoleSlots(), roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs, roleSlots);
      const safeSlots = normalizeRoleSlots(roleSlots, roles);
      return roles.reduce((acc, role) => {
        acc[role.key] = Array(getRoleSlotCount(role, safeSlots)).fill('');

    function emptyWeeklyDutyAssignments(roleSlots = defaultDutyRoleSlots(), roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs, roleSlots);
      const safeSlots = normalizeRoleSlots(roleSlots, roles);
      return dutyDays.reduce((acc, day) => {
        acc[day.key] = emptyDutyAssignments(safeSlots, roles);
        return acc;
      }, {});

    function studentDutyName(s) {
      if (!s) return '-';
      const nick = s.nickname ? ` (${s.nickname})` : '';
      const level = s.level || s.group ? ` · ${s.level || '-'} / ${s.group || '-'}` : '';

    function dutyPersonText(p) {
      if (!p) return '-';
      const nick = p.nickname ? ` (${p.nickname})` : '';

    function dutyRoleText(assignments, key) {
      const people = (assignments && assignments[key]) || [];
      return people.length ? people.map(dutyPersonText).join(' / ') : '-';

    function dailyDutyRoleText(weeklyAssignments, dayKey, roleKey) {
      const dayAssignments = (weeklyAssignments && weeklyAssignments[dayKey]) || {};
      return dutyRoleText(dayAssignments, roleKey);
    }

    function getDutyWeeklyAssignments(duty) {
      const roles = getDutyRoles(duty || {});
      const roleSlots = normalizeRoleSlots(duty?.roleSlots || {}, roles);
      if (duty?.weeklyAssignments) return duty.weeklyAssignments;
      const weekly = emptyWeeklyDutyAssignments(roleSlots, roles);
      if (duty?.assignments) weekly.mon = duty.assignments;
      return weekly;
    }

    function dutyDayText(duty, dayKey) {
      const roles = getDutyRoles(duty || {});
      const weekly = getDutyWeeklyAssignments(duty);
      return roles.map(role => dailyDutyRoleText(weekly, dayKey, role.key)).join(' | ');
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(`${dateStr}T00:00:00`);
      if (Number.isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function dateInputString(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function localDateFromInput(dateStr) {
      if (!dateStr) return new Date();
      const [y, m, d] = String(dateStr).split('-').map(Number);
      const date = new Date(y || new Date().getFullYear(), (m || 1) - 1, d || 1);
      return Number.isNaN(date.getTime()) ? new Date() : date;
    }

    function getWeekStartDate(dateStr) {
      const d = localDateFromInput(dateStr);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day; // Monday start
      d.setDate(d.getDate() + diff);
      return dateInputString(d);
    }

    function getWeekEndDate(dateStr) {
      const d = localDateFromInput(getWeekStartDate(dateStr));
      d.setDate(d.getDate() + 5); // Monday-Saturday morning duty week
      return dateInputString(d);
    }

    function getDutyDayDate(weekStartDate, dayKey) {
      const day = dutyDays.find(d => d.key === dayKey) || dutyDays[0];
      const d = localDateFromInput(getWeekStartDate(weekStartDate));
      d.setDate(d.getDate() + day.offset);
      return dateInputString(d);
    }

    function formatThaiWeekRange(dateStr) {
      if (!dateStr) return '-';
      const start = localDateFromInput(getWeekStartDate(dateStr));
      const end = localDateFromInput(getWeekEndDate(dateStr));
      if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return dateStr;
      const s = start.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' });
      const e = end.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      return `สัปดาห์ ${s} - ${e}`;
    }

    function normalizeWeeklyAssignmentIds(source, roleSlotsOverride, roleDefsOverride) {
      const roles = normalizeDutyRoles(roleDefsOverride || source?.roleDefs || getDutyRoles(source || {}), roleSlotsOverride || source?.roleSlots || {});
      const roleSlots = normalizeRoleSlots(roleSlotsOverride || source?.roleSlots || {}, roles);
      const weekly = emptyWeeklyDutyAssignments(roleSlots, roles);
      const sourceWeekly = source?.weeklyAssignments || source;
      dutyDays.forEach(day => {
        const daySource = sourceWeekly?.[day.key] || (day.key === 'mon' ? source?.assignments : null) || {};
        roles.forEach(role => {
          const slots = getRoleSlotCount(role, roleSlots);
          const ids = (daySource?.[role.key] || []).map(p => typeof p === 'string' ? p : (p?.id || '')).filter(Boolean);
          weekly[day.key][role.key] = [...ids, ...Array(slots).fill('')].slice(0, slots);
        });
      });
      return weekly;
    }

    function countAssignedInWeekly(weeklyAssignments, roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs);
      return dutyDays.reduce((sum, day) => sum + roles.reduce((daySum, role) => {
        const ids = (weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean);
        return daySum + ids.length;
      }, 0), 0);
    }

    function duplicateStudentIdsInWeekly(weeklyAssignments, roleDefs = dutyRoles) {
      const roles = normalizeDutyRoles(roleDefs);
      const counts = {};
      dutyDays.forEach(day => roles.forEach(role => {
        (weeklyAssignments?.[day.key]?.[role.key] || []).filter(Boolean).forEach(id => {
          counts[id] = (counts[id] || 0) + 1;
        });
      }));
      return Object.entries(counts).filter(([, count]) => count > 1).map(([id]) => id);
    }

    function dutiesToCSV(duties) {
      const allRoles = [];
      const seen = new Set();
      duties.forEach(d => getDutyRoles(d).forEach(role => { if (!seen.has(role.key)) { seen.add(role.key); allRoles.push(role); } }));
      const rolesForHeader = allRoles.length ? allRoles : dutyRoles;
      const headers = ['สัปดาห์', 'วันที่', 'ปีการศึกษา', 'ตาราง', 'วัน', ...rolesForHeader.map(r => r.title), 'หมายเหตุ', 'วันที่บันทึก'];
      const rows = [];
      duties.forEach(d => {
        const weekly = getDutyWeeklyAssignments(d);
        dutyDays.forEach(day => rows.push([
          formatThaiWeekRange(d.date), formatThaiDate(getDutyDayDate(d.date, day.key)), d.academicYear, dutyTableLabel(d.scheduleType), day.label,
          ...rolesForHeader.map(r => dailyDutyRoleText(weekly, day.key, r.key)),
          d.note || '', d.createdAt || ''
        ].map(escapeCSV).join(',')));
      });
      return '\uFEFF' + headers.map(escapeCSV).join(',') + '\n' + rows.join('\n');
    }

    function statusLabel(status) {
      if (status === 'paused') return 'พักกิจกรรม';
      if (status === 'graduated') return 'จบแล้ว';
      if (status === 'dismissed') return 'พ้นสภาพ';
      return 'สมาชิกปัจจุบัน';
    }

    function statusBadge(status) {
      if (status === 'paused') return 'bg-amber-900 text-amber-100 border-amber-700 shadow-sm';
      if (status === 'graduated') return 'bg-slate-800 text-slate-100 border-slate-600 shadow-sm';
      if (status === 'dismissed') return 'bg-rose-900 text-rose-100 border-rose-700 shadow-sm';
      return 'bg-emerald-900 text-emerald-100 border-emerald-700 shadow-sm';
    }

    function approxBytesFromDataUrl(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.includes(',')) return 0;
      return Math.round((dataUrl.split(',')[1].length * 3) / 4);
    }

    function prettyBytes(bytes) {
      if (!bytes) return '-';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function isSupportedImageFile(file) {
      if (!file) return false;
      const type = String(file.type || '').toLowerCase();
      const name = String(file.name || '').toLowerCase();
      const ext = name.includes('.') ? name.split('.').pop() : '';
      return SUPPORTED_IMAGE_MIME_TYPES.includes(type) || SUPPORTED_IMAGE_EXTENSIONS.includes(ext);
    }

    function loadImageElementFromFile(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        let done = false;

        const cleanup = () => {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };

        img.onload = () => {
          if (done) return;
          done = true;
          cleanup();
          resolve(img);
        };

        img.onerror = () => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error('อ่านรูปภาพไม่สำเร็จ ไฟล์อาจเสียหายหรือเบราว์เซอร์ไม่รองรับไฟล์นี้ กรุณาเลือก JPG, PNG, WEBP, GIF หรือ BMP'));
        };

        img.src = objectUrl;
      });
    }

    async function optimizeImageFile(file) {
      if (!isSupportedImageFile(file)) {
        throw new Error('กรุณาเลือกไฟล์รูปภาพ รองรับ JPG, PNG, WEBP, GIF และ BMP');
      }

      const img = await loadImageElementFromFile(file);
      const canvas = document.createElement('canvas');
      const size = PHOTO_SIZE;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      if (!ctx) {
        throw new Error('ไม่สามารถประมวลผลรูปภาพได้ กรุณาลองใหม่อีกครั้ง');
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const crop = Math.min(iw, ih);
      const sx = Math.max(0, (iw - crop) / 2);
      const sy = Math.max(0, (ih - crop) / 2);

      ctx.drawImage(img, sx, sy, crop, crop, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);

      return {
        dataUrl,
        meta: {
          width: PHOTO_SIZE,
          height: PHOTO_SIZE,
          quality: PHOTO_QUALITY,
          approxBytes: approxBytesFromDataUrl(dataUrl),
          source: 'upload',
          originalName: file.name || '',
          originalType: file.type || '',
          originalBytes: file.size || 0,
          outputType: 'image/jpeg',
          optimizedAt: new Date().toISOString()
        }
      };
    }

    function loadImageElementFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('ไม่สามารถอ่านรูปเดิมเพื่อนำมาบีบอัดใหม่ได้'));
        img.src = dataUrl;
      });
    }

    async function optimizeImageDataUrl(dataUrl, source = 'recompress') {
      if (!dataUrl) throw new Error('ไม่พบรูปภาพเดิม');
      const img = await loadImageElementFromDataUrl(dataUrl);
      const canvas = document.createElement('canvas');
      const size = PHOTO_SIZE;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('ไม่สามารถประมวลผลรูปเดิมได้');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const crop = Math.min(iw, ih);
      const sx = Math.max(0, (iw - crop) / 2);
      const sy = Math.max(0, (ih - crop) / 2);
      ctx.drawImage(img, sx, sy, crop, crop, 0, 0, size, size);
      const nextDataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
      return {
        dataUrl: nextDataUrl,
        meta: {
          width: PHOTO_SIZE,
          height: PHOTO_SIZE,
          quality: PHOTO_QUALITY,
          approxBytes: approxBytesFromDataUrl(nextDataUrl),
          source,
          outputType: 'image/jpeg',
          optimizedAt: new Date().toISOString(),
          note: 'v72 recompressed profile image'
        }
      };
    }

    function photoApproxBytes(s) {
      return Number(s?.photoMeta?.approxBytes || approxBytesFromDataUrl(s?.photo || '') || 0);
    }

    function isLegacyOrHeavyPhoto(s) {
      if (!s?.photo) return false;
      const meta = s.photoMeta || {};
      const bytes = photoApproxBytes(s);
      const missingV72Meta = !meta.optimizedAt || !meta.width || !meta.height;
      return missingV72Meta || bytes > 120 * 1024;
    }

    function isBlank(v) { return !String(v || '').trim(); }

    function isIncompleteStudent(s) {
      return isBlank(s.studentId) || isBlank(s.fullName) || isBlank(s.nickname) || isBlank(s.academicYear) || isBlank(s.level) || isBlank(s.group) || isBlank(s.major) || isBlank(s.phone) || isBlank(s.lineId) || isBlank(s.emergencyPhone) || isBlank(s.interest) || !s.photo;
    }

    function dataQualityMatch(s, key) {
      if (key === 'withPhoto') return !!s.photo;
      if (key === 'noPhoto') return !s.photo;
      if (key === 'legacyPhoto') return isLegacyOrHeavyPhoto(s);
      if (key === 'incomplete') return isIncompleteStudent(s);
      if (key === 'noPhone') return isBlank(s.phone);
      if (key === 'noLine') return isBlank(s.lineId);
      if (key === 'noEmergency') return isBlank(s.emergencyPhone);
      if (key === 'noInterest') return isBlank(s.interest);
      if (key === 'noActualInterest') return isBlank(s.actualInterest);
      return true;
    }

    function missingSummary(s) {
      const items = [];
      if (!s.photo) items.push('ไม่มีรูป');
      else if (isLegacyOrHeavyPhoto(s)) items.push('รูปเก่า/อาจหนัก');
      if (isBlank(s.phone)) items.push('ไม่มีเบอร์โทร');
      if (isBlank(s.lineId)) items.push('ไม่มี Line');
      if (isBlank(s.emergencyPhone)) items.push('ไม่มีเบอร์ฉุกเฉิน');
      if (isBlank(s.interest)) items.push('ไม่ระบุฝ่ายสนใจ');
      if (isBlank(s.actualInterest)) items.push('ยังไม่กำหนดฝ่ายจริง');
      return items.length ? items.join(' · ') : 'ข้อมูลครบถ้วน';
    }

      const yearsList = useMemo(() => {
        const years = [...new Set(students.map(s => s.academicYear).filter(Boolean))];

      }, [students, currentAcademicYear]);

      const filteredStudents = useMemo(() => {
        const q = search.trim().toLowerCase();
        return students.filter(s => {
          const matchText = !q || [s.studentId, s.fullName, s.nickname, s.phone, s.lineId, s.group, s.major, s.interest, s.actualInterest, s.staffNotes].some(v => String(v || '').toLowerCase().includes(q));
          const matchYear = filterYear === 'all' || s.academicYear === filterYear;
          const matchMajor = filterMajor === 'all' || s.major === filterMajor;
          const matchInterest = filterInterest === 'all' || s.interest === filterInterest;
          const matchStatus = filterStatus === 'all' || (s.status || 'active') === filterStatus;
          const matchPhoto = filterPhoto === 'all' || dataQualityMatch(s, filterPhoto);
          return matchText && matchYear && matchMajor && matchInterest && matchStatus && matchPhoto;
        });
      }, [students, search, filterYear, filterMajor, filterInterest, filterStatus, filterPhoto]);

      const stats = useMemo(() => buildStats(students, filterYear), [students, filterYear]);

        downloadFile(`MDEC_Members_By_Department_${filterYear === 'all' ? 'All' : filterYear}_${todayFileDate()}.csv`, studentsToCSV(sorted), 'text/csv;charset=utf-8');
      };

      const exportFilteredCSV = () => {
        if (!filteredStudents.length) return alert('ไม่มีข้อมูลให้ส่งออก');
        downloadFile(`MDEC_Members_${filterYear === 'all' ? 'All' : filterYear}_${todayFileDate()}.csv`, studentsToCSV(filteredStudents), 'text/csv;charset=utf-8');

      const navItems = [
        { id:'home', label:'หน้าแรก', icon:'ri-home-5-fill', group:'งานวันนี้' },
        { id:'today', label:'เช้าวันนี้', icon:'ri-sun-foggy-fill', group:'งานวันนี้' },
        { id:'duty', label:'ตารางเวร', icon:'ri-calendar-schedule-fill', group:'งานวันนี้' },
        { id:'activities', label:'กิจกรรม', icon:'ri-calendar-event-fill', group:'งานวันนี้' },
        { id:'add', label:'เพิ่มสมาชิก', icon:'ri-user-add-fill', group:'ข้อมูลชมรม' },
        { id:'members', label:'สมาชิก', icon:'ri-folder-user-fill', group:'ข้อมูลชมรม' },
        { id:'works', label:'ผลงาน', icon:'ri-gallery-fill', group:'ข้อมูลชมรม' },
        { id:'council', label:'สภาชมรม', icon:'ri-vip-crown-fill', group:'ข้อมูลชมรม' },
        { id:'dutyDisplay', label:'จอเวรเช้า', icon:'ri-tv-2-fill', group:'เครื่องมือ' },
        { id:'smart', label:'เครื่องมือช่วย', icon:'ri-sparkling-2-fill', group:'เครื่องมือ' },
        { id:'dashboard', label:'รายงานสมาชิก', icon:'ri-pie-chart-2-fill', group:'รายงาน' },
        { id:'annual', label:'สรุปปี', icon:'ri-file-chart-fill', group:'รายงาน' },
        { id:'health', label:'ตรวจสุขภาพระบบ', icon:'ri-heart-pulse-fill', group:'รายงาน' },
        { id:'logs', label:'ประวัติ', icon:'ri-history-fill', group:'รายงาน' },
        { id:'year', label:'จัดการปี', icon:'ri-calendar-check-fill', group:'ตั้งค่า' },
        { id:'settings', label:'ตั้งค่าระบบ', icon:'ri-settings-3-fill', group:'ตั้งค่า' },

            <div className="page-blob-b absolute bottom-[-160px] left-[-140px] w-[480px] h-[480px] rounded-full blur-3xl"></div>

                      {activeTab === 'manual' && <ManualPage />}
                    </div>

              onClose={() => setCommandOpen(false)}
              onNavigate={(id) => { setActiveTab(id); setCommandOpen(false); }}
            />
          )}

      );

        { id:'dutyDisplay', title:'เปิดจอแสดงเวรเช้า', desc:'เปิดหน้าแสดงตารางเวรแบบเต็มจอสำหรับให้นักศึกษาดู', icon:'ri-tv-2-fill', keywords:'จอ เวร แสดง เต็มจอ' },

    function buildStats(students, targetYear) {
      const target = targetYear === 'all' ? students : students.filter(s => s.academicYear === targetYear);
      const res = { total: target.length, current:0, active:0, paused:0, graduated:0, dismissed:0, male:0, female:0, lgbt:0, withPhoto:0, noPhoto:0, incomplete:0, noPhone:0, noLine:0, noEmergency:0, noActualInterest:0, levels:{}, majors:{}, interests:{}, actualInterests:{} };
      target.forEach(s => {
        const status = s.status || 'active';
        if (status === 'graduated') res.graduated++;
        else if (status === 'dismissed') res.dismissed++;
        else {
          res.current++;
          if (status === 'paused') res.paused++;
          else res.active++;
        }
        if (s.gender === 'ชาย') res.male++;
        else if (s.gender === 'หญิง') res.female++;
        else res.lgbt++;
        if (s.photo) res.withPhoto++; else res.noPhoto++;
        if (isIncompleteStudent(s)) res.incomplete++;
        if (isBlank(s.phone)) res.noPhone++;
        if (isBlank(s.lineId)) res.noLine++;
        if (isBlank(s.emergencyPhone)) res.noEmergency++;
        if (isBlank(s.actualInterest)) res.noActualInterest++;
        if (s.level) res.levels[s.level] = (res.levels[s.level] || 0) + 1;
        if (s.major) res.majors[s.major] = (res.majors[s.major] || 0) + 1;
        if (s.interest) res.interests[s.interest] = (res.interests[s.interest] || 0) + 1;
        if (s.actualInterest) res.actualInterests[s.actualInterest] = (res.actualInterests[s.actualInterest] || 0) + 1;
      });
      return res;
    }


    function estimateCapacitySnapshot(students = [], limitMb = 900) {
      const approxJsonBytes = (value) => {
        try { return new Blob([JSON.stringify(value || {})]).size; }
        catch (err) { return String(JSON.stringify(value || {}) || '').length * 2; }
      };
      const studentDocs = (students || []).map(s => ({ collection:'students', ...s }));
      const rawBytes = studentDocs.reduce((sum, item) => sum + approxJsonBytes(item), 0);
      const overheadBytes = Math.max(1, studentDocs.length) * 650;
      const estimatedBytes = Math.round((rawBytes + overheadBytes) * 1.18);
      const limitBytes = Math.max(1, Number(limitMb || 900) * 1024 * 1024);
      const percent = Math.min(999, Math.round((estimatedBytes / limitBytes) * 1000) / 10);
      const remainingBytes = Math.max(0, limitBytes - estimatedBytes);
      const avgStudentBytes = students.length ? Math.max(1, Math.round(rawBytes / students.length)) : 0;
      const moreStudents = avgStudentBytes ? Math.floor(remainingBytes / avgStudentBytes) : 0;
      const status = percent >= 90 ? 'danger' : percent >= 75 ? 'warning' : percent >= 55 ? 'watch' : 'safe';
      const text = status === 'danger' ? 'ใกล้เต็มมาก ควรสำรองและล้างข้อมูลปีเก่า' : status === 'warning' ? 'เริ่มใกล้เพดาน ควรเตรียมสำรองข้อมูล' : status === 'watch' ? 'ข้อมูลเริ่มเยอะ ควรเฝ้าดู' : 'ยังใช้งานได้สบาย';
      return { estimatedBytes, limitBytes, percent, remainingBytes, moreStudents, status, text };
    }

            <div className="home-stat-card rounded-[1.8rem] bg-white border border-slate-200 soft-shadow p-5"><div className="home-stat-icon w-12 h-12 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-2xl mb-4"><i className="ri-gallery-fill"></i></div><p className="text-sm text-slate-500 font-bold">ผลงานปีนี้</p><p className="text-4xl font-black text-slate-950 mt-1">{yearWorks.length}</p></div>
          </section>

          <section className="grid xl:grid-cols-[1fr_.75fr] gap-5">
            <div className="v61-card p-5 md:p-6">
              <h3 className="text-xl font-black text-slate-950 mb-4"><i className="ri-alarm-warning-fill text-blue-600 mr-2"></i>สิ่งที่ควรตรวจวันนี้</h3>
              <div className="grid md:grid-cols-2 gap-3">
                {alerts.map(alert => (
                  <button key={alert.title} onClick={() => onNavigate(alert.action)} className="v61-check-item text-left">
                    <div className="flex items-start justify-between gap-3">
                      <div className="w-11 h-11 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl"><i className={alert.icon}></i></div>
                      <div className="text-3xl font-black text-slate-950">{alert.value}</div>
                    </div>
                    <div className="font-black text-slate-950 mt-3">{alert.title}</div>
                    <div className="text-xs v61-muted mt-1">{alert.desc}</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="v61-card p-5 md:p-6">
              <h3 className="text-xl font-black text-slate-950 mb-4"><i className="ri-list-check-3 text-blue-600 mr-2"></i>Checklist ใช้งานจริง</h3>
              <div className="space-y-3 text-sm">
                <div className="v61-check-item"><b>ก่อนเข้าแถว:</b> เปิด “เช้าวันนี้” ดูคนรับผิดชอบเวร</div>
                <div className="v61-check-item"><b>หลังเข้าแถว:</b> บันทึกเฉพาะปัญหา เช่น สาย / ขาด / ไม่พบตัว</div>
                <div className="v61-check-item"><b>ระหว่างวัน:</b> เพิ่มกิจกรรมและเช็คชื่อกิจกรรมที่เกิดขึ้นจริง</div>
                <div className="v61-check-item"><b>ทุกสัปดาห์:</b> ตรวจสุขภาพระบบและ Backup เมื่อข้อมูลเริ่มเยอะ</div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    function ClubActivitiesPage({ students, currentAcademicYear, yearsList }) {
      const emptyForm = () => ({
        title: '',
        date: todayFileDate(),
        academicYear: currentAcademicYear,
        type: 'ถ่ายภาพกิจกรรม',
        location: '',
        status: 'เสร็จแล้ว',
        description: '',
        albumUrl: '',
        cover: '',
        participants: [],
        attendance: {},
        note: ''
      });
      const activityTypes = ['ถ่ายภาพกิจกรรม', 'ถ่ายวิดีโอ', 'งานประชาสัมพันธ์', 'ช่วยงานหน้าเสาธง', 'อบรม/เวิร์กช็อป', 'ประชุมชมรม', 'กิจกรรมอื่น ๆ'];
      const activityStatuses = ['วางแผน', 'กำลังดำเนินการ', 'เสร็จแล้ว', 'ยกเลิก'];
      const [year, setYear] = useState(currentAcademicYear);
      const [activities, setActivities] = useState([]);
      const [loading, setLoading] = useState(true);
      const [form, setForm] = useState(emptyForm());
      const [editingId, setEditingId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [query, setQuery] = useState('');
      const [selectedStudentToAdd, setSelectedStudentToAdd] = useState('');

      useEffect(() => {
        const unsub = getActivitiesRef().onSnapshot(snapshot => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
          setActivities(data);
          setLoading(false);
        }, err => {
          console.error(err);
          setLoading(false);
          alert('โหลดข้อมูลกิจกรรมชมรมไม่สำเร็จ');
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if (!editingId) setForm(prev => ({ ...prev, academicYear: year }));
      }, [year, editingId]);

      const yearOptions = useMemo(() => [...new Set([currentAcademicYear, ...(yearsList || []), ...activities.map(a => a.academicYear)].filter(Boolean))], [currentAcademicYear, yearsList, activities]);
      const activeStudents = useMemo(() => students
        // v71.1: ปีในข้อมูลสมาชิกคือปีที่เข้าชมรม ไม่ใช่ปีที่ใช้ตัดสิทธิ์การเลือกชื่อ
        // จึงแสดงสมาชิกที่ยังใช้งานอยู่ทุกปี และใช้ปีของหน้านี้เป็นปีของกิจกรรม/เอกสารเท่านั้น
        .filter(s => !['dismissed','graduated'].includes(s.status || 'active'))
        .sort((a,b) => String(a.level || '').localeCompare(String(b.level || ''), 'th') || String(a.group || '').localeCompare(String(b.group || ''), 'th') || String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'))
      , [students]);
      const studentMap = useMemo(() => new Map(students.map(s => [s.id, s])), [students]);
      const filteredActivities = useMemo(() => {
        const q = String(query || '').trim().toLowerCase();
        return activities.filter(a => String(a.academicYear || '') === String(year || '')).filter(a => {
          if (!q) return true;
          const participantNames = (a.participants || []).map(id => {
            const s = studentMap.get(id);
            return s ? [s.studentId, s.fullName, s.nickname].join(' ') : '';
          }).join(' ');
          return [a.title, a.type, a.location, a.status, a.description, a.albumUrl, participantNames].filter(Boolean).join(' ').toLowerCase().includes(q);
        });
      }, [activities, year, query, studentMap]);

      const stats = useMemo(() => {
        const total = filteredActivities.length;
        const completed = filteredActivities.filter(a => a.status === 'เสร็จแล้ว').length;
        const inProgress = filteredActivities.filter(a => a.status === 'กำลังดำเนินการ').length;
        const uniqueMembers = new Set(filteredActivities.flatMap(a => a.participants || [])).size;
        return { total, completed, inProgress, uniqueMembers };
      }, [filteredActivities]);

      const updateForm = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const addParticipant = (studentId) => {
        if (!studentId) return;
        setForm(prev => {
          const current = Array.isArray(prev.participants) ? prev.participants : [];
          if (current.includes(studentId)) return prev;
          return { ...prev, participants: [...current, studentId], attendance: { ...(prev.attendance || {}), [studentId]: (prev.attendance || {})[studentId] || 'มา' } };
        });
        setSelectedStudentToAdd('');
      };
      const removeParticipant = (studentId) => setForm(prev => {
        const nextAttendance = { ...(prev.attendance || {}) };
        delete nextAttendance[studentId];
        return { ...prev, participants: (prev.participants || []).filter(id => id !== studentId), attendance: nextAttendance };
      });
      const setAttendance = (studentId, status) => setForm(prev => ({ ...prev, attendance: { ...(prev.attendance || {}), [studentId]: status } }));

      const handleCoverUpload = (file) => {
        if (!file) return;
        if (!isSupportedImageFile(file)) return alert('กรุณาเลือกไฟล์รูปภาพ รองรับ JPG, PNG, WEBP, GIF และ BMP');
        const reader = new FileReader();
        reader.onload = () => updateForm('cover', reader.result);
        reader.readAsDataURL(file);
      };

      const resetForm = () => {
        setForm({ ...emptyForm(), academicYear: year });
        setEditingId(null);
        setSelectedStudentToAdd('');
      };

      const saveActivity = async () => {
        if (!form.title.trim()) return alert('กรุณากรอกชื่อกิจกรรม');
        setSaving(true);
        const payload = {
          ...form,
          title: form.title.trim(),
          academicYear: String(form.academicYear || year || currentAcademicYear),
          participants: Array.isArray(form.participants) ? form.participants : [],
          attendance: form.attendance || {},
          updatedAt: new Date().toISOString(),
          updatedBy: 'staff'
        };
        try {
          if (editingId) await getActivitiesRef().doc(editingId).update(payload);
          else await getActivitiesRef().add({ ...payload, createdAt: new Date().toISOString() });
          await logSystemAction(editingId ? 'อัปเดตกิจกรรมชมรม' : 'เพิ่มกิจกรรมชมรม', { title: payload.title, academicYear: payload.academicYear, type: payload.type });
          alert(editingId ? 'อัปเดตกิจกรรมเรียบร้อย' : 'บันทึกกิจกรรมเรียบร้อย');
          resetForm();
        } catch (err) {
          alert('บันทึกกิจกรรมไม่สำเร็จ: ' + (err.message || err));
        } finally { setSaving(false); }
      };

      const editActivity = (activity) => {
        setEditingId(activity.id);
        setForm({ ...emptyForm(), ...activity, participants: Array.isArray(activity.participants) ? activity.participants : [], attendance: activity.attendance || {} });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const deleteActivity = async (activity) => {
        if (!confirm(`ลบกิจกรรม "${activity.title}" ใช่ไหม?`)) return;
        try { await getActivitiesRef().doc(activity.id).delete(); await logSystemAction('ลบกิจกรรมชมรม', { title: activity.title, academicYear: activity.academicYear }); }
        catch (err) { alert('ลบกิจกรรมไม่สำเร็จ: ' + (err.message || err)); }
      };

      const exportActivitiesCSV = () => {
        if (!filteredActivities.length) return alert('ยังไม่มีกิจกรรมให้ส่งออก');
        const headers = ['ปีการศึกษา','วันที่','ชื่อกิจกรรม','ประเภท','สถานที่','สถานะ','จำนวนสมาชิก','รายชื่อสมาชิก','สถานะเข้าร่วม','อัลบั้ม/ลิงก์','รายละเอียด'];
        const esc = (v) => `"${String(v ?? '').replace(/"/g,'""')}"`;
        const rows = filteredActivities.map(a => {
          const names = (a.participants || []).map(id => studentDutyName(studentMap.get(id) || {})).filter(Boolean).join(' / ');
          const attendance = (a.participants || []).map(id => `${studentDutyName(studentMap.get(id) || {})}: ${(a.attendance || {})[id] || 'มา'}`).join(' / ');
          return [a.academicYear, a.date, a.title, a.type, a.location, a.status, (a.participants || []).length, names, attendance, a.albumUrl, a.description].map(esc).join(',');
        });
        downloadFile(`MDEC_Club_Activities_${year}_${todayFileDate()}.csv`, '\ufeff' + [headers.map(esc).join(','), ...rows].join('\n'), 'text/csv;charset=utf-8');
      };

      const statusPill = (status) => {
        if (status === 'เสร็จแล้ว') return 'bg-emerald-900 text-emerald-100 border-emerald-700';
        if (status === 'กำลังดำเนินการ') return 'bg-blue-900 text-blue-100 border-blue-700';
        if (status === 'ยกเลิก') return 'bg-rose-900 text-rose-100 border-rose-700';
        return 'bg-amber-900 text-amber-100 border-amber-700';
      };

      return (
        <div className="space-y-5 council-audit-page">
          <section className="rounded-[2rem] bg-slate-950 text-white soft-shadow p-6 md:p-7 overflow-hidden relative">
            <div className="absolute -top-24 -right-20 w-72 h-72 rounded-full bg-blue-500/20 blur-3xl"></div>
            <div className="relative z-10 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-5">
              <div>
                <p className="text-xs font-extrabold tracking-[0.22em] text-blue-200 uppercase mb-2">Club Activities</p>
                <h3 className="text-3xl md:text-4xl font-black">กิจกรรมชมรม</h3>
                <p className="text-blue-100 mt-2 max-w-3xl">บันทึกงานที่ชมรมไปช่วย เช่น ถ่ายภาพ วิดีโอ ประชาสัมพันธ์ อบรม ประชุม และเก็บลิงก์อัลบั้มไว้ย้อนหลัง</p>
              </div>
              <div className="grid sm:grid-cols-4 gap-3">
                <div className="rounded-2xl bg-white/10 border border-white/10 px-5 py-4"><p className="text-xs text-blue-100 font-bold">กิจกรรมทั้งหมด</p><p className="text-3xl font-black">{stats.total}</p></div>
                <div className="rounded-2xl bg-white/10 border border-white/10 px-5 py-4"><p className="text-xs text-blue-100 font-bold">เสร็จแล้ว</p><p className="text-3xl font-black">{stats.completed}</p></div>
                <div className="rounded-2xl bg-white/10 border border-white/10 px-5 py-4"><p className="text-xs text-blue-100 font-bold">กำลังทำ</p><p className="text-3xl font-black">{stats.inProgress}</p></div>
                <div className="rounded-2xl bg-white/10 border border-white/10 px-5 py-4"><p className="text-xs text-blue-100 font-bold">สมาชิกมีส่วนร่วม</p><p className="text-3xl font-black">{stats.uniqueMembers}</p></div>
              </div>
            </div>
          </section>

          <section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-5">
              <div>
                <h3 className="text-xl font-black text-slate-950"><i className="ri-edit-2-fill text-blue-600 mr-2"></i>{editingId ? 'แก้ไขกิจกรรม' : 'เพิ่มกิจกรรมชมรม'}</h3>
                <p className="text-sm text-slate-500">ใช้เก็บประวัติงานชมรมพร้อมผู้เข้าร่วมและลิงก์อัลบั้ม</p>
              </div>
              <button type="button" onClick={resetForm} className="px-4 py-3 rounded-2xl bg-slate-100 text-slate-700 border border-slate-200 font-extrabold"><i className="ri-refresh-line mr-1"></i>ล้างฟอร์ม</button>
            </div>

            <div className="grid md:grid-cols-4 gap-4">
              <Input label="ชื่อกิจกรรม" value={form.title} onChange={v => updateForm('title', v)} className="md:col-span-2" placeholder="เช่น ถ่ายภาพกิจกรรมปฐมนิเทศ" />
              <Input label="วันที่" type="date" value={form.date} onChange={v => updateForm('date', v)} />
              <Select label="ปีการศึกษา" value={form.academicYear} onChange={v => { updateForm('academicYear', v); setYear(v); }} options={yearOptions.length ? yearOptions : [currentAcademicYear]} />
              <Select label="ประเภทกิจกรรม" value={form.type} onChange={v => updateForm('type', v)} options={activityTypes} />
              <Select label="สถานะ" value={form.status} onChange={v => updateForm('status', v)} options={activityStatuses} />
              <Input label="สถานที่" value={form.location} onChange={v => updateForm('location', v)} className="md:col-span-2" placeholder="เช่น Arena 1 / ห้องประชุมสุพรรณิการ์" />
              <Input label="ลิงก์อัลบั้ม / Google Photos" value={form.albumUrl} onChange={v => updateForm('albumUrl', v)} className="md:col-span-2" placeholder="วางลิงก์อัลบั้ม หรือเอกสารที่เกี่ยวข้อง" />
              <label className="block md:col-span-2"><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">ภาพปกกิจกรรม</span><input type="file" accept={SUPPORTED_IMAGE_ACCEPT} onChange={e => handleCoverUpload(e.target.files?.[0])} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900" /></label>
              <TextArea label="รายละเอียดกิจกรรม" value={form.description} onChange={v => updateForm('description', v)} className="md:col-span-2" />
              <TextArea label="หมายเหตุเจ้าหน้าที่" value={form.note} onChange={v => updateForm('note', v)} className="md:col-span-2" />
            </div>

            <div className="mt-5 rounded-[1.5rem] bg-slate-50 border border-slate-200 p-4">
              <div className="flex flex-col xl:flex-row xl:items-end gap-4">
                <div className="flex-1">
                  <label className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">สมาชิกที่เข้าร่วม</label>
                  <select value={selectedStudentToAdd} onChange={e => addParticipant(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900">
                    <option value="">เลือกนักศึกษาเพื่อเพิ่มในกิจกรรม</option>
                    {activeStudents.map(s => <option key={s.id} value={s.id}>{s.studentId || '-'} · {studentDutyName(s)} · {s.level || '-'} / {s.group || '-'}</option>)}
                  </select>
                </div>
                <div className="text-sm text-slate-500 font-bold">เลือกแล้ว {(form.participants || []).length} คน</div>
              </div>
              <div className="mt-4 grid md:grid-cols-2 xl:grid-cols-3 gap-3">
                {(form.participants || []).length ? (form.participants || []).map(id => {
                  const s = studentMap.get(id);
                  return <div key={id} className="rounded-2xl bg-white border border-slate-200 p-3"><div className="flex items-center justify-between gap-2 mb-2"><div className="font-extrabold text-slate-950 truncate"><i className="ri-user-fill text-blue-600 mr-1"></i>{s ? studentDutyName(s) : id}</div><button type="button" onClick={() => removeParticipant(id)} className="px-2 py-1 rounded-xl bg-rose-50 text-rose-700 border border-rose-100 text-xs font-bold">ลบ</button></div><select value={(form.attendance || {})[id] || 'มา'} onChange={e => setAttendance(id, e.target.value)} className="w-full px-3 py-2 rounded-xl bg-white border border-slate-200 font-bold text-slate-900"><option>มา</option><option>สาย</option><option>ขาด</option><option>ลา</option></select></div>;
                }) : <div className="text-sm text-slate-500 font-bold">ยังไม่ได้เพิ่มสมาชิกที่เข้าร่วม</div>}
              </div>
            </div>

            <div className="mt-5 flex flex-col sm:flex-row gap-3">
              <button type="button" onClick={saveActivity} disabled={saving} className="px-5 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold disabled:opacity-60"><i className="ri-save-3-fill mr-1"></i>{saving ? 'กำลังบันทึก...' : editingId ? 'อัปเดตกิจกรรม' : 'บันทึกกิจกรรม'}</button>
              <button type="button" onClick={exportActivitiesCSV} className="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold"><i className="ri-file-excel-2-fill mr-1"></i>โหลด CSV</button>
            </div>
          </section>

          <section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6">
            <div className="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-4 mb-5">
              <div>
                <h3 className="text-xl font-black text-slate-950"><i className="ri-history-fill text-blue-600 mr-2"></i>ประวัติกิจกรรม</h3>
                <p className="text-sm text-slate-500">ค้นหาและแก้ไขกิจกรรมย้อนหลังได้</p>
              </div>
              <div className="grid sm:grid-cols-[190px_minmax(260px,1fr)] gap-3 w-full xl:w-auto">
                <select value={year} onChange={e => setYear(e.target.value)} className="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900">{yearOptions.map(y => <option key={y} value={y}>ปีการศึกษา {y}</option>)}</select>
                <input value={query} onChange={e => setQuery(e.target.value)} placeholder="ค้นหาชื่อกิจกรรม ประเภท สถานที่ หรือรายชื่อสมาชิก" className="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900" />
              </div>
            </div>

            {loading ? <div className="rounded-3xl bg-slate-50 border border-slate-200 p-10 text-center font-bold text-slate-500">กำลังโหลดกิจกรรม...</div> : filteredActivities.length ? (
              <div className="grid xl:grid-cols-2 gap-4">
                {filteredActivities.map(activity => {
                  const participants = (activity.participants || []).map(id => studentMap.get(id)).filter(Boolean);
                  return (
                    <div key={activity.id} className="rounded-[1.8rem] bg-slate-50 border border-slate-200 overflow-hidden">
                      {activity.cover ? <img src={activity.cover} className="w-full h-56 object-cover" /> : <div className="h-32 bg-slate-900 text-white flex items-center justify-center text-4xl"><i className="ri-camera-lens-fill"></i></div>}
                      <div className="p-5">
                        <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3 mb-3">
                          <div className="min-w-0">

          <section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6"><div className="flex justify-between gap-3 mb-5"><div><h3 className="text-xl font-black text-slate-950"><i className="ri-gallery-fill text-blue-600 mr-2"></i>{editingId ? 'แก้ไขผลงาน' : 'เพิ่มผลงาน'}</h3><p className="text-sm text-slate-500">บันทึกผลงานพร้อมเจ้าของผลงานและลิงก์ที่เกี่ยวข้อง</p></div><button type="button" onClick={resetForm} className="px-4 py-3 rounded-2xl bg-slate-100 text-slate-700 font-bold">ล้างฟอร์ม</button></div><div className="grid md:grid-cols-4 gap-4"><Input label="ชื่อผลงาน" value={form.title} onChange={v => updateForm('title', v)} className="md:col-span-2" placeholder="เช่น ภาพถ่ายกิจกรรมปฐมนิเทศ" /><Input label="วันที่" type="date" value={form.date} onChange={v => updateForm('date', v)} /><Select label="ปีการศึกษา" value={form.academicYear} onChange={v => { updateForm('academicYear', v); setYear(v); }} options={yearOptions.length ? yearOptions : [currentAcademicYear]} /><Select label="ประเภท" value={form.type} onChange={v => updateForm('type', v)} options={workTypes} /><Select label="สถานะ" value={form.status} onChange={v => updateForm('status', v)} options={workStatuses} /><label className="block md:col-span-2"><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">เจ้าของผลงาน</span><select value={form.studentId || ''} onChange={e => updateForm('studentId', e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900"><option value="">เลือกสมาชิก</option>{activeStudents.map(s => <option key={s.id} value={s.id}>{s.studentId || '-'} · {studentDutyName(s)} · {s.level || '-'}/{s.group || '-'}</option>)}</select></label><Input label="ลิงก์ผลงาน / อัลบั้ม" value={form.url} onChange={v => updateForm('url', v)} className="md:col-span-2" placeholder="วางลิงก์ Google Photos, Drive, YouTube ฯลฯ" /><label className="block md:col-span-2"><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">ภาพปกผลงาน</span><input type="file" accept={SUPPORTED_IMAGE_ACCEPT} onChange={e => handleCoverUpload(e.target.files?.[0])} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900" /></label><TextArea label="รายละเอียดผลงาน" value={form.description} onChange={v => updateForm('description', v)} className="md:col-span-2" /><TextArea label="หมายเหตุ" value={form.note} onChange={v => updateForm('note', v)} className="md:col-span-2" /></div><div className="mt-5 flex gap-3"><button type="button" onClick={saveWork} disabled={saving} className="px-5 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold disabled:opacity-60"><i className="ri-save-3-fill mr-1"></i>{saving ? 'กำลังบันทึก...' : editingId ? 'อัปเดตผลงาน' : 'บันทึกผลงาน'}</button><button type="button" onClick={exportCSV} className="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold"><i className="ri-file-excel-2-fill mr-1"></i>โหลด CSV</button></div></section>
          <section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6"><div className="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-4 mb-5"><div><h3 className="text-xl font-black text-slate-950"><i className="ri-image-2-fill text-blue-600 mr-2"></i>รายการผลงาน</h3><p className="text-sm text-slate-500">ค้นหาและจัดการผลงานย้อนหลัง</p></div><div className="grid sm:grid-cols-[190px_minmax(260px,1fr)] gap-3 w-full xl:w-auto"><select value={year} onChange={e => setYear(e.target.value)} className="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900">{yearOptions.map(y => <option key={y} value={y}>ปีการศึกษา {y}</option>)}</select><input value={query} onChange={e => setQuery(e.target.value)} placeholder="ค้นหาผลงาน เจ้าของ ประเภท หรือสถานะ" className="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900" /></div></div>{filtered.length ? <div className="grid xl:grid-cols-3 md:grid-cols-2 gap-4">{filtered.map(w => { const s = studentMap.get(w.studentId); return <div key={w.id} className="rounded-[1.8rem] bg-slate-50 border border-slate-200 overflow-hidden"><div className="h-44 bg-slate-900 text-white flex items-center justify-center text-4xl">{w.cover ? <img src={w.cover} className="w-full h-full object-cover" /> : <i className="ri-gallery-fill"></i>}</div><div className="p-5"><div className="text-xs font-extrabold text-blue-600 uppercase tracking-wide">{w.type} • {formatThaiDate(w.date)}</div><h4 className="text-xl font-black text-slate-950 truncate">{w.title}</h4><p className="text-sm text-slate-500 mt-1"><i className="ri-user-fill mr-1"></i>{s ? studentDutyName(s) : 'ไม่ระบุเจ้าของผลงาน'}</p><p className="text-sm text-slate-600 mt-3 line-clamp-2">{w.description || 'ยังไม่มีรายละเอียด'}</p><div className="mt-4 flex flex-wrap gap-2">{w.url && <a href={w.url} target="_blank" rel="noreferrer" className="px-4 py-2 rounded-2xl bg-blue-600 text-white font-extrabold text-sm"><i className="ri-external-link-line mr-1"></i>เปิดลิงก์</a>}<button onClick={() => editWork(w)} className="px-4 py-2 rounded-2xl bg-white text-blue-700 border border-blue-100 font-extrabold text-sm">แก้ไข</button><button onClick={() => deleteWork(w)} className="px-4 py-2 rounded-2xl bg-rose-50 text-rose-700 border border-rose-100 font-extrabold text-sm">ลบ</button></div></div></div>; })}</div> : <div className="rounded-3xl bg-slate-50 border border-dashed border-slate-300 p-12 text-center"><div className="text-xl font-black text-slate-950">ยังไม่มีผลงานในปีนี้</div><p className="text-slate-500 mt-2">เริ่มจากการเพิ่มผลงานแรกด้านบนได้เลย</p></div>}</section>
        </div>
      );

    function ChangeLogsPage({ currentAcademicYear }) {
      const [logs, setLogs] = useState([]);
      const [query, setQuery] = useState('');
      const [manual, setManual] = useState('');
      useEffect(() => {
        const unsub = getChangeLogsRef().orderBy('createdAt','desc').limit(200).onSnapshot(snapshot => setLogs(snapshot.docs.map(doc => ({ id:doc.id, ...doc.data() }))), err => alert('โหลดประวัติระบบไม่สำเร็จ: ' + (err.message || err)));
        return () => unsub();
      }, []);
      const filtered = logs.filter(log => !query.trim() || [log.action, JSON.stringify(log.detail || {}), log.createdAt].join(' ').toLowerCase().includes(query.trim().toLowerCase()));
      const saveManual = async () => { if (!manual.trim()) return; await logSystemAction('บันทึกหมายเหตุระบบ', { note: manual.trim(), academicYear: currentAcademicYear }); setManual(''); };
      return <div className="space-y-5 council-audit-page"><section className="rounded-[2rem] bg-slate-950 text-white soft-shadow p-6 md:p-7"><p className="text-xs font-extrabold tracking-[0.22em] text-blue-200 uppercase mb-2">System History</p><h3 className="text-3xl md:text-4xl font-black">ประวัติระบบ</h3><p className="text-blue-100 mt-2">ใช้ย้อนดูการบันทึกสำคัญ เช่น กิจกรรม ผลงาน การลบข้อมูล และหมายเหตุจากเจ้าหน้าที่</p></section><section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6"><div className="grid md:grid-cols-[1fr_auto] gap-3"><input value={manual} onChange={e => setManual(e.target.value)} placeholder="พิมพ์หมายเหตุระบบ เช่น สำรองข้อมูลแล้ว / ตรวจรูปสมาชิกแล้ว" className="px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 font-bold text-slate-900"/><button onClick={saveManual} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-extrabold">บันทึกหมายเหตุ</button></div><input value={query} onChange={e => setQuery(e.target.value)} placeholder="ค้นหาประวัติระบบ" className="mt-4 w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 font-bold text-slate-900"/></section><section className="rounded-[2rem] bg-white border border-slate-200 soft-shadow p-5 md:p-6"><div className="space-y-3">{filtered.length ? filtered.map(log => <div key={log.id} className="rounded-2xl bg-slate-50 border border-slate-200 p-4"><div className="flex flex-col md:flex-row md:items-center md:justify-between gap-2"><div className="font-black text-slate-950"><i className="ri-history-fill text-blue-600 mr-2"></i>{log.action}</div><div className="text-xs text-slate-500 font-bold">{log.createdAt ? new Date(log.createdAt).toLocaleString('th-TH') : '-'}</div></div><pre className="mt-2 text-xs text-slate-500 whitespace-pre-wrap break-words">{JSON.stringify(log.detail || {}, null, 2)}</pre></div>) : <div className="text-center p-10 text-slate-500 font-bold">ยังไม่มีประวัติระบบ</div>}</div></section></div>;
    }

    function AnnualSummaryPage({ students, currentAcademicYear, yearsList }) {
      const [year, setYear] = useState(currentAcademicYear);
      const [activities, setActivities] = useState([]);
      const [duties, setDuties] = useState([]);
      const [works, setWorks] = useState([]);
      const [council, setCouncil] = useState(null);
      const studentMap = useMemo(() => new Map(students.map(s => [s.id, s])), [students]);
      useEffect(() => { const ua = getActivitiesRef().onSnapshot(s => setActivities(s.docs.map(d => ({id:d.id,...d.data()})))); const ud = getDutyRef().onSnapshot(s => setDuties(s.docs.map(d => ({id:d.id,...d.data()})))); const uw = getWorksRef().onSnapshot(s => setWorks(s.docs.map(d => ({id:d.id,...d.data()})))); return () => { ua(); ud(); uw(); }; }, []);
      useEffect(() => { const unsub = getCouncilRef().doc(String(year)).onSnapshot(doc => setCouncil(doc.exists ? { id:doc.id, ...doc.data() } : null)); return () => unsub(); }, [year]);
      const yearOptions = useMemo(() => [...new Set([currentAcademicYear, ...(yearsList || []), ...activities.map(a => a.academicYear), ...works.map(w => w.academicYear)].filter(Boolean))], [currentAcademicYear, yearsList, activities, works]);
      const stats = useMemo(() => {
        const st = buildStats(students, year);
        const acts = activities.filter(a => String(a.academicYear || '') === String(year));
        const dutyYear = duties.filter(d => String(d.academicYear || '') === String(year));
        const workYear = works.filter(w => String(w.academicYear || '') === String(year));
        const memberScore = {};
        acts.forEach(a => (a.participants || []).forEach(id => memberScore[id] = (memberScore[id] || 0) + 1));
        workYear.forEach(w => { if (w.studentId) memberScore[w.studentId] = (memberScore[w.studentId] || 0) + 1; });
        const topMembers = Object.entries(memberScore).sort((a,b) => b[1]-a[1]).slice(0, 8).map(([id,count]) => ({ student: studentMap.get(id), count }));
        return { st, acts, dutyYear, workYear, topMembers, councilCount: (council?.roles || []).filter(r => r.studentId).length };
      }, [students, year, activities, duties, works, council, studentMap]);
      const exportSummary = () => {

-translate-y-0.5 transition"><div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl mb-4"><i className={item.icon}></i></div><p className="font-black text-slate-950">{item.title}</p><p className="text-4xl font-black text-blue-600 mt-2">{item.value}</p><p className="text-xs text-slate-500 font-bold mt-2">กดเพื่อไปจัดการ</p></button>)}</section></div>;

    function ClubCouncilPage({ students, currentAcademicYear, yearsList }) {
      const boardRef = useRef(null);

      const [electionDate, setElectionDate] = useState(todayFileDate());
      const [note, setNote] = useState('');

      useEffect(() => {
        setLoading(true);
        const unsub = getCouncilRef().doc(String(year)).onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data() || {};
            setRoles(Array.isArray(data.roles) && data.roles.length ? data.roles : defaultCouncilRoles());
            setElectionPositions(Array.isArray(data.electionPositions) && data.electionPositions.length ? data.electionPositions : defaultElectionPositions());
            setElectionTitle(data.electionTitle || 'สภาชมรม MDEC Photo Club');
            setElectionDate(data.electionDate || todayFileDate());
            setNote(data.note || '');
          } else {
            setRoles(defaultCouncilRoles());
            setElectionPositions(defaultElectionPositions());
            setElectionTitle('สภาชมรม MDEC Photo Club');
            setElectionDate(todayFileDate());
            setNote('');

          setLoading(false);
        }, err => {
          console.error(err);
          alert('โหลดข้อมูลสภาชมรมไม่สำเร็จ');
          setLoading(false);
        });
        return () => unsub();
      }, [year]);

      const activeStudents = useMemo(() => students
        // v71.1: หน้าเลือกตั้ง/สภาเลือกสมาชิก active ได้ทุกปี รุ่นปีเข้าชมรมใช้เพื่ออ้างอิงเท่านั้น
        .filter(s => !['dismissed','graduated'].includes(s.status || 'active'))
        .sort((a,b) => String(a.level || '').localeCompare(String(b.level || ''), 'th') || String(a.group || '').localeCompare(String(b.group || ''), 'th') || String(a.fullName || '').localeCompare(String(b.fullName || ''), 'th'))
      , [students]);

      const studentMap = useMemo(() => new Map(students.map(s => [s.id, s])), [students]);
      const selectedCount = roles.filter(r => r.studentId).length;
      const currentPickerRole = roles.find(r => r.key === picker.roleKey);
      const currentPickerPosition = electionPositions.find(p => p.key === picker.positionKey);
      const pickerResults = useMemo(() => {
        const q = String(picker.query || '').trim().toLowerCase();
        if (!q) return activeStudents;
        return activeStudents.filter(s => [s.studentId, s.fullName, s.nickname, s.level, s.group, s.major, s.actualInterest].filter(Boolean).join(' ').toLowerCase().includes(q));
      }, [activeStudents, picker.query]);

      const setRoleField = (roleKey, field, value) => setRoles(prev => prev.map(role => role.key === roleKey ? { ...role, [field]: value } : role));

      };

        setElectionPositions(prev => prev.map(pos => pos.key === positionKey ? { ...pos, candidates:[...(pos.candidates || []), { key:`cand_${Date.now()}`, studentId:'', votes:0, number:(pos.candidates || []).length + 1, note:'' }] } : pos));
      };
      const removeCandidate = (positionKey, candidateKey) => {
        setElectionPositions(prev => prev.map(pos => pos.key === positionKey ? { ...pos, candidates:(pos.candidates || []).filter(c => c.key !== candidateKey) } : pos));
      };
      const setCandidateField = (positionKey, candidateKey, field, value) => {
        setElectionPositions(prev => prev.map(pos => pos.key === positionKey ? { ...pos, candidates:(pos.candidates || []).map(c => c.key === candidateKey ? { ...c, [field]: field === 'votes' || field === 'number' ? Math.max(0, Number(value) || 0) : value } : c) } : pos));
      };

      const applyElectionWinners = () => {

                </div>

number || 0} onChange={e => setCandidateField(pos.key, c.key, 'number', e.target.value)} className="candidate-number-field px-3 py-3 rounded-2xl bg-white border border-slate-200 font-black text-center" placeholder="เบอร์" /><button type="button" onClick={() => setPicker({ open:true, type:'candidate', roleKey:'', positionKey:pos.key, candidateKey:c.key, query:'' })} className="candidate-pick-btn text-left rounded-2xl bg-white border border-slate-200 px-4 py-3 hover:border-blue-400"><div className="candidate-title font-extrabold text-slate-950 truncate">{s ? studentDutyName(s) : 'เลือกผู้สมัคร'}</div><div className="candidate-subtitle text-xs text-slate-500 truncate">{s ? `${s.studentId || '-'} • ${s.level || '-'} / ${s.group || '-'}` : 'กดเพื่อค้นหานักศึกษา'}</div></button><input type="number" value={c.votes || 0} onChange={e => setCandidateField(pos.key, c.key, 'votes', e.target.value)} className="candidate-number-field px-3 py-3 rounded-2xl bg-white border border-slate-200 font-black text-center" placeholder="คะแนน" /><input value={c.note || ''} onChange={e => setCandidateField(pos.key, c.key, 'note', e.target.value)} className="candidate-text-field px-3 py-3 rounded-2xl bg-white border border-slate-200 font-bold" placeholder="หมายเหตุ" /><div className={`candidate-rank-badge px-3 py-2 rounded-xl text-center font-extrabold ${isWinner ? 'is-winner bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>{rank ? `อันดับ ${rank}` : 'ยังไม่จัดอันดับ'}</div><button type="button" onClick={() => removeCandidate(pos.key, c.key)} className="candidate-remove-btn px-3 py-3 rounded-2xl bg-rose-50 text-rose-700 border border-rose-100 font-extrabold" title="ลบผู้สมัคร"><i className="ri-delete-bin-fill"></i></button></div></div>; })}{!(pos.candidates || []).length && <div className="rounded-2xl border border-dashed border-slate-300 bg-slate-50 p-8 text-center text-slate-500 font-bold">ยังไม่มีผู้สมัครในตำแหน่งนี้</div>}</div></div></div>;
              })}

          {picker.open && (
            <div className="fixed inset-0 z-[90] bg-slate-950/70 backdrop-blur-sm p-4 flex items-center justify-center">

                <div className="p-5 border-b border-slate-200 flex items-start justify-between gap-4"><div><h3 className="text-2xl font-black text-slate-950"><i className="ri-user-search-fill text-blue-600 mr-2"></i>เลือกนักศึกษา</h3><p className="text-slate-500 text-sm">{picker.type === 'candidate' ? `ผู้สมัคร: ${currentPickerPosition?.title || '-'}` : `ตำแหน่ง: ${currentPickerRole?.title || '-'}`}</p></div><button onClick={() => setPicker({ open:false, type:'role', roleKey:'', positionKey:'', candidateKey:'', query:'' })} className="px-4 py-2 rounded-2xl bg-slate-100 text-slate-700 font-bold">ปิด</button></div>
                <div className="p-5 bg-slate-50 border-b border-slate-200"><input autoFocus value={picker.query} onChange={e => setPicker(prev => ({ ...prev, query:e.target.value }))} placeholder="ค้นหาจากชื่อเล่น ชื่อจริง รหัส ระดับ กลุ่ม หรือสาขา" className="w-full px-5 py-4 rounded-2xl bg-white border-2 border-slate-200 focus:border-blue-500 outline-none font-bold text-slate-900" /><p className="text-xs text-slate-500 font-bold mt-2">พบ {pickerResults.length} คน จากสมาชิกที่ยังใช้งานอยู่ทุกปี • แสดงชื่อเล่นเด่นขึ้น และปี {year} ใช้เป็นปีของเอกสาร/กิจกรรม</p></div>

          )}

      );

    function safeStudentInitial(s) {
      return String((s?.nickname || s?.fullName || '?')).trim().charAt(0) || '?';
    }

    function copyTextToClipboard(text, successMessage='คัดลอกข้อความแล้ว') {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); alert(successMessage); }
        catch (err) { alert('คัดลอกไม่สำเร็จ กรุณาคัดลอกเอง'); }
        ta.remove();
      };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => alert(successMessage)).catch(fallback);
      else fallback();
    }

    function dutyStatusLabel(key) {
      const option = dutyAttendanceOptions.find(o => o.key === key);
      if (!key || key === 'present') return 'ปกติ';
      return option?.label || key;
    }

    function getTodayDutyKey() {
      const d = new Date();
      const day = d.getDay();
      if (day === 1) return 'mon';
      if (day === 2) return 'tue';
      if (day === 3) return 'wed';
      if (day === 4) return 'thu';
      if (day === 5) return 'fri';
      if (day === 6) return 'sat';
      return 'mon';
    }

    function dutyEntriesForDay(duty, dayKey) {
      const roles = getDutyRoles(duty || {});
      const weekly = getDutyWeeklyAssignments(duty || {});
      const items = [];
      roles.forEach(role => {
        const people = (weekly?.[dayKey]?.[role.key] || []).filter(Boolean);
        people.forEach((person, index) => items.push({ role, person, index, dayKey }));
      });
      return items;
    }

    function allDutyEntries(duty) {
      const items = [];
      dutyDays.forEach(day => dutyEntriesForDay(duty, day.key).forEach(item => items.push({ ...item, day })));
      return items;
    }

    function buildDutyResponsibilityStats(students, duties = [], activities = [], works = [], targetYear) {
      const map = new Map((students || []).map(s => [s.id, {
        student: s, assigned:0, present:0, late:0, absent:0, leave:0, not_found:0, substitute:0,
        activities:0, works:0, score:0, timeline:[]
      }]));
      const addTimeline = (id, item) => {
        if (!map.has(id)) return;
        const row = map.get(id);
        row.timeline.push(item);
      };
      (duties || []).filter(d => !targetYear || String(d.academicYear || '') === String(targetYear)).forEach(duty => {
        const roles = getDutyRoles(duty);
        const weekly = getDutyWeeklyAssignments(duty);
        dutyDays.forEach(day => {
          roles.forEach(role => {
            const people = (weekly?.[day.key]?.[role.key] || []).filter(Boolean);
            people.forEach((person, index) => {
              const id = person.id;
              if (!map.has(id)) return;
              const row = map.get(id);
              row.assigned += 1;
              const status = (((duty?.dutyAttendance || {})[day.key] || {})[role.key] || [])[index] || 'present';
              if (status === 'late') { row.late += 1; row.score -= 1; }
              else if (status === 'absent') { row.absent += 1; row.score -= 3; }
              else if (status === 'leave') { row.leave += 1; }
              else if (status === 'not_found') { row.not_found += 1; row.score -= 2; }
              else if (status === 'substitute') { row.substitute += 1; row.score += 2; }
              else { row.present += 1; row.score += 1; }
              addTimeline(id, { date: getDutyDayDate(duty.date, day.key), type:'เวรเช้า', title:`${day.label} • ${role.shortTitle || role.title}`, status: dutyStatusLabel(status) });
            });
          });
        });
      });

          const row = map.get(id);
          row.activities += 1;
          const status = (activity.attendance || {})[id] || 'present';
          if (status === 'present' || status === 'มา') row.score += 1;
          else if (status === 'late' || status === 'สาย') row.score -= 1;
          else if (status === 'absent' || status === 'ขาด') row.score -= 2;
          addTimeline(id, { date: activity.date, type:'กิจกรรม', title: activity.title || 'กิจกรรมชมรม', status: status });
        });
      });
      (works || []).filter(w => !targetYear || String(w.academicYear || '') === String(targetYear)).forEach(work => {

          if (!map.has(id)) return;

        });
      });
      return [...map.values()].sort((a,b) => b.score - a.score || b.present - a.present || String(a.student.fullName || '').localeCompare(String(b.student.fullName || ''), 'th'));

        ].join('\n');

      const generateSmartDuty = () => {
        if (!activeStudents.length) return alert('ยังไม่มีสมาชิกที่พร้อมใช้งาน กรุณาตรวจสอบสถานะสมาชิกว่าไม่ได้พ้นสภาพหรือจบการศึกษาแล้ว');
        const roles = defaultDutyRoles();
        const roleSlots = defaultDutyRoleSlots(roles);
        const weeklyAssignments = {};
        const usedThisWeek = new Set();
        const countByStudent = new Map();
        duties.forEach(duty => allDutyEntries(duty).forEach(item => countByStudent.set(item.person.id, (countByStudent.get(item.person.id) || 0) + 1)));
        const scoreOf = (student) => {
          const resp = responsibilityMap.get(student.id);
          const assignedPenalty = countByStudent.get(student.id) || 0;
          const bad = (resp?.late || 0) + (resp?.absent || 0) * 3 + (resp?.not_found || 0) * 2;
          const good = (resp?.substitute || 0) + (resp?.present || 0) * .2;
          return assignedPenalty * 4 + bad * 2 - good;
        };
        dutyDays.forEach(day => {
          weeklyAssignments[day.key] = {};
          const usedToday = new Set();
          roles.forEach(role => {
            const slots = Number(roleSlots[role.key] || 1);
            weeklyAssignments[day.key][role.key] = [];
            for (let i=0; i<slots; i++) {
              const pool = [...activeStudents].sort((a,b) => {
                const aUsedWeek = usedThisWeek.has(a.id) ? 8 : 0;
                const bUsedWeek = usedThisWeek.has(b.id) ? 8 : 0;
                const aUsedDay = usedToday.has(a.id) ? 999 : 0;
                const bUsedDay = usedToday.has(b.id) ? 999 : 0;
                return (scoreOf(a)+aUsedWeek+aUsedDay+Math.random()) - (scoreOf(b)+bUsedWeek+bUsedDay+Math.random());
              });
              const selected = pool[0];
              if (!selected) continue;
              usedToday.add(selected.id);
              usedThisWeek.add(selected.id);
              weeklyAssignments[day.key][role.key].push({
                id:selected.id, studentId:selected.studentId || '', fullName:selected.fullName || '', nickname:selected.nickname || '',

            }

              <div><div className="line-preview">{makeLineText(latestDuty, getTodayDutyKey())}</div><button onClick={() => copyTextToClipboard(makeLineText(latestDuty, getTodayDutyKey()), 'คัดลอกข้อความวันนี้แล้ว')} className="mt-3 w-full py-3 rounded-2xl bg-emerald-600 text-white font-extrabold">คัดลอกข้อความวันนี้</button></div>

              <div className="space-y-3">{topResponsibility.map((row, idx) => <div key={row.student.id} className="student-rank-card p-4 flex flex-col md:flex-row md:items-center gap-3 md:justify-between"><div className="flex items-center gap-3">{row.student.photo ? <img src={row.student.photo} className="w-14 h-14 rounded-2xl object-cover" /> : <div className="w-14 h-14 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl font-black">{safeStudentInitial(row.student)}</div>}<div><div className="font-black text-slate-950">{idx+1}. {studentDutyName(row.student)}</div><div className="text-sm text-slate-500">เวร {row.assigned} • ปกติ {row.present} • สาย {row.late} • ขาด {row.absent} • ไม่พบตัว {row.not_found} • กิจกรรม {row.activities} • ผลงาน {row.works}</div></div></div><div className="text-3xl font-black text-blue-600">{row.score}</div></div>)}</div>
            </section>
          )}

          {tab === 'standby' && (
            <section className="smart-panel p-5 md:p-6">
              <h3 className="text-2xl font-black text-slate-950 mb-4"><i className="ri-team-fill text-blue-600 mr-2"></i>ทีมสำรอง / ทีมสำรองพร้อมช่วยงานด่วน</h3>
              <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-3">{standby.map(row => <div key={row.student.id} className="student-rank-card p-4 flex items-center gap-3">{row.student.photo ? <img src={row.student.photo} className="w-16 h-16 rounded-2xl object-cover" /> : <div className="w-16 h-16 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl font-black">{safeStudentInitial(row.student)}</div>}<div className="min-w-0"><div className="font-black text-slate-950 truncate">{studentDutyName(row.student)}</div><div className="text-sm text-slate-500 truncate">{row.student.level || '-'} / {row.student.group || '-'} • {row.student.actualInterest || row.student.interest || '-'}</div><div className="text-xs text-blue-600 font-bold">คะแนน {row.score} • ทำแทน {row.substitute}</div></div></div>)}</div>
            </section>
          )}

          {tab === 'timeline' && (
            <section className="smart-panel p-5 md:p-6 grid xl:grid-cols-[320px_1fr] gap-5">
              <div><h3 className="text-2xl font-black text-slate-950 mb-3"><i className="ri-route-fill text-blue-600 mr-2"></i>Timeline รายคน</h3><select value={timelineStudentId || selectedTimeline?.student?.id || ''} onChange={e => setTimelineStudentId(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-white border border-slate-200 font-bold">{topResponsibility.map(r => <option key={r.student.id} value={r.student.id}>{studentDutyName(r.student)}</option>)}</select></div>
              <div className="space-y-3">{(selectedTimeline?.timeline || []).sort((a,b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0,30).map((item,idx) => <div key={idx} className="student-rank-card p-4"><div className="text-xs text-slate-500 font-bold">{formatThaiDate(item.date)} • {item.type}</div><div className="font-black text-slate-950">{item.title}</div><div className="text-sm text-blue-600 font-bold">{item.status}</div></div>)}{!(selectedTimeline?.timeline || []).length && <div className="student-rank-card p-8 text-center text-slate-500 font-bold">ยังไม่มี Timeline</div>}</div>
