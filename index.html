<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDEC Photo Club - Command Center</title>

    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Kanit', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; margin: 0; padding: 0; }
            @page { size: A4 landscape; margin: 0; }
        }
        .print-only { display: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        // ----------------------------------------------------------------------
        // Firebase Configuration (คงเดิมจากที่อาจารย์ให้มา)
        // ----------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyAoPSXB4qF2onYLtzhMR6U01JGko64C4lA",
            authDomain: "mdec-photoclub.firebaseapp.com",
            projectId: "mdec-photoclub",
            storageBucket: "mdec-photoclub.firebasestorage.app",
            messagingSenderId: "139085705657",
            appId: "1:139085705657:web:6ed339084a584a5f780668",
            measurementId: "G-DZGPXDE17D"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const appId = 'mdec-photo-club-v3'; // อัปเกรดเวอร์ชันโครงสร้างข้อมูล
        const COLLECTION_NAME = 'students_registry';
        const SETTINGS_DOC = 'club_settings';
        
        const { useState, useEffect, useRef, useMemo } = React;
        const getStudentsRef = () => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(COLLECTION_NAME);
        const getSettingsRef = () => db.collection('artifacts').doc(appId).collection('public').doc('settings');

        // =======================================================
        // Main App
        // =======================================================
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home');
            const [loading, setLoading] = useState(true);
            const [majors, setMajors] = useState(["คอมพิวเตอร์ธุรกิจ", "เทคโนโลยีสารสนเทศ", "ไฟฟ้ากำลัง", "ช่างยนต์", "บัญชี", "การตลาด"]);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (error) { alert("เชื่อมต่อฐานข้อมูลไม่สำเร็จ"); }
                };
                initAuth();
                
                // โหลดการตั้งค่าสาขาจากฐานข้อมูล
                const unsubSettings = getSettingsRef().onSnapshot(doc => {
                    if (doc.exists && doc.data().majors) {
                        setMajors(doc.data().majors);
                    }
                });

                const unsubscribeAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => { unsubscribeAuth(); unsubSettings(); };
            }, []);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 text-white font-sans">
                    <div className="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-blue-400 font-bold tracking-widest">MDEC COMMAND CENTER LOADING...</p>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <header className="bg-slate-900 text-white shadow-xl no-print sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setView('home')}>
                                <div className="bg-yellow-500 p-2 rounded-xl group-hover:rotate-12 transition-transform">
                                    <i className="ri-camera-lens-fill text-slate-900 text-2xl"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-black tracking-tighter leading-none">MDEC PHOTOCLUB</h1>
                                    <p className="text-[10px] text-yellow-500 font-bold tracking-widest uppercase">Official Management System</p>
                                </div>
                            </div>
                            {view !== 'home' && (
                                <button onClick={() => setView('home')} className="flex items-center space-x-2 text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition-all border border-slate-700">
                                    <i className="ri-home-4-line"></i>
                                    <span className="hidden md:inline">กลับหน้าหลัก</span>
                                </button>
                            )}
                        </div>
                    </header>
                    <main className="max-w-7xl mx-auto px-4 py-6 no-print">
                        {view === 'home' && <HomeView setView={setView} />}
                        {view === 'register' && <RegisterView setView={setView} user={user} majors={majors} />}
                        {view === 'adminLogin' && <AdminLoginView setView={setView} />}
                        {view === 'admin' && <AdminDashboard user={user} setView={setView} majors={majors} setMajors={setMajors} />}
                    </main>
                </div>
            );
        }

        // =======================================================
        // หน้าแรก (Fix Logo)
        // =======================================================
        function HomeView({ setView }) {
            return (
                <div className="flex flex-col items-center justify-center py-10 animate-fade-in">
                    <div className="bg-white p-10 md:p-16 rounded-[2.5rem] shadow-2xl w-full max-w-4xl text-center border border-slate-100 relative overflow-hidden">
                        {/* เอฟเฟกต์ตกแต่ง */}
                        <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full -mr-16 -mt-16"></div>
                        <div className="absolute bottom-0 left-0 w-40 h-40 bg-yellow-500/5 rounded-full -ml-20 -mb-20"></div>

                        <div className="flex justify-center mb-10">
                            <div className="relative">
                                <div className="w-32 h-32 bg-slate-900 rounded-[2rem] flex items-center justify-center shadow-2xl rotate-3">
                                    <i className="ri-camera-3-fill text-yellow-500 text-6xl"></i>
                                </div>
                                <div className="absolute -bottom-2 -right-2 w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg -rotate-12 border-4 border-white text-white">
                                    <i className="ri-mic-2-fill text-xl"></i>
                                </div>
                            </div>
                        </div>
                        
                        <h2 className="text-4xl md:text-5xl font-black text-slate-900 mb-4 tracking-tighter">
                            MDEC <span className="text-blue-600">PHOTOCLUB</span>
                        </h2>
                        <p className="text-xl text-slate-500 font-medium mb-12">ชมรมถ่ายภาพ วิดีโอ ตัดต่อ และโสตทัศนูปกรณ์ (อี.เทค)</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <button onClick={() => setView('register')} className="group flex flex-col items-center justify-center p-10 bg-blue-600 hover:bg-blue-700 text-white rounded-[2rem] shadow-xl hover:shadow-blue-200 transition-all transform hover:-translate-y-2">
                                <div className="bg-white/20 p-5 rounded-2xl mb-6 group-hover:scale-110 transition">
                                    <i className="ri-user-add-fill text-5xl"></i>
                                </div>
                                <span className="text-2xl font-bold">สมัครเข้าชมรม</span>
                                <p className="text-blue-100 text-sm mt-2 opacity-80">สำหรับนักศึกษาใหม่และรุ่นพี่</p>
                            </button>

                            <button onClick={() => setView('adminLogin')} className="group flex flex-col items-center justify-center p-10 bg-slate-800 hover:bg-slate-900 text-white rounded-[2rem] shadow-xl hover:shadow-slate-200 transition-all transform hover:-translate-y-2">
                                <div className="bg-white/10 p-5 rounded-2xl mb-6 group-hover:scale-110 transition">
                                    <i className="ri-shield-flash-fill text-5xl text-yellow-500"></i>
                                </div>
                                <span className="text-2xl font-bold">Command Center</span>
                                <p className="text-slate-400 text-sm mt-2 opacity-80">เฉพาะแอดมินและอาจารย์</p>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // =======================================================
        // ล็อกอิน
        // =======================================================
        function AdminLoginView({ setView }) {
            const [pin, setPin] = useState('');
            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === '8203') setView('admin');
                else { alert('รหัสผ่านไม่ถูกต้อง'); setPin(''); }
            };
            return (
                <div className="flex justify-center items-center py-20 animate-fade-in">
                    <div className="bg-white p-10 rounded-[2rem] shadow-2xl max-w-md w-full border text-center">
                        <div className="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-inner">
                            <i className="ri-fingerprint-fill text-4xl"></i>
                        </div>
                        <h2 className="text-3xl font-black mb-2 text-slate-900 tracking-tight">Security Access</h2>
                        <p className="text-slate-500 mb-8 font-medium">กรุณาระบุรหัสผ่านประจำศูนย์ควบคุม</p>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <input 
                                type="password" 
                                placeholder="••••" 
                                value={pin} 
                                onChange={(e) => setPin(e.target.value)} 
                                className="w-full text-center text-5xl tracking-[0.5em] p-5 border-2 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition font-black bg-slate-50" 
                                autoFocus 
                                maxLength={4} 
                            />
                            <button type="submit" className="w-full py-4 bg-slate-900 hover:bg-black text-white rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95">เข้าสู่ระบบจัดการ</button>
                        </form>
                    </div>
                </div>
            );
        }

        // =======================================================
        // สมัครสมาชิก (เพิ่มช่องข้อมูล เพศ, ไลน์ไอดี)
        // =======================================================
        function RegisterView({ setView, user, majors }) {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const [step, setStep] = useState(1);
            const [photoData, setPhotoData] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [success, setSuccess] = useState(false);
            const currentYear = new Date().getFullYear() + 543;

            const [formData, setFormData] = useState({
                studentId: '', fullName: '', nickname: '', dob: '', phone: '', lineId: '', socialMedia: '',
                gender: 'ชาย', major: majors[0] || 'ไม่ระบุ', level: 'ปวช.1', group: '', medicalCondition: '-', emergencyPhone: '',
                academicYear: currentYear.toString(), status: 'active', statusReason: '',
                interest: 'ถ่ายภาพนิ่ง', equipment: 'ใช้มือถือเป็นหลัก', experience: 'ระดับเริ่มต้น', reason: ''
            });

            useEffect(() => {
                let stream;
                if (step === 2 && !success && !photoData) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                        .then(s => { stream = s; if (videoRef.current) videoRef.current.srcObject = s; })
                        .catch(err => alert("ไม่สามารถเปิดกล้องได้ โปรดอนุญาตสิทธิ์การเข้าถึง"));
                }
                return () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
            }, [step, success, photoData]);

            const handleCapture = (e) => {
                e.preventDefault();
                if (videoRef.current && canvasRef.current) {
                    const canvas = canvasRef.current;
                    const size = 600;
                    canvas.width = size; canvas.height = size; 
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(videoRef.current, (videoRef.current.videoWidth - videoRef.current.videoHeight)/2, 0, videoRef.current.videoHeight, videoRef.current.videoHeight, 0, 0, size, size);
                    setPhotoData(canvas.toDataURL('image/jpeg', 0.7));
                }
            };

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

            const handleSubmit = async () => {
                if (!photoData || !user) return alert("โปรดถ่ายรูปภาพก่อนส่งใบสมัคร");
                setIsSubmitting(true);
                try {
                    await getStudentsRef().add({ ...formData, photo: photoData, createdAt: new Date().toISOString() });
                    setSuccess(true);
                } catch (error) { alert("ล้มเหลว: " + error.message); } 
                finally { setIsSubmitting(false); }
            };

            if (success) return (
                <div className="text-center bg-white p-16 rounded-[3rem] shadow-2xl max-w-xl mx-auto animate-fade-in border border-green-100">
                    <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-8">
                        <i className="ri-check-double-line text-6xl"></i>
                    </div>
                    <h2 className="text-4xl font-black mb-4 text-slate-900">สมัครสำเร็จแล้ว!</h2>
                    <p className="text-slate-500 text-lg mb-10">เราได้รับข้อมูลของคุณเข้าสู่ระบบชมรม MDEC แล้ว</p>
                    <button onClick={() => setView('home')} className="px-10 py-4 bg-slate-900 text-white rounded-2xl font-bold shadow-lg hover:bg-black transition">กลับสู่หน้าหลัก</button>
                </div>
            );

            return (
                <div className="bg-white rounded-[2.5rem] shadow-2xl overflow-hidden max-w-4xl mx-auto animate-fade-in border border-slate-100 mb-20">
                    <div className="bg-gradient-to-r from-blue-700 to-blue-900 p-8 text-white flex justify-between items-center">
                        <div><h2 className="text-3xl font-black tracking-tight">ใบสมัครทีมโสตฯ (MDEC)</h2><p className="text-blue-300 font-medium">ปีการศึกษา {formData.academicYear}</p></div>
                        <div className="bg-white/10 px-5 py-2 rounded-2xl font-bold text-sm backdrop-blur-md border border-white/20">Step {step} of 2</div>
                    </div>
                    <div className="p-8 md:p-12">
                        {step === 1 ? (
                            <form onSubmit={(e) => { e.preventDefault(); setStep(2); }} className="space-y-10">
                                <div>
                                    <h3 className="text-xl font-bold text-blue-800 mb-6 flex items-center"><i className="ri-bank-card-fill mr-2"></i> ข้อมูลการศึกษา</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">รหัสนักศึกษา *</label><input required name="studentId" value={formData.studentId} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50 focus:border-blue-500 outline-none transition" placeholder="ระบุรหัส 7 หลัก" /></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">ระดับชั้น *</label><select name="level" value={formData.level} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50"><option value="ปวช.1">ปวช. 1</option><option value="ปวช.2">ปวช. 2</option><option value="ปวช.3">ปวช. 3</option><option value="ปวส.1">ปวส. 1</option><option value="ปวส.2">ปวส. 2</option></select></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">สาขาวิชา *</label>
                                            <select name="major" value={formData.major} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50 focus:border-blue-500 outline-none">
                                                {majors.map(m => <option key={m} value={m}>{m}</option>)}
                                            </select>
                                        </div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">กลุ่มเรียน/ห้อง *</label><input required name="group" value={formData.group} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50 focus:border-blue-500 outline-none" placeholder="เช่น 1/1" /></div>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-xl font-bold text-blue-800 mb-6 flex items-center"><i className="ri-user-heart-fill mr-2"></i> ข้อมูลส่วนตัว</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="md:col-span-2"><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">ชื่อ - นามสกุล *</label><input required name="fullName" value={formData.fullName} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50 focus:border-blue-500 outline-none" placeholder="ไม่ต้องใส่คำนำหน้า" /></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">ชื่อเล่น *</label><input required name="nickname" value={formData.nickname} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50" /></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">เพศ *</label><select name="gender" value={formData.gender} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option><option value="อื่นๆ">LGBTQ+</option></select></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">วันเกิด *</label><input type="date" required name="dob" value={formData.dob} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50" /></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2 text-blue-600">Line ID *</label><input required name="lineId" value={formData.lineId} onChange={handleChange} className="w-full p-4 border-2 border-blue-100 rounded-2xl bg-blue-50 focus:border-blue-500 outline-none" placeholder="ไอดีไลน์สำหรับดึงเข้ากลุ่ม" /></div>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-xl font-bold text-blue-800 mb-6 flex items-center"><i className="ri-phone-fill mr-2"></i> การติดต่อและสุขภาพ</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2">เบอร์โทรศัพท์ *</label><input required name="phone" value={formData.phone} onChange={handleChange} className="w-full p-4 border-2 rounded-2xl bg-slate-50" /></div>
                                        <div><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2 text-orange-600 font-bold">เบอร์โทรฉุกเฉิน *</label><input required name="emergencyPhone" value={formData.emergencyPhone} onChange={handleChange} className="w-full p-4 border-2 border-orange-100 rounded-2xl bg-orange-50 focus:border-orange-500 outline-none" /></div>
                                        <div className="md:col-span-2"><label className="text-xs font-black text-slate-400 uppercase tracking-widest block mb-2 text-red-600 font-bold">โรคประจำตัว/แพ้อาหาร *</label><input required name="medicalCondition" value={formData.medicalCondition} onChange={handleChange} className="w-full p-4 border-2 border-red-100 rounded-2xl bg-red-50 focus:border-red-500 outline-none" placeholder="ไม่มีระบุ -" /></div>
                                    </div>
                                </div>
                                <button type="submit" className="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black text-xl shadow-xl transition-all active:scale-95">ถัดไป: ถ่ายรูปโปรไฟล์</button>
                            </form>
                        ) : (
                            <div className="text-center animate-fade-in">
                                <h3 className="text-2xl font-black text-slate-900 mb-8">ถ่ายภาพใบหน้าเพื่อใช้ทำประวัติ</h3>
                                <div className="relative w-full max-w-sm mx-auto aspect-square bg-slate-900 rounded-[3rem] overflow-hidden mb-8 border-8 border-white shadow-2xl">
                                    {photoData ? <img src={photoData} className="w-full h-full object-cover" /> : <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover transform scale-x-[-1]" />}
                                    <canvas ref={canvasRef} className="hidden" />
                                </div>
                                <div className="flex flex-col md:flex-row justify-center gap-4">
                                    <button onClick={() => setStep(1)} className="px-10 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold"><i className="ri-arrow-left-line"></i> แก้ข้อมูล</button>
                                    {!photoData ? <button onClick={handleCapture} className="px-12 py-4 bg-blue-600 text-white rounded-2xl font-black text-lg shadow-xl"><i className="ri-camera-lens-fill mr-2"></i> กดถ่ายภาพ</button> : 
                                    <><button onClick={() => setPhotoData(null)} className="px-10 py-4 bg-yellow-500 text-white rounded-2xl font-bold">ถ่ายใหม่</button><button onClick={handleSubmit} disabled={isSubmitting} className="px-12 py-4 bg-green-600 text-white rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95">{isSubmitting ? 'กำลังส่ง...' : 'ยืนยันการสมัคร'}</button></>}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // =======================================================
        // Command Center (สถิติ + จัดการสาขา + สถิติเพศ/ชั้น)
        // =======================================================
        function AdminDashboard({ user, setView, majors, setMajors }) {
            const [students, setStudents] = useState([]);
            const [loadingData, setLoadingData] = useState(true);
            const [activeTab, setActiveTab] = useState('command');
            const [search, setSearch] = useState('');
            const [filterYear, setFilterYear] = useState('all');
            const [displayMode, setDisplayMode] = useState('gallery');
            const [editingStudent, setEditingStudent] = useState(null);
            const [studentToDelete, setStudentToDelete] = useState(null);
            const [newMajor, setNewMajor] = useState('');

            useEffect(() => {
                if (!user) return;
                const unsubscribe = getStudentsRef().onSnapshot(s => {
                    setStudents(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));
                    setLoadingData(false);
                });
                return () => unsubscribe();
            }, [user]);

            const deleteStudent = async () => {
                await getStudentsRef().doc(studentToDelete.id).delete();
                setStudentToDelete(null);
            };

            const updateMajors = async (newList) => {
                await getSettingsRef().set({ majors: newList }, { merge: true });
                setMajors(newList);
            };

            const yearsList = useMemo(() => [...new Set(students.map(s => s.academicYear))].sort().reverse(), [students]);
            const [statsYear, setStatsYear] = useState('all');

            const filtered = students.filter(s => (filterYear === 'all' || s.academicYear === filterYear) && ((s.fullName||'').includes(search) || (s.studentId||'').includes(search) || (s.nickname||'').includes(search)));

            const stats = useMemo(() => {
                const target = statsYear === 'all' ? students : students.filter(s => s.academicYear === statsYear);
                const res = { total: target.length, active: 0, graduated: 0, male: 0, female: 0, lgbt: 0, levels: {}, majors: {} };
                target.forEach(s => {
                    if(s.status === 'active') res.active++;
                    if(s.status === 'graduated') res.graduated++;
                    if(s.gender === 'ชาย') res.male++;
                    else if(s.gender === 'หญิง') res.female++;
                    else res.lgbt++;
                    res.levels[s.level] = (res.levels[s.level] || 0) + 1;
                    res.majors[s.major] = (res.majors[s.major] || 0) + 1;
                });
                return res;
            }, [students, statsYear]);

            return (
                <div className="bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden animate-fade-in mb-20">
                    <div className="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="bg-blue-600 p-2 rounded-xl shadow-lg shadow-blue-500/20"><i className="ri-dashboard-3-fill text-2xl"></i></div>
                            <h2 className="font-black text-2xl tracking-tighter uppercase">Command Center</h2>
                        </div>
                        <div className="flex bg-slate-800 p-1 rounded-2xl border border-slate-700">
                            <button onClick={()=>setActiveTab('command')} className={`px-5 py-2 rounded-xl text-sm font-bold transition ${activeTab==='command'?'bg-blue-600 text-white shadow-lg':'text-slate-400'}`}>Summary</button>
                            <button onClick={()=>setActiveTab('list')} className={`px-5 py-2 rounded-xl text-sm font-bold transition ${activeTab==='list'?'bg-blue-600 text-white shadow-lg':'text-slate-400'}`}>Database</button>
                            <button onClick={()=>setActiveTab('settings')} className={`px-5 py-2 rounded-xl text-sm font-bold transition ${activeTab==='settings'?'bg-blue-600 text-white shadow-lg':'text-slate-400'}`}>Setup</button>
                        </div>
                    </div>

                    <div className="p-6 md:p-10">
                        {activeTab === 'command' && (
                            <div className="space-y-10 animate-fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                                    <div><h3 className="text-2xl font-black text-slate-800">สรุปข้อมูลประจำศูนย์ควบคุม</h3><p className="text-slate-500">เลือกปีการศึกษาเพื่อวิเคราะห์ข้อมูลเชิงสถิติ</p></div>
                                    <select value={statsYear} onChange={e=>setStatsYear(e.target.value)} className="w-full md:w-64 p-4 border-2 border-slate-200 rounded-2xl font-bold bg-white outline-none focus:border-blue-500">
                                        <option value="all">ดูทุกปีรวมกัน</option>
                                        {yearsList.map(y => <option key={y} value={y}>ปีการศึกษา {y}</option>)}
                                    </select>
                                </div>

                                {/* Stats Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div className="bg-blue-50 p-8 rounded-[2rem] border border-blue-100"><p className="text-blue-600 font-black text-xs uppercase tracking-widest mb-1">TOTAL MEMBERS</p><h4 className="text-4xl font-black text-blue-900">{stats.total} <small className="text-sm">คน</small></h4></div>
                                    <div className="bg-green-50 p-8 rounded-[2rem] border border-green-100"><p className="text-green-600 font-black text-xs uppercase tracking-widest mb-1">ACTIVE</p><h4 className="text-4xl font-black text-green-900">{stats.active} <small className="text-sm">คน</small></h4></div>
                                    <div className="bg-slate-900 p-8 rounded-[2rem] text-white"><p className="text-slate-400 font-black text-xs uppercase tracking-widest mb-1">GRADUATED</p><h4 className="text-4xl font-black text-yellow-500">{stats.graduated} <small className="text-sm">คน</small></h4></div>
                                    <div className="bg-purple-50 p-8 rounded-[2rem] border border-purple-100"><p className="text-purple-600 font-black text-xs uppercase tracking-widest mb-1">MAJORS</p><h4 className="text-4xl font-black text-purple-900">{Object.keys(stats.majors).length} <small className="text-sm">สาขา</small></h4></div>
                                </div>

                                {/* Gender & Level Charts */}
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-[2rem] border shadow-sm">
                                        <h3 className="font-black text-lg mb-6 flex items-center"><i className="ri-user-voice-fill mr-2 text-blue-600 text-xl"></i> สัดส่วนเพศ (Gender Distribution)</h3>
                                        <div className="space-y-5">
                                            {[["ชาย", stats.male, "bg-blue-500"], ["หญิง", stats.female, "bg-pink-500"], ["LGBTQ+", stats.lgbt, "bg-purple-500"]].map(([name, count, color]) => (
                                                <div key={name}>
                                                    <div className="flex justify-between mb-2 text-sm font-bold"><span>{name}</span><span>{count} คน</span></div>
                                                    <div className="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div className={`${color} h-full transition-all duration-1000`} style={{width:`${stats.total ? (count/stats.total)*100 : 0}%`}}></div></div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2rem] border shadow-sm">
                                        <h3 className="font-black text-lg mb-6 flex items-center"><i className="ri-stairs-fill mr-2 text-blue-600 text-xl"></i> ระดับชั้น (Levels)</h3>
                                        <div className="grid grid-cols-2 gap-4">
                                            {Object.entries(stats.levels).sort().map(([level, count]) => (
                                                <div key={level} className="p-4 bg-slate-50 rounded-2xl flex justify-between items-center border border-slate-100">
                                                    <span className="font-bold text-slate-600">{level}</span>
                                                    <span className="bg-white px-3 py-1 rounded-xl text-blue-600 font-black text-sm shadow-sm">{count}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'list' && (
                            <div className="animate-fade-in space-y-6">
                                <div className="flex flex-col md:flex-row gap-4 justify-between">
                                    <div className="relative flex-1">
                                        <i className="ri-search-2-line absolute left-4 top-4 text-slate-400"></i>
                                        <input type="text" placeholder="ค้นหาชื่อ, รหัส, ชื่อเล่น..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-12 pr-4 py-4 border-2 rounded-2xl focus:border-blue-500 outline-none transition bg-slate-50 font-bold" />
                                    </div>
                                    <div className="flex gap-2 bg-slate-100 p-1 rounded-2xl border">
                                        <button onClick={()=>setDisplayMode('gallery')} className={`px-6 py-2 rounded-xl text-sm font-bold transition ${displayMode==='gallery'?'bg-white text-blue-600 shadow-sm':'text-slate-500'}`}>ดูรูป</button>
                                        <button onClick={()=>setDisplayMode('table')} className={`px-6 py-2 rounded-xl text-sm font-bold transition ${displayMode==='table'?'bg-white text-blue-600 shadow-sm':'text-slate-500'}`}>ตาราง</button>
                                    </div>
                                </div>

                                {displayMode === 'gallery' ? (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                                        {filtered.map(s => (
                                            <div key={s.id} className="group bg-white border border-slate-100 rounded-[2rem] overflow-hidden shadow-sm hover:shadow-xl transition-all relative transform hover:-translate-y-1">
                                                <div className="aspect-square w-full bg-slate-100 relative overflow-hidden">
                                                    <img src={s.photo||'https://via.placeholder.com/400?text=NO+IMAGE'} className="w-full h-full object-cover transition duration-700 group-hover:scale-110" />
                                                    <div className="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3">
                                                        <button onClick={()=>setEditingStudent(s)} className="w-12 h-12 bg-white text-blue-600 rounded-2xl flex items-center justify-center shadow-lg hover:bg-blue-600 hover:text-white transition-colors"><i className="ri-edit-2-fill text-2xl"></i></button>
                                                        <button onClick={()=>setStudentToDelete(s)} className="w-12 h-12 bg-white text-red-600 rounded-2xl flex items-center justify-center shadow-lg hover:bg-red-600 hover:text-white transition-colors"><i className="ri-delete-bin-fill text-2xl"></i></button>
                                                    </div>
                                                </div>
                                                <div className="p-5 text-center">
                                                    <div className="font-black text-lg text-slate-800 truncate leading-none mb-1">{s.nickname}</div>
                                                    <div className="text-[10px] text-slate-400 font-bold truncate uppercase tracking-tighter">{s.major}</div>
                                                    <div className="mt-3 inline-block px-3 py-1 rounded-lg text-[9px] font-black uppercase bg-blue-50 text-blue-600">{s.level}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto rounded-3xl border border-slate-100">
                                        <table className="w-full text-left text-sm border-collapse bg-white">
                                            <thead><tr className="bg-slate-50 border-b border-slate-100 text-slate-500 font-black uppercase text-[10px] tracking-widest"><th className="p-5">รูป</th><th className="p-5">นักศึกษา</th><th className="p-5">สาขา</th><th className="p-5 text-center">จัดการ</th></tr></thead>
                                            <tbody>
                                                {filtered.map(s => (
                                                    <tr key={s.id} className="border-b border-slate-50 hover:bg-blue-50/20 transition-colors">
                                                        <td className="p-4"><img src={s.photo||'https://via.placeholder.com/150'} className="w-12 h-12 object-cover rounded-xl shadow-sm border border-white" /></td>
                                                        <td className="p-4"><div className="font-black text-slate-900">{s.studentId} - {s.fullName}</div><div className="text-xs text-slate-500 font-medium">ชื่อเล่น: {s.nickname} | โทร: {s.phone}</div></td>
                                                        <td className="p-4 font-bold text-slate-600">{s.major}</td>
                                                        <td className="p-4 text-center">
                                                            <button onClick={()=>setEditingStudent(s)} className="p-2 text-blue-500 hover:bg-blue-50 rounded-xl transition"><i className="ri-edit-box-line text-2xl"></i></button>
                                                            <button onClick={()=>setStudentToDelete(s)} className="p-2 text-red-500 hover:bg-red-50 rounded-xl transition"><i className="ri-delete-bin-line text-2xl"></i></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="animate-fade-in max-w-2xl mx-auto space-y-8 py-4">
                                <div className="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl text-white">
                                    <div className="flex items-center space-x-3 mb-6">
                                        <div className="bg-yellow-500 p-2 rounded-xl text-slate-900"><i className="ri-settings-3-fill text-xl"></i></div>
                                        <h3 className="text-xl font-black uppercase tracking-tight">ตั้งค่ารายชื่อสาขาวิชา</h3>
                                    </div>
                                    <p className="text-slate-400 text-sm mb-6 font-medium">เพิ่มหรือลบชื่อสาขาวิชาที่จะแสดงในหน้าใบสมัคร เพื่อความเป็นระเบียบของข้อมูล</p>
                                    <div className="flex gap-3 mb-8">
                                        <input type="text" value={newMajor} onChange={e=>setNewMajor(e.target.value)} placeholder="ชื่อสาขาใหม่..." className="flex-1 p-4 rounded-2xl bg-white/10 border border-white/20 outline-none focus:border-yellow-500 font-bold" />
                                        <button onClick={()=>{ if(newMajor){ updateMajors([...majors, newMajor]); setNewMajor(''); } }} className="px-8 py-4 bg-yellow-500 text-slate-900 rounded-2xl font-black shadow-lg">เพิ่ม</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {majors.map((m, i) => (
                                            <div key={i} className="bg-white/5 border border-white/10 pl-4 pr-2 py-2 rounded-xl flex items-center group hover:bg-white/10 transition">
                                                <span className="font-bold text-sm mr-2">{m}</span>
                                                <button onClick={()=>updateMajors(majors.filter((_, idx)=>idx!==i))} className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-red-500 transition-colors"><i className="ri-close-fill text-xl"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modals: Edit/Delete... */}
                    {editingStudent && <EditStudentModal student={editingStudent} onClose={()=>setEditingStudent(null)} majors={majors} onSave={async (d)=>{ await getStudentsRef().doc(editingStudent.id).update(d); setEditingStudent(null); }} />}
                    {studentToDelete && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white p-10 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl border-4 border-red-50">
                                <div className="w-20 h-20 bg-red-50 text-red-500 rounded-[2rem] flex items-center justify-center mx-auto mb-6"><i className="ri-delete-bin-fill text-4xl"></i></div>
                                <h3 className="text-2xl font-black text-slate-900 mb-2">ยืนยันการลบ?</h3>
                                <p className="text-slate-500 mb-10 font-medium">คุณกำลังจะลบรายชื่อ <br/><span className="text-slate-900 font-black">{studentToDelete.fullName}</span><br/> การกระทำนี้ไม่สามารถกู้คืนได้</p>
                                <div className="flex gap-4">
                                    <button onClick={()=>setStudentToDelete(null)} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold">ยกเลิก</button>
                                    <button onClick={deleteStudent} className="flex-1 py-4 bg-red-600 text-white rounded-2xl font-black shadow-lg shadow-red-200">ยืนยันการลบ</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // =======================================================
        // หน้าต่างแก้ไข (Edit Modal)
        // =======================================================
        function EditStudentModal({ student, onClose, onSave, majors }) {
            const [formData, setFormData] = useState({ ...student });
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in no-print">
                    <div className="bg-white rounded-[2.5rem] w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row border border-slate-200">
                        <div className="md:w-1/3 bg-slate-900 p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-800">
                            <div className="w-44 h-44 rounded-[2.5rem] overflow-hidden border-8 border-slate-800 shadow-2xl mb-6 bg-slate-800">
                                <img src={student.photo || 'https://via.placeholder.com/400'} className="w-full h-full object-cover" />
                            </div>
                            <div className="text-center">
                                <div className="text-white font-black text-xl tracking-tight leading-none mb-2">{student.studentId}</div>
                                <div className="text-blue-400 text-xs font-bold uppercase tracking-widest">{student.interest}</div>
                            </div>
                        </div>
                        <div className="md:w-2/3 flex flex-col max-h-[85vh]">
                            <div className="p-6 bg-slate-50 border-b flex justify-between items-center">
                                <h3 className="font-black text-xl text-slate-800 uppercase tracking-tight">แก้ไขข้อมูลส่วนตัว</h3>
                                <button onClick={onClose} className="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-slate-200 transition">✕</button>
                            </div>
                            <div className="p-8 space-y-6 overflow-y-auto">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2"><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">ชื่อ - นามสกุลจริง</label><input value={formData.fullName} onChange={e=>setFormData({...formData, fullName:e.target.value})} className="w-full p-4 border-2 rounded-2xl focus:border-blue-500 outline-none font-bold" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">ชื่อเล่น</label><input value={formData.nickname} onChange={e=>setFormData({...formData, nickname:e.target.value})} className="w-full p-4 border-2 rounded-2xl" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">เพศ</label><select value={formData.gender} onChange={e=>setFormData({...formData, gender:e.target.value})} className="w-full p-4 border-2 rounded-2xl"><option value="ชาย">ชาย</option><option value="หญิง">หญิง</option><option value="อื่นๆ">LGBTQ+</option></select></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">ปีการศึกษา</label><input value={formData.academicYear} onChange={e=>setFormData({...formData, academicYear:e.target.value})} className="w-full p-4 border-2 rounded-2xl" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">สาขาวิชา</label>
                                        <select value={formData.major} onChange={e=>setFormData({...formData, major:e.target.value})} className="w-full p-4 border-2 rounded-2xl">
                                            {majors.map(m => <option key={m} value={m}>{m}</option>)}
                                        </select>
                                    </div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block text-blue-600">Line ID</label><input value={formData.lineId} onChange={e=>setFormData({...formData, lineId:e.target.value})} className="w-full p-4 border-2 border-blue-100 bg-blue-50 rounded-2xl" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">ระดับชั้น</label><input value={formData.level} onChange={e=>setFormData({...formData, level:e.target.value})} className="w-full p-4 border-2 rounded-2xl" /></div>
                                </div>
                                <div className="p-6 bg-slate-900 rounded-[2rem] text-white">
                                    <label className="block text-sm font-black mb-4 uppercase tracking-widest text-slate-400">สถานะความเป็นสมาชิก</label>
                                    <select value={formData.status} onChange={e=>setFormData({...formData, status:e.target.value})} className="w-full p-4 border border-slate-700 bg-slate-800 rounded-2xl mb-4 font-bold outline-none focus:border-blue-500 transition">
                                        <option value="active">🟢 กำลังเป็นสมาชิก (Active)</option>
                                        <option value="graduated">🎓 เรียนจบแล้ว (Graduated)</option>
                                        <option value="dismissed">🔴 พ้นสภาพ (Dismissed)</option>
                                    </select>
                                    {formData.status === 'dismissed' && <textarea placeholder="ระบุเหตุผลที่พ้นสภาพ..." value={formData.statusReason} onChange={e=>setFormData({...formData, statusReason:e.target.value})} className="w-full p-4 border border-slate-700 bg-slate-800 rounded-2xl text-sm" rows="2"></textarea>}
                                </div>
                                <div className="flex gap-4 pt-4 border-t">
                                    <button onClick={onClose} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold">ปิดหน้าต่าง</button>
                                    <button onClick={()=>onSave(formData)} className="flex-1 py-4 bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-100 hover:bg-blue-700 transition active:scale-95">บันทึกข้อมูลทั้งหมด</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
