    function StudentForm({ mode, student, majors, currentAcademicYear, allStudents = [], onDone }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const [cameraOn, setCameraOn] = useState(false);
      const [saving, setSaving] = useState(false);
      const [photoBusy, setPhotoBusy] = useState(false);
      const [formData, setFormData] = useState(() => ({
        studentId: student?.studentId || '',
        fullName: student?.fullName || '',
        nickname: student?.nickname || '',
        dob: student?.dob || '',
        gender: student?.gender || 'ชาย',
        phone: student?.phone || '',
        lineId: student?.lineId || '',
        emergencyPhone: student?.emergencyPhone || '',
        medicalCondition: student?.medicalCondition || '-',
        academicYear: student?.academicYear || currentAcademicYear,
        level: student?.level || 'ปวช.1',
        group: student?.group || '',
        major: student?.major || majors[0] || '',
        interest: student?.interest || 'ฝ่ายภาพนิ่ง',
        equipment: student?.equipment || 'ใช้มือถือเป็นหลัก',
        experience: student?.experience || 'ระดับเริ่มต้น',
        reason: student?.reason || '',
        status: student?.status || 'active',
        statusReason: student?.statusReason || '',
        actualInterest: student?.actualInterest || '',
        staffNotes: student?.staffNotes || '',
        photo: student?.photo || null,
        photoMeta: student?.photoMeta || null
      }));

      useEffect(() => () => stopCamera(), []);

      useEffect(() => {
        if (!cameraOn || !streamRef.current || !videoRef.current) return;
        const video = videoRef.current;
        video.srcObject = streamRef.current;
        video.muted = true;
        video.playsInline = true;
        video.onloadedmetadata = () => {
          video.play().catch(() => {});
        };
        video.play().catch(() => {});
      }, [cameraOn]);

      const setField = (name, value) => setFormData(prev => ({ ...prev, [name]: value }));

      const startCamera = async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return alert('เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาเปิดผ่าน Chrome/Edge/Safari เวอร์ชันใหม่ และต้องเป็น HTTPS');
          }
          stopCamera();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          streamRef.current = stream;
          setCameraOn(true);
          setTimeout(() => {
            if (videoRef.current && streamRef.current) {
              videoRef.current.srcObject = streamRef.current;
              videoRef.current.play().catch(() => {});
            }
          }, 80);
        } catch (err) {
          console.error('Camera error:', err);
          let msg = 'ไม่สามารถเปิดกล้องได้';
          if (err?.name === 'NotAllowedError' || err?.name === 'PermissionDeniedError') msg = 'ระบบยังไม่ได้รับสิทธิ์ใช้กล้อง กรุณาอนุญาตกล้องในเบราว์เซอร์แล้วลองใหม่';
          else if (err?.name === 'NotFoundError' || err?.name === 'DevicesNotFoundError') msg = 'ไม่พบกล้องในอุปกรณ์นี้';
          else if (err?.name === 'NotReadableError' || err?.name === 'TrackStartError') msg = 'กล้องอาจถูกโปรแกรมอื่นใช้งานอยู่ กรุณาปิดโปรแกรมที่ใช้กล้องแล้วลองใหม่';
          else if (location.protocol !== 'https:' && location.hostname !== 'localhost') msg = 'ต้องเปิดเว็บผ่าน HTTPS หรือ localhost กล้องจึงจะทำงานได้';
          alert(`${msg}\n\nรายละเอียด: ${err?.name || err?.message || '-'}`);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setCameraOn(false);
      };

      const capturePhoto = () => {
        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas || !video.videoWidth) return alert('กล้องยังไม่พร้อม ลองรอสักครู่แล้วกดถ่ายใหม่');
        const size = PHOTO_SIZE;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const crop = Math.min(vw, vh);
        const sx = (vw - crop) / 2;
        const sy = (vh - crop) / 2;
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, crop, crop, 0, 0, size, size);
        const dataUrl = canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
        setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: { width: PHOTO_SIZE, height: PHOTO_SIZE, quality: PHOTO_QUALITY, approxBytes: approxBytesFromDataUrl(dataUrl), source: 'camera', optimizedAt: new Date().toISOString(), note: 'v72 compressed profile image' } }));
        stopCamera();
      };

      const handleUploadPhoto = async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        setPhotoBusy(true);
        try {
          const { dataUrl, meta } = await optimizeImageFile(file);
          setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: { ...meta, note: 'v72 compressed profile image' } }));
          stopCamera();
        } catch (err) {
          alert(err.message || 'อัปโหลดรูปไม่สำเร็จ');
        } finally {
          setPhotoBusy(false);
          event.target.value = '';
        }
      };

      const recompressCurrentPhoto = async () => {
        if (!formData.photo) return alert('ยังไม่มีรูปให้บีบอัด');
        setPhotoBusy(true);
        try {
          const before = approxBytesFromDataUrl(formData.photo);
          const { dataUrl, meta } = await optimizeImageDataUrl(formData.photo, 'recompress');
          const after = approxBytesFromDataUrl(dataUrl);
          setFormData(prev => ({ ...prev, photo: dataUrl, photoMeta: { ...meta, originalBytes: before, note: 'v72 recompressed existing profile image' } }));
          alert(`บีบอัดรูปเรียบร้อย\nก่อนบีบอัด: ${prettyBytes(before)}\nหลังบีบอัด: ${prettyBytes(after)}`);
        } catch (err) {
          alert(err.message || 'บีบอัดรูปเดิมไม่สำเร็จ');
        } finally {
          setPhotoBusy(false);
        }
      };

      const resetForm = () => {
        setFormData({
          studentId:'', fullName:'', nickname:'', dob:'', gender:'ชาย', phone:'', lineId:'', emergencyPhone:'', medicalCondition:'-',
          academicYear: currentAcademicYear, level:'ปวช.1', group:'', major: majors[0] || '', interest:'ฝ่ายภาพนิ่ง', equipment:'ใช้มือถือเป็นหลัก', experience:'ระดับเริ่มต้น', reason:'', status:'active', statusReason:'', actualInterest:'', staffNotes:'', photo:null, photoMeta:null
        });
      };

      const submit = async e => {
        e.preventDefault();
        if (!formData.studentId || !formData.fullName || !formData.nickname) return alert('กรุณากรอก รหัสนักศึกษา / ชื่อ-นามสกุล / ชื่อเล่น');
        if (!formData.photo) {
          const ok = confirm('ยังไม่มีรูปถ่าย ต้องการบันทึกโดยไม่มีรูปหรือไม่?');
          if (!ok) return;
        }
        const normalizedStudentId = String(formData.studentId || '').trim();
        const normalizedYear = String(formData.academicYear || currentAcademicYear).trim();
        const duplicateLocal = allStudents.find(s => String(s.studentId || '').trim() === normalizedStudentId && String(s.academicYear || '').trim() === normalizedYear && s.id !== student?.id);
        if (duplicateLocal) {
          alert(`พบข้อมูลซ้ำ: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${duplicateLocal.fullName || '-'}`);
          return;
        }
        setSaving(true);
        const payload = {
          ...formData,
          studentId: normalizedStudentId,
          academicYear: normalizedYear,
          updatedAt: new Date().toISOString(),
          entryMode: 'staff_manual',
          source: 'paper_form',
          createdBy: 'เจ้าหน้าที่'
        };
        try {
          const duplicateSnap = await getStudentsRef().where('studentId', '==', normalizedStudentId).where('academicYear', '==', normalizedYear).get();
          const duplicateDoc = duplicateSnap.docs.find(d => d.id !== student?.id);
          if (duplicateDoc) {
            const d = duplicateDoc.data() || {};
            alert(`พบข้อมูลซ้ำในฐานข้อมูล: รหัสนักศึกษา ${normalizedStudentId} มีอยู่แล้วในปีการศึกษา ${normalizedYear}\nชื่อในระบบ: ${d.fullName || '-'}`);
            return;
          }
          if (mode === 'edit' && student?.id) {
            await getStudentsRef().doc(student.id).update(payload);
            alert('บันทึกการแก้ไขเรียบร้อย');
            onDone && onDone();
          } else {
            await getStudentsRef().add({ ...payload, createdAt: new Date().toISOString() });
            alert('เพิ่มสมาชิกใหม่เรียบร้อย');
            resetForm();
            onDone && onDone();
          }
        } catch (err) {
          alert('บันทึกไม่สำเร็จ: ' + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={submit} className="grid xl:grid-cols-[1fr_360px] gap-5">
          <div className="bg-white rounded-[2rem] soft-shadow border border-white p-5 md:p-7 space-y-7">
            <SectionTitle icon="ri-bank-card-fill" title="ข้อมูลการศึกษา" desc="คีย์จากใบสมัครกระดาษของนักศึกษา" />
            <div className="grid md:grid-cols-2 gap-4">
              <Input label="รหัสนักศึกษา *" value={formData.studentId} onChange={v => setField('studentId', v)} placeholder="เช่น 673228359" />
              <Input label="ปีการศึกษา *" value={formData.academicYear} onChange={v => setField('academicYear', v)} />
              <Select label="ระดับชั้น *" value={formData.level} onChange={v => setField('level', v)} options={['ปวช.1','ปวช.2','ปวช.3','ปวส.1','ปวส.2']} />
              <Input label="กลุ่มเรียน/ห้อง *" value={formData.group} onChange={v => setField('group', v)} placeholder="เช่น 1/1" />
              <Select label="สาขาวิชา *" value={formData.major} onChange={v => setField('major', v)} options={majors} className="md:col-span-2" />
            </div>

            <SectionTitle icon="ri-user-heart-fill" title="ข้อมูลส่วนตัว" desc="ข้อมูลสำหรับติดต่อและจัดทำทะเบียน" />
            <div className="grid md:grid-cols-2 gap-4">
              <Input label="ชื่อ - นามสกุล *" value={formData.fullName} onChange={v => setField('fullName', v)} placeholder="ไม่ต้องใส่คำนำหน้า" className="md:col-span-2" />
              <Input label="ชื่อเล่น *" value={formData.nickname} onChange={v => setField('nickname', v)} />
              <Select label="เพศ" value={formData.gender} onChange={v => setField('gender', v)} options={['ชาย','หญิง','LGBTQ+','อื่น ๆ']} />
              <Input label="วันเกิด" type="date" value={formData.dob} onChange={v => setField('dob', v)} />
              <Input label="เบอร์โทรศัพท์" value={formData.phone} onChange={v => setField('phone', v)} />
              <Input label="Line ID" value={formData.lineId} onChange={v => setField('lineId', v)} />
              <Input label="เบอร์โทรฉุกเฉิน" value={formData.emergencyPhone} onChange={v => setField('emergencyPhone', v)} />
              <Input label="โรคประจำตัว/แพ้อาหาร" value={formData.medicalCondition} onChange={v => setField('medicalCondition', v)} />
            </div>

            <SectionTitle icon="ri-camera-fill" title="ข้อมูลชมรม" desc="ฝ่ายที่สนใจ อุปกรณ์ และประสบการณ์" />
            <div className="grid md:grid-cols-2 gap-4">
              <Select label="ฝ่ายที่สนใจตอนสมัคร" value={formData.interest} onChange={v => setField('interest', v)} options={interestOptions} />
              <Select label="ฝ่ายที่ปฏิบัติงานจริง" value={formData.actualInterest} onChange={v => setField('actualInterest', v)} options={['', ...interestOptions]} optionLabels={{'':'ยังไม่กำหนด'}} />
              <Select label="อุปกรณ์ส่วนตัว" value={formData.equipment} onChange={v => setField('equipment', v)} options={['ใช้มือถือเป็นหลัก','มีกล้อง DSLR/Mirrorless','มีโน้ตบุ๊กสำหรับตัดต่อ','ไม่มีอุปกรณ์']} />
              <Select label="ประสบการณ์" value={formData.experience} onChange={v => setField('experience', v)} options={['ระดับเริ่มต้น','พอทำเป็นบ้าง','ระดับกลาง','ระดับเซียน']} />
              <Select label="สถานะ" value={formData.status} onChange={v => setField('status', v)} options={statusOptions.map(s => s.value)} optionLabels={Object.fromEntries(statusOptions.map(s => [s.value, s.label]))} />
              <TextArea label="เหตุผลที่อยากเข้าชมรม" value={formData.reason} onChange={v => setField('reason', v)} className="md:col-span-2" />
              <TextArea label="หมายเหตุเจ้าหน้าที่" value={formData.staffNotes} onChange={v => setField('staffNotes', v)} className="md:col-span-2" />
              {formData.status !== 'active' && <Input label="เหตุผลสถานะ" value={formData.statusReason} onChange={v => setField('statusReason', v)} className="md:col-span-2" />}
            </div>
          </div>

          <div className="xl:sticky xl:top-6 h-fit bg-slate-950 rounded-[2rem] soft-shadow p-5 text-white no-print">
            <div className="flex items-center justify-between mb-5">
              <div>
                <h3 className="font-extrabold text-xl">รูปถ่ายสมาชิก</h3>
                <p className="text-slate-400 text-sm">ถ่ายจากกล้องหรืออัปโหลดรูปจากไฟล์ · บีบอัดอัตโนมัติ {PHOTO_SIZE}×{PHOTO_SIZE}px เพื่อประหยัดฐานข้อมูล</p>
              </div>
              <i className="ri-camera-lens-fill text-blue-300 text-3xl"></i>
            </div>

            <div className="aspect-square rounded-[1.7rem] overflow-hidden bg-slate-800 border-4 border-slate-800 mb-5 relative">
              {cameraOn ? <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover scale-x-[-1]" /> : formData.photo ? <img src={formData.photo} className="w-full h-full object-cover" /> : <div className="w-full h-full flex flex-col items-center justify-center text-slate-500"><i className="ri-image-add-fill text-6xl mb-3"></i><p className="font-bold">ยังไม่มีรูปถ่าย</p></div>}
              <canvas ref={canvasRef} className="hidden"></canvas>
            </div>

            {formData.photo && <div className="mb-4 rounded-2xl bg-white/5 border border-white/10 px-4 py-3 text-xs text-slate-400 flex items-center justify-between gap-3"><span><i className="ri-file-reduce-line mr-1"></i>{formData.photoMeta?.source === 'recompress' ? 'บีบอัดรูปเดิมแล้ว' : formData.photoMeta?.source === 'upload' ? 'อัปโหลดและบีบอัดแล้ว' : 'ถ่ายภาพและบีบอัดแล้ว'}</span><span className="whitespace-nowrap">{prettyBytes(formData.photoMeta?.approxBytes || approxBytesFromDataUrl(formData.photo))}</span></div>}
            {formData.photo && isLegacyOrHeavyPhoto(formData) && <div className="mb-4 rounded-2xl bg-amber-500/10 border border-amber-400/20 px-4 py-3 text-xs text-amber-100"><i className="ri-alert-fill mr-1"></i>รูปนี้อาจเป็นรูปเก่าหรือยังหนักอยู่ แนะนำกด “บีบอัดรูปเดิม” ก่อนบันทึก</div>}

            <div className="grid grid-cols-2 gap-3 mb-5">
              {!cameraOn ? <button type="button" onClick={startCamera} className="py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 font-bold"><i className="ri-vidicon-fill mr-2"></i>เปิดกล้อง</button> : <button type="button" onClick={capturePhoto} className="py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 font-bold"><i className="ri-camera-fill mr-2"></i>กดถ่ายภาพ</button>}
              <label className={`py-3 rounded-2xl font-bold text-center transition ${photoBusy ? 'bg-cyan-900/70 cursor-not-allowed opacity-70' : 'bg-cyan-600 hover:bg-cyan-700 cursor-pointer'}`}>
                <i className="ri-upload-cloud-2-fill mr-2"></i>{photoBusy ? 'กำลังเตรียมรูป...' : 'เลือกรูป'}
                <input type="file" accept={SUPPORTED_IMAGE_ACCEPT} onChange={handleUploadPhoto} disabled={photoBusy} className="hidden" />
              </label>
              <button type="button" onClick={recompressCurrentPhoto} disabled={!formData.photo || photoBusy} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold disabled:opacity-40"><i className="ri-file-reduce-line mr-1"></i>บีบอัดรูปเดิม</button>
              <button type="button" onClick={() => setFormData(prev => ({ ...prev, photo: null, photoMeta: null }))} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold">ลบรูป</button>
              <button type="button" onClick={stopCamera} className="py-3 rounded-2xl bg-white/10 hover:bg-white/15 font-bold col-span-2">ปิดกล้อง</button>
            </div>
            <p className="text-xs text-slate-500 text-center mb-5">รองรับ JPG, PNG, WEBP, GIF, BMP จากคอม มือถือ หรือกล้องถ่ายรูป ระบบจะแปลงและครอปเป็น JPEG ขนาดเล็กอัตโนมัติ เพื่อลดภาระฐานข้อมูล</p>

            <button type="submit" disabled={saving} className="w-full py-4 rounded-2xl bg-white text-slate-950 font-extrabold text-lg hover:bg-blue-50 transition disabled:opacity-50 active:scale-[.98]">
              {saving ? 'กำลังบันทึก...' : mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกสมาชิกใหม่'}
            </button>
            <p className="text-xs text-slate-500 text-center mt-4">ระบบจะบันทึกเป็นข้อมูลที่เจ้าหน้าที่คีย์จากใบสมัคร</p>
          </div>
        </form>
      );
    }

    function SectionTitle({ icon, title, desc }) {
      return (
        <div className="flex items-start gap-3 pt-1">
          <div className="w-11 h-11 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl"><i className={icon}></i></div>
          <div><h3 className="font-extrabold text-xl text-slate-950">{title}</h3><p className="text-slate-500 text-sm">{desc}</p></div>
        </div>
      );
    }

    function Input({ label, value, onChange, placeholder, type='text', className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><input type={type} value={value || ''} onChange={e => onChange(e.target.value)} placeholder={placeholder || ''} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900 placeholder:text-slate-400" /></label>;
    }

    function Select({ label, value, onChange, options, optionLabels={}, className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><select value={value || ''} onChange={e => onChange(e.target.value)} className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900">{options.map(o => <option key={o} value={o}>{optionLabels[o] || o}</option>)}</select></label>;
    }

    function TextArea({ label, value, onChange, className='' }) {
      return <label className={`block ${className}`}><span className="block text-xs font-extrabold text-slate-500 mb-2 uppercase tracking-wide">{label}</span><textarea value={value || ''} onChange={e => onChange(e.target.value)} rows="3" className="w-full px-4 py-3 rounded-2xl bg-white border-2 border-slate-200 outline-none focus:border-blue-500 font-bold text-slate-900 resize-none"></textarea></label>;
    }

    function DetailModal({ student, onClose, onEdit, onStatusChange }) {
      const rows = [
        ['รหัสนักศึกษา', student.studentId], ['ชื่อ - นามสกุล', student.fullName], ['ชื่อเล่น', student.nickname], ['ปีการศึกษา', student.academicYear],
        ['ระดับ/กลุ่ม', `${student.level || '-'} / ${student.group || '-'}`], ['สาขาวิชา', student.major], ['เพศ', student.gender], ['วันเกิด', student.dob],
        ['เบอร์โทรศัพท์', student.phone], ['Line ID', student.lineId], ['เบอร์ฉุกเฉิน', student.emergencyPhone], ['โรคประจำตัว/แพ้อาหาร', student.medicalCondition],
        ['ฝ่ายที่สนใจตอนสมัคร', student.interest], ['ฝ่ายที่ปฏิบัติงานจริง', student.actualInterest || '-'], ['อุปกรณ์', student.equipment], ['ประสบการณ์', student.experience],
        ['เหตุผลที่สมัคร', student.reason], ['หมายเหตุเจ้าหน้าที่', student.staffNotes || '-'], ['ข้อมูลไม่ครบ', missingSummary(student)]
      ];
      return (
        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 p-3 md:p-5 no-print animate-fade-in overflow-y-auto">
          <div className="bg-white rounded-[1.6rem] md:rounded-[2rem] w-full max-w-6xl mx-auto my-2 md:my-0 soft-shadow overflow-hidden grid lg:grid-cols-[320px_minmax(0,1fr)] lg:max-h-[calc(100dvh-40px)]">
            <div className="bg-slate-950 text-white p-5 lg:p-6 flex flex-col items-center lg:justify-start">
              <img src={student.photo || 'https://via.placeholder.com/500?text=NO+IMAGE'} className="w-36 h-36 md:w-44 md:h-44 lg:w-52 lg:h-52 rounded-[1.6rem] lg:rounded-[2rem] object-cover border-4 border-white/10 shadow-xl mb-4" />
              <h3 className="text-xl lg:text-2xl font-extrabold text-center leading-snug">{student.fullName || '-'}</h3>
              <p className="text-slate-400 text-sm text-center">{student.studentId || '-'} · {student.nickname || '-'}</p>
              <select value={student.status || 'active'} onChange={e => onStatusChange(student, e.target.value)} className={`mt-4 w-full px-4 py-3 rounded-2xl bg-white text-slate-950 border-2 font-extrabold outline-none ${statusBadge(student.status)}`}>
                {statusOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
              </select>
              <div className="mt-4 rounded-2xl bg-white/5 border border-white/10 p-4 text-sm text-slate-300 w-full max-h-32 lg:max-h-none overflow-y-auto">{student.staffNotes || 'ยังไม่มีหมายเหตุเจ้าหน้าที่'}</div>
            </div>

            <div className="flex flex-col min-h-0 lg:max-h-[calc(100dvh-40px)]">
              <div className="p-4 md:p-5 border-b flex items-center justify-between bg-slate-50 shrink-0">
                <div>
                  <h3 className="text-xl md:text-2xl font-extrabold">รายละเอียดสมาชิก</h3>
                  <p className="text-slate-500 text-xs md:text-sm">ข้อมูลครบจากใบสมัครและข้อมูลที่เจ้าหน้าที่บันทึก</p>
                </div>
                <button onClick={onClose} className="w-11 h-11 shrink-0 rounded-2xl hover:bg-slate-200 font-bold">✕</button>
              </div>

              <div className="p-4 md:p-6 overflow-visible lg:overflow-y-auto grid sm:grid-cols-2 gap-3 min-h-0 lg:flex-1">
                {rows.map(([label,value]) => (
                  <div key={label} className={`rounded-2xl bg-slate-50 border border-slate-100 p-4 ${['เหตุผลที่สมัคร','หมายเหตุเจ้าหน้าที่','ข้อมูลไม่ครบ'].includes(label) ? 'sm:col-span-2' : ''}`}>
                    <p className="text-xs text-slate-500 font-bold mb-1">{label}</p>
                    <p className="font-bold text-slate-900 break-words whitespace-pre-wrap">{value || '-'}</p>

              <div className="p-4 md:p-5 border-t flex flex-wrap gap-3 justify-end bg-white shrink-0">
                <button onClick={() => onEdit(student)} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-bold"><i className="ri-edit-2-fill mr-2"></i>แก้ไขข้อมูล</button>
                <button onClick={onClose} className="px-5 py-3 rounded-2xl bg-slate-100 font-bold">ปิด</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function EditModal({ student, majors, currentAcademicYear, allStudents = [], onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md p-3 md:p-6 overflow-y-auto no-print">
          <div className="max-w-6xl mx-auto animate-fade-in">
            <div className="bg-white rounded-[2rem] p-4 md:p-5 mb-4 flex items-center justify-between soft-shadow">
              <div><h3 className="font-extrabold text-xl">แก้ไขข้อมูลสมาชิก</h3><p className="text-slate-500 text-sm">{student.studentId} - {student.fullName}</p></div>
              <button onClick={onClose} className="w-12 h-12 rounded-2xl bg-slate-100 hover:bg-slate-200 font-bold"><i className="ri-close-fill text-2xl"></i></button>
            </div>
            <StudentForm mode="edit" student={student} majors={majors} currentAcademicYear={currentAcademicYear} allStudents={allStudents} onDone={onClose} />
          </div>
        </div>
      );
    }

    function DeleteModal({ student, onCancel, onConfirm }) {
      return (

    function YearManager({ students, yearsList, currentAcademicYear, setCurrentAcademicYear }) {
      const yearOptions = useMemo(() => [...new Set([currentAcademicYear, ...(yearsList || [])].filter(Boolean))], [currentAcademicYear, yearsList]);
      const [year, setYear] = useState(currentAcademicYear);
      const [confirmText, setConfirmText] = useState('');
      const [busy, setBusy] = useState(false);
      const [backupConfirmed, setBackupConfirmed] = useState(false);
      const [backupLogs, setBackupLogs] = useState([]);
      const [dbCollections, setDbCollections] = useState({ duties: [], templates: [], activities: [], works: [], logs: [], settings: {} });
      const [usageLimitMb, setUsageLimitMb] = useState(() => Number(localStorage.getItem('mdec_db_usage_limit_mb') || 900));

      useEffect(() => {
        if (!yearOptions.includes(year) && yearOptions.length) setYear(yearOptions[0]);
      }, [yearOptions]);

      useEffect(() => { setConfirmText(''); setBackupConfirmed(false); }, [year]);

      useEffect(() => {
        const unsub = getSettingsRef().onSnapshot(doc => {
          const data = doc.exists ? (doc.data() || {}) : {};
          setBackupLogs(Array.isArray(data.backupLogs) ? data.backupLogs.slice(0, 8) : []);
        }, err => console.error('backup log load failed', err));
        return () => unsub();
      }, []);

      useEffect(() => {
        const unsubDuty = getDutyRef().onSnapshot(snapshot => {
          setDbCollections(prev => ({ ...prev, duties: snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })) }));
        }, err => console.error('db monitor duty load failed', err));
        const unsubTemplates = getDutyTemplatesRef().onSnapshot(snapshot => {
          setDbCollections(prev => ({ ...prev, templates: snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })) }));
        }, err => console.error('db monitor template load failed', err));
        const unsubActivities = getActivitiesRef().onSnapshot(snapshot => {
          setDbCollections(prev => ({ ...prev, activities: snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })) }));
        }, err => console.error('db monitor activities load failed', err));
        const unsubWorks = getWorksRef().onSnapshot(snapshot => {
          setDbCollections(prev => ({ ...prev, works: snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })) }));
        }, err => console.error('db monitor works load failed', err));
        const unsubLogs = getChangeLogsRef().onSnapshot(snapshot => {
          setDbCollections(prev => ({ ...prev, logs: snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })) }));
        }, err => console.error('db monitor logs load failed', err));
        const unsubSettings = getSettingsRef().onSnapshot(doc => {
          setDbCollections(prev => ({ ...prev, settings: doc.exists ? ({ id: doc.id, ...doc.data() }) : {} }));
        }, err => console.error('db monitor settings load failed', err));
        return () => { unsubDuty(); unsubTemplates(); unsubActivities(); unsubWorks(); unsubLogs(); unsubSettings(); };
      }, []);

      const approxJsonBytes = (value) => {
        try { return new Blob([JSON.stringify(value || {})]).size; }
        catch (err) { return String(JSON.stringify(value || {}) || '').length * 2; }
      };

      const updateUsageLimitMb = (value) => {
        const next = Math.max(10, Math.min(10000, Number(value) || 900));
        setUsageLimitMb(next);
        localStorage.setItem('mdec_db_usage_limit_mb', String(next));
      };

      const selected = useMemo(() => students.filter(s => String(s.academicYear || '') === String(year || '')), [students, year]);
      const stats = useMemo(() => buildStats(students, year), [students, year]);
      const dbUsage = useMemo(() => {
        const studentDocs = (students || []).map(s => ({ collection: 'students', ...s }));
        const dutyDocs = (dbCollections.duties || []).map(d => ({ collection: 'duty_rosters', ...d }));
        const templateDocs = (dbCollections.templates || []).map(t => ({ collection: 'duty_templates', ...t }));
        const activityDocs = (dbCollections.activities || []).map(a => ({ collection: 'club_activities', ...a }));
        const workDocs = (dbCollections.works || []).map(w => ({ collection: 'member_works', ...w }));
        const logDocs = (dbCollections.logs || []).map(l => ({ collection: 'change_logs', ...l }));
        const settingsDocs = dbCollections.settings && Object.keys(dbCollections.settings).length ? [{ collection: 'settings', ...dbCollections.settings }] : [];
        const allDocs = [...studentDocs, ...dutyDocs, ...templateDocs, ...activityDocs, ...workDocs, ...logDocs, ...settingsDocs];
        const rawBytes = allDocs.reduce((sum, item) => sum + approxJsonBytes(item), 0);
        const overheadBytes = allDocs.length * 650;
        const estimatedBytes = Math.round((rawBytes + overheadBytes) * 1.18);
        const selectedBytes = selected.reduce((sum, item) => sum + approxJsonBytes(item), 0);
        const avgStudentBytes = students.length ? Math.max(1, Math.round(studentDocs.reduce((sum, item) => sum + approxJsonBytes(item), 0) / students.length)) : 0;
        const limitBytes = Math.max(1, Number(usageLimitMb || 900) * 1024 * 1024);
        const percent = Math.min(999, Math.round((estimatedBytes / limitBytes) * 1000) / 10);
        const remainingBytes = Math.max(0, limitBytes - estimatedBytes);
        const estimatedMoreStudents = avgStudentBytes ? Math.floor(remainingBytes / avgStudentBytes) : 0;
        const status = percent >= 90 ? 'danger' : percent >= 75 ? 'warning' : percent >= 55 ? 'watch' : 'safe';
        const statusText = status === 'danger' ? 'ควรสำรองและล้างข้อมูลเร็ว ๆ นี้' : status === 'warning' ? 'เริ่มใกล้เพดานที่ตั้งไว้' : status === 'watch' ? 'เริ่มมีข้อมูลสะสมเยอะ' : 'ยังใช้งานได้สบาย';
        const statusClass = status === 'danger' ? 'bg-red-950/45 border-red-500/40 text-red-100' : status === 'warning' ? 'bg-amber-950/40 border-amber-500/40 text-amber-100' : status === 'watch' ? 'bg-blue-950/45 border-blue-500/40 text-blue-100' : 'bg-emerald-950/35 border-emerald-500/35 text-emerald-100';
        return {
          totalDocs: allDocs.length,
          studentDocs: studentDocs.length,
          dutyDocs: dutyDocs.length,
          templateDocs: templateDocs.length,
          activityDocs: activityDocs.length,
          workDocs: workDocs.length,
          logDocs: logDocs.length,
          settingsDocs: settingsDocs.length,
          estimatedBytes,
          selectedBytes,
          avgStudentBytes,
          limitBytes,
          percent,
          remainingBytes,
          estimatedMoreStudents,
          status,
          statusText,
          statusClass
        };
      }, [students, selected, dbCollections, usageLimitMb]);
      const clearCode = `CLEAR ${year}`;

      const recordBackupLog = async (type) => {
        const entry = { type, academicYear: year, total: selected.length, at: new Date().toISOString() };
        const next = [entry, ...backupLogs].slice(0, 20);

      };

      const backupJSON = () => {

        const activitySelected = (dbCollections.activities || []).filter(a => String(a.academicYear || '') === String(year || ''));
        const workSelected = (dbCollections.works || []).filter(w => String(w.academicYear || '') === String(year || ''));

    function SettingsPage({ majors, setMajors, currentAcademicYear, setCurrentAcademicYear }) {
      const [newMajor, setNewMajor] = useState('');
      const [year, setYear] = useState(currentAcademicYear);
      const saveSettings = async (nextMajors = majors, nextYear = year) => {
        await getSettingsRef().set({ majors: nextMajors, currentAcademicYear: String(nextYear), updatedAt: new Date().toISOString() }, { merge: true });
      };
      const addMajor = async () => {
        const name = newMajor.trim();
        if (!name) return;
        if (majors.includes(name)) return alert('มีสาขานี้อยู่แล้ว');
        const next = [...majors, name];
        await saveSettings(next, year);
        setMajors(next);
        setNewMajor('');
      };
      const removeMajor = async index => {
        const next = majors.filter((_, i) => i !== index);
        await saveSettings(next, year);
        setMajors(next);
      };
      const saveYear = async () => {
        await saveSettings(majors, year);
        setCurrentAcademicYear(String(year));
        alert('บันทึกปีการศึกษาปัจจุบันเรียบร้อย');
      };
      return (
        <div className="grid xl:grid-cols-2 gap-5">

    function ManualPage() {
      const steps = [
        ['เริ่มวันด้วยหน้าแรก', 'เปิดหน้าแรกเพื่อดูเวรวันนี้ งานค้าง ตรวจสุขภาพระบบ และปุ่มลัดที่ใช้บ่อย'],
        ['เช้าวันนี้', 'ใช้ดูรายชื่อเวรของวันนี้ ระบบถือว่ามาปกติอัตโนมัติ ไม่ต้องกดทุกคน'],
        ['บันทึกปัญหาเวร', 'กดเฉพาะกรณี สาย / ขาด / ลา / ไม่พบตัว / ทำแทน เพื่อลดงานตอนเช้า'],
        ['เพิ่มสมาชิกใหม่', 'คีย์ข้อมูลจากใบสมัครกระดาษ เลือกปีการศึกษาและฝ่ายที่สนใจให้ถูกต้อง'],
        ['ถ่ายรูปหรืออัปโหลดรูปสมาชิก', 'เก็บรูปโปรไฟล์ให้ครบ เพื่อให้ตารางเวรและบอร์ดสภาดูง่าย'],
        ['กิจกรรมชมรม', 'บันทึกกิจกรรม เช็คการเข้าร่วม และเก็บลิงก์อัลบั้ม/ภาพปก'],
        ['ผลงานสมาชิก', 'เก็บผลงานภาพถ่าย วิดีโอ หรือสื่อที่นักศึกษาช่วยงาน'],
        ['เลือกตั้ง / สภาชมรม', 'บันทึกตำแหน่งสภา ผู้สมัคร คะแนน และโชว์บอร์ดสภา'],
        ['ตรวจสุขภาพระบบ', 'ดูข้อมูลไม่ครบ ตารางเวร กิจกรรมค้าง และฐานข้อมูลใกล้เต็ม'],
        ['จัดการปี / Backup', 'ก่อนล้างข้อมูลต้องสำรองไฟล์และยืนยันว่าเก็บไฟล์ไว้แล้ว']
      ];
      return (
        <div className="manual-card bg-white rounded-[2rem] soft-shadow border border-white p-6 md:p-8">
          <h3 className="text-2xl font-extrabold mb-2"><i className="ri-book-open-fill text-blue-600 mr-2"></i>คู่มือเจ้าหน้าที่แบบย่อ</h3>
          <p className="text-slate-500 mb-6">ขั้นตอนนี้ออกแบบสำหรับการใช้งานภายในศูนย์ โดยเจ้าหน้าที่เป็นผู้คีย์และควบคุมข้อมูลทั้งหมด</p>
          <div className="grid md:grid-cols-2 gap-4">
            {steps.map(([title,desc],idx) => <div key={title} className="rounded-3xl bg-slate-50 border border-slate-100 p-5"><div className="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-extrabold mb-3">{idx+1}</div><h4 className="font-extrabold text-slate-950 mb-1">{title}</h4><p className="text-slate-500 text-sm">{desc}</p></div>)}
          </div>
          <div className="mt-6 rounded-3xl bg-orange-50 border border-orange-100 p-5 text-orange-800 text-sm leading-relaxed"><b>หมายเหตุด้านความปลอดภัย:</b> การรันบน Vercel และไม่ติด Google ช่วยลดโอกาสคนทั่วไปเจอเว็บ แต่ถ้ามีคนรู้ลิงก์ก็ยังเปิดได้อยู่ ระยะยาวถ้าเปิดใช้งานจริงกับข้อมูลจำนวนมาก ควรพิจารณา Firebase Auth เพิ่มเติม</div>
        </div>
      );
    }

    function PrintRoster({ students, onClose }) {
      const [reportMode, setReportMode] = useState('table');
      const reportDate = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
      const reportTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      const years = [...new Set(students.map(s => s.academicYear).filter(Boolean))].sort();
      const yearText = years.length === 1 ? years[0] : (years.length ? years.join(', ') : '-');
      const activeCount = students.filter(s => (s.status || 'active') === 'active').length;
      const graduatedCount = students.filter(s => s.status === 'graduated').length;
      const dismissedCount = students.filter(s => s.status === 'dismissed').length;
      const photoCount = students.filter(s => !!s.photo).length;
      const splitThaiFullName = (fullName = '') => {
        const parts = String(fullName || '').trim().replace(/\s+/g, ' ').split(' ').filter(Boolean);
        if (!parts.length) return { firstName:'-', lastName:'-' };
        if (parts.length === 1) return { firstName:parts[0], lastName:'-' };
        return { firstName:parts[0], lastName:parts.slice(1).join(' ') };
      };
      const printDepartment = (s) => s.department || s.actualInterest || s.interest || '-';
      return (
        <div className="print-overlay fixed inset-0 z-[100] bg-white overflow-y-auto p-4 md:p-8 animate-fade-in">
          <div className="no-print flex flex-col md:flex-row gap-3 md:items-center md:justify-between mb-6 pb-5 border-b">
            <div>
              <h2 className="font-extrabold text-2xl">พิมพ์รายงาน / ใบรายชื่อสมาชิก</h2>
              <p className="text-slate-500">เลือกแบบเอกสารที่ต้องการพิมพ์ โดยข้อมูลจะอ้างอิงจากตัวกรองในหน้าฐานข้อมูลสมาชิก</p>
            </div>
            <div className="flex flex-wrap gap-3">
              <div className="flex p-1 bg-slate-100 rounded-2xl border border-slate-200">
                <button onClick={() => setReportMode('table')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='table' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>รายงานตาราง</button>
                <button onClick={() => setReportMode('list')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='list' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>ใบรายชื่อ</button>
                <button onClick={() => setReportMode('directory')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='directory' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>ทำเนียบรูปภาพ</button>
                <button onClick={() => setReportMode('sign')} className={`px-4 py-2 rounded-xl font-bold text-sm ${reportMode==='sign' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-500'}`}>ใบเซ็นชื่อ</button>
              </div>
              <button onClick={() => window.print()} className="px-5 py-3 rounded-2xl bg-blue-600 text-white font-bold"><i className="ri-printer-fill mr-2"></i>พิมพ์ / Save PDF</button>
              <button onClick={onClose} className="px-5 py-3 rounded-2xl bg-slate-100 font-bold">ปิด</button>
            </div>
          </div>

          {students.length > 300 && reportMode === 'directory' && <div className="no-print mb-5 p-4 rounded-3xl bg-orange-50 border border-orange-100 text-orange-800 text-sm"><i className="ri-alert-fill mr-2"></i><b>แนะนำ:</b> ทำเนียบรูปภาพมีมากกว่า 300 รายการ ควรกรองตามระดับชั้น/สาขา/ฝ่ายก่อนพิมพ์ เพื่อให้ไฟล์ PDF ไม่หนักเกินไป</div>}

          <section className={`report-page ${reportMode === 'sign' ? 'sign-report' : reportMode === 'list' ? 'name-list-report' : ''}`}>
            <div className="report-header">
              <div className="report-brand">
                <div className="report-logo"><img src={MDEC_LOGO} alt="MDEC" /></div>
                <div>
                  <div className="report-title">{reportMode === 'table' ? 'รายงานทะเบียนสมาชิกชมรม MDEC PHOTO CLUB' : reportMode === 'sign' ? 'ใบรายชื่อสมาชิกสำหรับเซ็นชื่อ' : reportMode === 'list' ? 'ใบรายชื่อสมาชิกชมรม MDEC PHOTO CLUB' : 'ทำเนียบรูปภาพสมาชิกชมรม MDEC PHOTO CLUB'}</div>
                  <div className="report-subtitle">ภายใต้การดูแลของศูนย์มัลติมีเดียทางการศึกษา • วิทยาลัยเทคโนโลยีภาคตะวันออก (อี.เทค)</div>
                </div>
              </div>
              <div className="report-meta">
                <div><strong>ปีการศึกษา:</strong> {yearText}</div>
                <div><strong>วันที่ออกรายงาน:</strong> {reportDate}</div>
                <div><strong>เวลา:</strong> {reportTime} น.</div>
              </div>
            </div>

            {reportMode !== 'sign' && reportMode !== 'list' && (
              <div className="report-summary">
                <div className="report-summary-card"><div className="report-summary-label">สมาชิกทั้งหมด</div><div className="report-summary-value">{students.length}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">กำลังศึกษา/ใช้งาน</div><div className="report-summary-value">{activeCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">จบแล้ว</div><div className="report-summary-value">{graduatedCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">พ้นสภาพ</div><div className="report-summary-value">{dismissedCount}</div></div>
                <div className="report-summary-card"><div className="report-summary-label">มีรูปถ่าย</div><div className="report-summary-value">{photoCount}</div></div>
              </div>
            )}

            <div className="report-note">
              <span>หมายเหตุ: รายงานนี้แสดงตามตัวกรองที่เลือกในหน้า “ฐานข้อมูลสมาชิก” ก่อนกดพิมพ์</span>
              <span>{reportMode === 'sign' ? 'รูปแบบ: ใบรายชื่อเซ็นชื่อ' : reportMode === 'list' ? `รูปแบบ: ใบรายชื่อ | รวม ${students.length} รายการ` : `${reportMode === 'table' ? 'รูปแบบ: รายงานตาราง' : 'รูปแบบ: ทำเนียบรูปภาพ'} | รวม ${students.length} รายการ`}</span>
            </div>

            {reportMode === 'table' ? (
            <table className="print-table">
              <thead>
                <tr>
                  <th style={{width:'34px', textAlign:'center'}}>ลำดับ</th>
                  <th style={{width:'58px', textAlign:'center'}}>รูป</th>
                  <th style={{width:'82px'}}>รหัส นศ.</th>
                  <th style={{width:'190px'}}>ชื่อ - นามสกุล</th>
                  <th style={{width:'118px'}}>ระดับ/กลุ่ม</th>
                  <th>สาขาวิชา</th>
                  <th style={{width:'120px'}}>เบอร์โทร / Line</th>
                  <th style={{width:'125px'}}>ฝ่ายที่สนใจ</th>
                  <th style={{width:'78px', textAlign:'center'}}>สถานะ</th>
                </tr>
              </thead>
              <tbody>
                {students.map((s, index) => (
                  <tr key={s.id || index}>
                    <td style={{textAlign:'center'}}>{index + 1}</td>
                    <td style={{textAlign:'center'}}><img src={s.photo || 'https://via.placeholder.com/100?text=NO'} className="print-img mx-auto" /></td>
                    <td>{s.studentId || '-'}</td>
                    <td><div className="print-name">{s.fullName || '-'}</div><div className="print-muted">ชื่อเล่น: {s.nickname || '-'}</div></td>
                    <td><div>{s.level || '-'}</div><div className="print-muted">กลุ่ม {s.group || '-'}</div></td>
                    <td>{s.major || '-'}</td>
                    <td><div>{s.phone || '-'}</div><div className="print-muted">Line: {s.lineId || '-'}</div></td>
                    <td><span className="print-pill">{s.interest || '-'}</span></td>
                    <td style={{textAlign:'center'}}>{statusLabel(s.status)}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            ) : reportMode === 'list' ? (
              <table className="print-table name-list-table">
                <thead>
                  <tr>
                    <th style={{width:'34px', textAlign:'center'}}>ลำดับ</th>
                    <th style={{width:'118px'}}>ชื่อ</th>
                    <th style={{width:'145px'}}>นามสกุล</th>
                    <th style={{width:'92px'}}>รหัสประจำตัว</th>
                    <th style={{width:'64px'}}>ห้อง</th>
                    <th>สาขา</th>
                    <th style={{width:'120px'}}>แผนก</th>
                  </tr>
                </thead>
                <tbody>
                  {students.map((s, index) => {
                    const name = splitThaiFullName(s.fullName);
                    return (
                      <tr key={s.id || index}>
                        <td style={{textAlign:'center'}}>{index + 1}</td>
                        <td><div className="print-name">{name.firstName}</div></td>
                        <td><div className="print-name">{name.lastName}</div></td>
                        <td>{s.studentId || '-'}</td>
                        <td>{s.group || s.room || '-'}</td>
                        <td>{s.major || '-'}</td>
                        <td>{printDepartment(s)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

            ) : reportMode === 'sign' ? (
              <table className="print-table sign-table">
                <thead>
                  <tr>
                    <th style={{width:'34px', textAlign:'center'}}>ลำดับ</th>
                    <th style={{width:'82px'}}>รหัส นศ.</th>
                    <th>ข้อมูลสมาชิก</th>
                    <th style={{width:'135px'}}>ลายเซ็น</th>
                    <th style={{width:'105px'}}>หมายเหตุ</th>
                  </tr>
                </thead>
                <tbody>{students.map((s,index) => <tr key={s.id || index}><td style={{textAlign:'center'}}>{index+1}</td><td>{s.studentId || '-'}</td><td><div className="print-name">{s.fullName || '-'} {s.nickname ? <span className="print-muted">({s.nickname})</span> : null}</div><div className="print-muted">{s.level || '-'} / {s.group || '-'}{s.major ? ` | ${s.major}` : ''}</div></td><td></td><td></td></tr>)}</tbody>
              </table>
            ) : (
              <div className="directory-grid">
                {students.map((s, index) => (
                  <div key={s.id || index} className="directory-card">
                    <img src={s.photo || 'https://via.placeholder.com/120?text=NO'} className="directory-img" />
                    <div className="min-w-0">
                      <div className="directory-nickname">{s.nickname || '-'}</div>
                      <div className="directory-name">{s.fullName || '-'}</div>
                      <div className="directory-meta">รหัส: {s.studentId || '-'} | {s.level || '-'} / {s.group || '-'}</div>
                      <div className="directory-meta">{s.major || '-'}</div>
                      <span className="directory-pill">{s.interest || '-'}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

            <div className="print-footer">
              <div>เอกสารนี้จัดทำจากระบบบริหารชมรม MDEC Photo Club Center</div>
              <div className="signature-zone">
                <div className="signature-line">ผู้จัดทำรายงาน</div>
                <div className="signature-line">ผู้ตรวจสอบ</div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
